name: Opportunity score full (one-shot debug)

# Doc field `recommendations` tren TUNG campaign/adset/ad cua tkqc Noma Viet Nam.
# Edge /act_X/recommendations chi tra 1 muc, thu duong per-object xem co du 5 khong.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Per-object recommendations
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, urllib.parse, urllib.request, urllib.error
          TOKEN=os.environ["FB_ACCESS_TOKEN"]; ACC="1655506672244826"
          def get(path, **p):
              p["access_token"]=TOKEN
              try:
                  with urllib.request.urlopen(f"https://graph.facebook.com/v23.0{path}?{urllib.parse.urlencode(p)}", timeout=60) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try: return {"__err": json.loads(e.read().decode())["error"]["message"][:180]}
                  except Exception: return {"__err":"HTTP "+str(e.code)}

          seen=set()
          def dump(kind, obj):
              recs=(obj.get("recommendations") or [])
              if not recs: return
              print(f"\n  {kind} {obj.get('name','')} ({obj.get('id')})")
              for r in recs:
                  c=r.get("recommendation_content") or r
                  key=(r.get("type"), str(c.get("body"))[:60])
                  print(f"    [{r.get('type')}] +{c.get('opportunity_score_lift','?')}d | {c.get('lift_estimate','')}")
                  print(f"      {str(c.get('body',''))[:300]}")
                  seen.add(key)

          for edge, kind, extra in (("campaigns","CAMP","name,status,recommendations"),
                                    ("adsets","ADSET","name,status,recommendations"),
                                    ("ads","AD","name,status,recommendations")):
              d=get(f"/act_{ACC}/{edge}", fields=extra, limit="50", effective_status='["ACTIVE","PAUSED"]')
              if "__err" in d: print(f"{edge}: {d['__err']}"); continue
              print(f"\n########## {edge}: {len(d.get('data',[]))} doi tuong")
              for o in d.get("data",[]): dump(kind, o)
          print(f"\n>>> TONG {len(seen)} loai khuyen nghi khac nhau")
          PY
