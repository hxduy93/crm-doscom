name: Build Lead-to-Order Funnel

# Join CRM contacts (phone9 + ad_id) với POS orders (phone9 + cod) → funnel theo ad_id.
# Chạy 3 lần/ngày lúc 07:45, 11:45, 15:45 VN (= 00:45, 04:45, 08:45 UTC) —
# sau khi fetch-pancake (:00, timeout 40 phút) đã đẩy xong product-revenue.json.
#
# 2026-08-17 — GIẢM TỪ 18 → 3 lượt/ngày (xem ghi chú ở fetch-pancake.yml).
#
# 2026-08-10 — KHÁC repo cũ: bước lấy CRM contacts được gộp vào ĐÂY thay vì đứng riêng.
# Lý do: data/pancake-crm-contacts.json chứa ~10.000 SĐT khách, repo này PUBLIC nên
# KHÔNG commit file đó (đã cho vào .gitignore). Fetch xong dùng ngay trong cùng job,
# chỉ commit lead-to-order.json (số liệu tổng hợp).
on:
  schedule:
    # Giờ UTC (VN = UTC+7). Chủ dự án chốt 22/08/2026: mọi công cụ cập nhật
    # **2 lần/ngày** — sáng và chiều — **T2–T7, chủ nhật nghỉ** (`1-6`).
    # Bước này chạy 07:45 + 13:45 giờ VN, trước lúc Worker doscom-cron dựng lại
    # dashboard (09:00 và 15:00) — ĐỪNG dời muộn hơn, dashboard sẽ đọc dữ liệu cũ.
    - cron: "45 0,6 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # File này KHÔNG được commit (xem .gitignore) — chỉ tồn tại trong runner.
      - name: Lấy CRM contacts từ Pancake
        env:
          PANCAKE_CRM_API_KEY: ${{ secrets.PANCAKE_CRM_API_KEY }}
          PANCAKE_SHOP_ID: ${{ secrets.PANCAKE_SHOP_ID }}
        run: python scripts/fetch_pancake_crm_contacts.py

      - name: Build lead-to-order funnel
        run: python scripts/build_lead_to_order.py

      - name: Commit lead-to-order data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/lead-to-order.json)" ]; then
            git add data/lead-to-order.json
            git commit -m "chore: auto-build lead-to-order funnel"
            for i in 1 2 3 4 5; do
              git pull --rebase origin master && git push && exit 0
              echo "[retry $i] push bị reject, chờ $((i*5))s rồi rebase lại..."
              sleep $((i*5))
            done
            echo "Push vẫn fail sau 5 lần retry"
            exit 1
          else
            echo "No lead-to-order changes to commit."
          fi
