name: Đọc lại dữ liệu (refresh data)

# Cập nhật data/dashboard-data.json -> commit -> deploy.
# Hẹn giờ do Cloudflare Cron Worker "doscom-cron" điều khiển (dispatch 9h/13h/17h VN — đúng giờ
# hơn GitHub schedule vốn hay trễ vài tiếng). Xem cron-worker/. Ở đây chỉ giữ workflow_dispatch.
# Tự deploy luôn ở cuối workflow khi dữ liệu đổi (vì push bằng GITHUB_TOKEN không kích hoạt deploy.yml).
#
# 2026-08-10 — GỘP PHẦN LẤY DỮ LIỆU TỪ REPO CŨ facebook-ads-dashboard.
# Có 2 đường lấy dữ liệu, chọn bằng repo variable DATA_PIPELINE_ENABLED:
#   = 1  → TỰ RÁP tại repo này (scripts/build_dashboard_data.py, cần FB_ACCESS_TOKEN),
#          ăn các file data/ do cụm workflow fetch-* trong repo này sinh ra.
#   ≠ 1  → đường CŨ: scripts/refresh_data.py đi copy từ repo facebook-ads-dashboard.
# Để 2 đường song song cho tới khi nạp đủ secret + đối chiếu số xong thì bật cờ,
# nhờ vậy merge PR này KHÔNG làm gián đoạn dữ liệu ngày nào.
on:
  workflow_dispatch:        # Worker gọi qua đây + cho phép bấm tay khi cần

permissions:
  contents: write           # cho phép commit data mới

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 20' vì đường mới còn gọi FB Graph API cho 7 tài khoản × 90 ngày (repo cũ để 10').
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── Đường MỚI: tự ráp tại repo này ────────────────────────────────
      - name: Cài thư viện Python
        if: vars.DATA_PIPELINE_ENABLED == '1'
        run: pip install requests openpyxl pyflakes

      # Cổng chặn — bê nguyên từ repo cũ: một lần sửa code để sót biến đã xoá làm
      # workflow chết 2 lượt liên tiếp (NameError lúc chạy). py_compile/ast.parse
      # KHÔNG bắt được vì không phải lỗi cú pháp; pyflakes thì bắt được.
      - name: Kiểm biến chưa định nghĩa (pyflakes)
        if: vars.DATA_PIPELINE_ENABLED == '1'
        run: |
          out=$(python -m pyflakes scripts/*.py || true)
          echo "$out"
          if echo "$out" | grep -q "undefined name"; then
            echo "::error::Có biến chưa định nghĩa — dừng trước khi chạy để không hỏng dữ liệu."
            exit 1
          fi

      - name: Ráp dashboard-data.json (tự lấy dữ liệu)
        if: vars.DATA_PIPELINE_ENABLED == '1'
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: python scripts/build_dashboard_data.py

      # ── Đường CŨ: copy từ repo facebook-ads-dashboard (dùng khi chưa bật cờ) ──
      - name: Đọc lại dữ liệu từ repo cũ (refresh_data.py)
        if: vars.DATA_PIPELINE_ENABLED != '1'
        run: python scripts/refresh_data.py

      # Noma911: giờ đọc LIVE từ D1 riêng của CRM qua /api/noma911/stats — không cần fetch ở đây nữa.

      - name: Commit nếu dữ liệu đổi
        id: commit
        run: |
          git config user.name "crm-refresh-bot"
          git config user.email "kinhdoanh.doscom@gmail.com"
          git add data/dashboard-data.json
          if git diff --cached --quiet; then
            echo "Không có thay đổi dữ liệu."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "refresh data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Bot đẩy bằng GITHUB_TOKEN nên push KHÔNG kích hoạt deploy.yml (chống lặp vô hạn).
      # => Tự deploy ngay tại đây khi có dữ liệu mới, để web Cloudflare luôn cập nhật.
      # Deploy khi dữ liệu đổi HOẶC khi bấm tay (workflow_dispatch) — để thay đổi code (index.html) cũng lên được web.
      # refresh_data.py luôn chạy trước nên data trong dist luôn tươi, không dính lỗi "deploy data cũ".
      # Cổng chất lượng — GIỐNG deploy.yml. Trước đây bước này KHÔNG có, nghĩa là cron
      # (3 lần/ngày) deploy index.html mà bỏ qua test → code hỏng vẫn lên web qua đường này.
      - name: Cài Node
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Chạy test (node --test)
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: node --test tests/*.mjs

      # Danh sách file nằm ở scripts/build-dist.sh — dùng CHUNG với deploy.yml nên không thể lệch.
      - name: Chuẩn bị thư mục deploy (khi dữ liệu đổi hoặc bấm tay)
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: bash scripts/build-dist.sh

      - name: Deploy lên Cloudflare Pages (khi dữ liệu đổi hoặc bấm tay)
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npx wrangler@4 pages deploy dist --project-name=crm-doscom --branch=master --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cffb0c35f8c649872436b2087a64b7bc
