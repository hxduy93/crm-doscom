name: Fetch Google Ads Ad-Level

# Chạy 3 lần/ngày lúc 07:40, 11:40, 15:40 VN (= 00:40, 04:40, 08:40 UTC).
# Lệch 10 phút sau placement (:30) để tránh race condition khi push.
#
# 2026-08-17 — GIẢM TỪ 24 → 3 lượt/ngày (xem ghi chú ở fetch-pancake.yml).
on:
  schedule:
    - cron: "40 0,4,8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ads fetch script
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        run: python scripts/fetch_google_ads_ads.py

      - name: Commit updated ads snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/google-ads-ads.json)" ]; then
            git add data/google-ads-ads.json
            git commit -m "chore: auto-sync Google Ads ad-level (Windsor.ai)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin master && git push && exit 0
              echo "[retry $i] push bị reject, chờ $((i*5))s rồi rebase lại..."
              sleep $((i*5))
            done
            echo "Push vẫn fail sau 5 lần retry"
            exit 1
          else
            echo "No ads-level changes to commit."
          fi
