name: Compute Google Ads Context

# Chạy sau khi 4 workflow fetch Google Ads xong (spend :10; search-terms :20;
# placement :30; ads :40). Gộp 5 file data/*.json → data/google-ads-context.json
# để agent AI đọc.
#
# Chạy 3 lần/ngày lúc 07:55, 11:55, 15:55 VN (= 00:55, 04:55, 08:55 UTC) —
# 15 phút sau lượt fetch cuối cùng.
#
# 2026-08-17 — GIẢM TỪ 48 → 3 lượt/ngày (xem ghi chú ở fetch-pancake.yml).
on:
  schedule:
    - cron: "55 0,4,8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run compute metrics script
        run: python scripts/compute_google_ads_metrics.py

      - name: Commit updated context
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/google-ads-context.json)" ]; then
            git add data/google-ads-context.json
            git commit -m "chore: recompute Google Ads context (v2)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin master && git push && exit 0
              echo "[retry $i] push bị reject, chờ $((i*5))s rồi rebase lại..."
              sleep $((i*5))
            done
            echo "Push vẫn fail sau 5 lần retry"
            exit 1
          else
            echo "No context changes to commit."
          fi
