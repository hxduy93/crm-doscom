name: List promote pages (one-shot debug)

# Liet ke Page ma tkqc duoc phep chay QC (promote_pages) + Page ma cac ad DANG chay dung.
# Chi DOC. Xoa file nay sau khi dung xong.

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inspect account pages
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, urllib.parse, urllib.request

          TOKEN = os.environ["FB_ACCESS_TOKEN"]
          API = "https://graph.facebook.com/v20.0"
          ACC = "1254151326914021"

          def get(path, **params):
              params["access_token"] = TOKEN
              url = f"{API}{path}?{urllib.parse.urlencode(params)}"
              try:
                  with urllib.request.urlopen(url, timeout=60) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return {"__err": e.read().decode()[:400]}

          print(">>> AD DANG CHAY DUNG PAGE NAO")
          d = get(f"/act_{ACC}/ads", limit="50",
                  fields="name,effective_status,creative{object_story_spec,effective_object_story_id,object_type}")
          print(json.dumps(d, ensure_ascii=False, indent=1)[:6000])

          print("\n>>> CAMPAIGN")
          print(json.dumps(get(f"/act_{ACC}/campaigns", limit="50",
                               fields="name,objective,effective_status,created_time"),
                           ensure_ascii=False, indent=1)[:3000])

          print("\n>>> connected page / assigned users / capabilities")
          for f in ("connected_page_backed_instagram_accounts", "promote_pages{id,name}",
                    "capabilities", "business{id,name}", "owner", "user_tasks", "funding_source_details"):
              print(f"-- {f}:", json.dumps(get(f"/act_{ACC}", fields=f), ensure_ascii=False)[:600])

          print("\n>>> PAGE trong BM Yoday Media Retail (1418124406240173)")
          print(json.dumps(get("/1418124406240173/owned_pages", fields="id,name", limit="100"),
                           ensure_ascii=False, indent=1)[:2500])
          print(json.dumps(get("/1418124406240173/client_pages", fields="id,name", limit="100"),
                           ensure_ascii=False, indent=1)[:2500])
          PY
