name: List promote pages (one-shot debug)

# Chi DOC. Xoa file nay sau khi dung xong.

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Identify page used by ads
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, urllib.parse, urllib.request, urllib.error

          TOKEN = os.environ["FB_ACCESS_TOKEN"]
          API = "https://graph.facebook.com/v20.0"

          def get(path, **params):
              params["access_token"] = TOKEN
              url = f"{API}{path}?{urllib.parse.urlencode(params)}"
              try:
                  with urllib.request.urlopen(url, timeout=60) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return {"__err": e.read().decode()[:300]}

          print("PAGE dang chay ad:", json.dumps(get("/1101583133049069", fields="id,name,link,fan_count,category"), ensure_ascii=False))
          print("IG:", json.dumps(get("/17841446784141646", fields="id,username"), ensure_ascii=False))

          print("\n>>> PAGE ID duy nhat trong toan bo ad cua tkqc")
          seen = {}
          d = get("/act_1254151326914021/ads", limit="200", fields="creative{object_story_spec}")
          for ad in d.get("data", []):
              pid = ((ad.get("creative") or {}).get("object_story_spec") or {}).get("page_id")
              if pid: seen[pid] = seen.get(pid, 0) + 1
          for pid, n in seen.items():
              info = get(f"/{pid}", fields="id,name")
              print(f"   {pid} x{n} -> {json.dumps(info, ensure_ascii=False)}")

          print("\n>>> promote_pages cua tkqc (kiem tra lai)")
          print(json.dumps(get("/act_1254151326914021/promote_pages", fields="id,name", limit="50"), ensure_ascii=False))
          PY
