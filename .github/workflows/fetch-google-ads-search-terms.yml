name: Fetch Google Ads Search Terms

# Chạy 3 lần/ngày lúc 07:20, 11:20, 15:20 VN (= 00:20, 04:20, 08:20 UTC).
# Lệch 10 phút sau fetch-google-ads (:10) để tránh race condition khi push.
#
# 2026-08-17 — GIẢM TỪ 24 → 3 lượt/ngày (xem ghi chú ở fetch-pancake.yml).
on:
  schedule:
    # Giờ UTC (VN = UTC+7). Chủ dự án chốt 22/08/2026: mọi công cụ cập nhật
    # **2 lần/ngày** — sáng và chiều — **T2–T7, chủ nhật nghỉ** (`1-6`).
    # Bước này chạy 07:20 + 13:20 giờ VN, trước lúc Worker doscom-cron dựng lại
    # dashboard (09:00 và 15:00) — ĐỪNG dời muộn hơn, dashboard sẽ đọc dữ liệu cũ.
    - cron: "20 0,6 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run search terms fetch script
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        run: python scripts/fetch_google_ads_search_terms.py

      - name: Commit updated search terms snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/google-ads-search-terms.json)" ]; then
            git add data/google-ads-search-terms.json
            git commit -m "chore: auto-sync Google Ads search terms (Windsor.ai)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin master && git push && exit 0
              echo "[retry $i] push bị reject, chờ $((i*5))s rồi rebase lại..."
              sleep $((i*5))
            done
            echo "Push vẫn fail sau 5 lần retry"
            exit 1
          else
            echo "No search terms changes to commit."
          fi
