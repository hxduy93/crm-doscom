name: List ALL Pancake order sources (one-shot debug)

# Liệt kê mọi order source kèm ID + đánh dấu nguồn nào CHƯA khai trong
# SOURCE_GROUPS của scripts/fetch_pancake_revenue.py.
# Dùng khi doanh số 1 nhân sự trên dashboard thấp hơn Pancake POS.

on:
  workflow_dispatch:
    inputs:
      scan_days:
        description: "Số ngày quét ngược (fallback khi không có endpoint danh mục)"
        required: false
        default: "45"

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: List all Pancake order sources
        env:
          PANCAKE_API_KEY: ${{ secrets.PANCAKE_API_KEY }}
          PANCAKE_SHOP_ID: ${{ secrets.PANCAKE_SHOP_ID }}
          SCAN_DAYS: ${{ inputs.scan_days }}
        run: python scripts/list_all_order_sources.py
