name: Pixel map probe (one-shot debug)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pixel assignment
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, urllib.parse, urllib.request, urllib.error
          TOKEN=os.environ["FB_ACCESS_TOKEN"]
          BM_OWNER="2159592564530249"; BM_YODAY="1418124406240173"
          PIX={"2082661435656423":"NOMA 230","1045069881269455":"NOMA 350","1281580350573958":"NOMA 680"}
          def get(path,**p):
              p["access_token"]=TOKEN
              try:
                  with urllib.request.urlopen(f"https://graph.facebook.com/v23.0{path}?{urllib.parse.urlencode(p)}",timeout=60) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try: return {"__err": json.loads(e.read().decode())["error"]["message"][:130]}
                  except Exception: return {"__err":"HTTP "+str(e.code)}
          for pid,ten in PIX.items():
              d=get(f"/{pid}", fields="id,name,owner_business")
              ob=(d.get("owner_business") or {}).get("name","?")
              print(f"\n=== {ten} ({pid}) — chu so huu: {ob}")
              for bm,nhan in ((BM_OWNER,"BM Doscom Holldings"),(BM_YODAY,"BM YODAY")):
                  r=get(f"/{pid}/shared_accounts", business=bm, fields="account_id,name", limit="50")
                  if "__err" in r: print(f"   {nhan}: {r['__err']}"); continue
                  acc=r.get("data",[])
                  print(f"   {nhan}: {len(acc)} tkqc" + (" -> " + ", ".join(a.get('name','?')[:34] for a in acc) if acc else ""))
          PY
