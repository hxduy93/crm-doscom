name: Pixel map probe (one-shot debug)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pixel map
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, urllib.parse, urllib.request, urllib.error
          TOKEN=os.environ["FB_ACCESS_TOKEN"]
          WANT={"2082661435656423":"NOMA 230","1045069881269455":"NOMA 350","1281580350573958":"NOMA 680"}
          ACCS=["1254151326914021","1655506672244826","764394829882083","927390616363424",
                "1449385949897024","906015559004892","1416634670476226"]
          def get(path,**p):
              p["access_token"]=TOKEN
              try:
                  with urllib.request.urlopen(f"https://graph.facebook.com/v23.0{path}?{urllib.parse.urlencode(p)}",timeout=60) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try: return {"__err": json.loads(e.read().decode())["error"]["message"][:120]}
                  except Exception: return {"__err":"HTTP "+str(e.code)}
          for a in ACCS:
              d=get(f"/act_{a}", fields="name,adspixels.limit(30){id,name},promote_pages.limit(20){id,name}")
              if "__err" in d: print(a, d["__err"]); continue
              ids={p["id"] for p in (d.get("adspixels") or {}).get("data",[])}
              co=[v for k,v in WANT.items() if k in ids]
              pg=[f"{p['id']}" for p in (d.get("promote_pages") or {}).get("data",[])]
              print(f"{d['name'][:44]:46s} | pixel co: {', '.join(co) or '-':22s} | page: {', '.join(pg) or '-'}")
          PY
