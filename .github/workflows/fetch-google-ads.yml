name: Fetch Google Ads Spend

# Chạy 3 lần/ngày lúc 07:10, 11:10, 15:10 VN (= 00:10, 04:10, 08:10 UTC) —
# fetch Google Ads spend từ Windsor.ai JSON API, transform thành
# data/google-ads-spend.json theo schema dashboard.
#
# 2026-08-17 — GIẢM TỪ 48 → 3 lượt/ngày (xem ghi chú ở fetch-pancake.yml).
# Fetch dày hơn là vô ích: dashboard chỉ dựng lại 3 lần/ngày (9h/13h/17h VN).
#
# Yêu cầu GitHub Secret:
#   WINDSOR_API_KEY  — lấy từ https://onboard.windsor.ai/ → Data Sources → JSON API
on:
  schedule:
    # Giờ UTC (VN = UTC+7). Chủ dự án chốt 22/08/2026: mọi công cụ cập nhật
    # **2 lần/ngày** — sáng và chiều — **T2–T7, chủ nhật nghỉ** (`1-6`).
    # Bước này chạy 07:10 + 13:10 giờ VN, trước lúc Worker doscom-cron dựng lại
    # dashboard (09:00 và 15:00) — ĐỪNG dời muộn hơn, dashboard sẽ đọc dữ liệu cũ.
    - cron: "10 0,6 * * 1-6"
  workflow_dispatch:            # cho phép chạy thủ công từ tab Actions

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Windsor.ai fetch script
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        run: python scripts/fetch_google_ads_spend.py

      - name: Commit updated Google Ads spend snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/google-ads-spend.json)" ]; then
            git add data/google-ads-spend.json
            git commit -m "chore: auto-sync Google Ads spend snapshot (Windsor.ai)"
            # Retry + rebase để tránh race condition với fetch-pancake chạy cùng lúc
            for i in 1 2 3 4 5; do
              git pull --rebase origin master && git push && exit 0
              echo "[retry $i] push bị reject, chờ $((i*5))s rồi rebase lại..."
              sleep $((i*5))
            done
            echo "Push vẫn fail sau 5 lần retry"
            exit 1
          else
            echo "No Google Ads changes to commit."
          fi
