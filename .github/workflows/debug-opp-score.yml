name: Opportunity score probe (one-shot debug)

# Doc Diem co hoi + TOAN BO khuyen nghi cua tung tkqc. Chi DOC.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe opportunity score
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, urllib.parse, urllib.request, urllib.error

          TOKEN=os.environ["FB_ACCESS_TOKEN"]
          ACCS=[("1655506672244826","DOSCOM HOLDINGS - Noma Viet Nam"),
                ("1254151326914021","CONG TY CP DOSCOM"),
                ("764394829882083","Doscom - Noma.vn"),
                ("927390616363424","Doscom - Cong nghe nang tam cuoc song"),
                ("1449385949897024","HOLDINGS - Cong nghe nang tam cuoc song"),
                ("906015559004892","Doscom Mart"),
                ("1416634670476226","HOLDINGS - Doscom Mart")]

          def get(path, **p):
              p["access_token"]=TOKEN
              url=f"https://graph.facebook.com/v23.0{path}?{urllib.parse.urlencode(p)}"
              try:
                  with urllib.request.urlopen(url, timeout=60) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try: return {"__err": json.loads(e.read().decode())["error"]["message"][:200]}
                  except Exception: return {"__err": "HTTP "+str(e.code)}

          for acc, ten in ACCS:
              s=get(f"/act_{acc}", fields="opportunity_score,name")
              print(f"\n{'='*70}\n{ten} ({acc}) — DIEM CO HOI: {s.get('opportunity_score','?')}")
              rec=get(f"/act_{acc}/recommendations")
              if "__err" in rec: print("   loi doc khuyen nghi:", rec["__err"]); continue
              groups=rec.get("data") or []
              n=0
              for gtag in groups:
                  for r in (gtag.get("recommendations") or []):
                      n+=1
                      c=r.get("recommendation_content") or {}
                      print(f"\n  [{r.get('type')}] +{c.get('opportunity_score_lift','?')} diem")
                      if c.get("title"): print(f"     {c['title']}")
                      if c.get("lift_estimate"): print(f"     uoc tinh: {c['lift_estimate']}")
                      if c.get("body"): print(f"     {str(c['body'])[:400]}")
                      ids=r.get("object_ids") or []
                      if ids: print(f"     ap dung cho: {', '.join(map(str,ids[:6]))}")
              if not n: print("   (khong co khuyen nghi nao)")
          PY
