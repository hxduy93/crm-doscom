name: Adset lifecycle probe (one-shot debug)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, urllib.parse, urllib.request, urllib.error
          TOKEN=os.environ["FB_ACCESS_TOKEN"]
          ACCS=["1655506672244826","1254151326914021","764394829882083"]
          def get(path,**p):
              p["access_token"]=TOKEN
              try:
                  with urllib.request.urlopen(f"https://graph.facebook.com/v23.0{path}?{urllib.parse.urlencode(p)}",timeout=60) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try: return {"__err": json.loads(e.read().decode())["error"]["message"][:150]}
                  except Exception: return {"__err":"HTTP "+str(e.code)}

          target=None
          print(">>> AD SET MOI NHAT (10 cai)")
          for a in ACCS:
              d=get(f"/act_{a}/adsets", fields="id,name,created_time,existing_customer_budget_percentage",
                    limit="10")
              if "__err" in d: print(f"  act_{a}: {d['__err']}"); continue
              rows=sorted(d.get("data",[]), key=lambda x: x.get("created_time",""), reverse=True)[:5]
              for r in rows:
                  ecb=r.get("existing_customer_budget_percentage","(khong co field)")
                  print(f"  {r.get('created_time','')[:16]} | ecb={ecb!s:18s} | {r.get('name','')[:52]}")
                  if target is None and " - TEST" in (r.get("name") or ""): target=r["id"]

          if target:
              print(f"\n>>> DO TUNG FIELD UNG VIEN tren ad set {target}")
              for f in ["existing_customer_budget_percentage","customer_lifecycle_strategy",
                        "lifecycle_strategy","customer_acquisition","is_new_customer_acquisition",
                        "new_customer_acquisition","audience_lifecycle","optimization_sub_event",
                        "targeting_optimization_types","brand_safety_content_filter_levels"]:
                  r=get(f"/{target}", fields=f)
                  print(f"   {f:38s} -> {json.dumps(r, ensure_ascii=False)[:150]}")
          PY
