name: Fetch FB Ads Insights

# Chạy 3 lần/ngày lúc 08:00, 12:00, 16:00 VN (= 01:00, 05:00, 09:00 UTC) —
# fetch Facebook Ads insights từ Meta Marketing API cho 6 ad accounts Doscom,
# save vào data/fb-ads-data.json. Chốt sổ 1 tiếng trước mốc refresh dashboard.
#
# 2026-08-17 — GIẢM TỪ 8 → 3 lượt/ngày (xem ghi chú ở fetch-pancake.yml).
#
# Yêu cầu GitHub Secret:
#   FB_ACCESS_TOKEN  — Long-lived User Access Token từ Meta (hết hạn ~60 ngày)
#                      Lấy từ: developers.facebook.com/tools/explorer → Generate → Extend
on:
  schedule:
    # Giờ UTC (VN = UTC+7). Chủ dự án chốt 22/08/2026: mọi công cụ cập nhật
    # **2 lần/ngày** — sáng và chiều — **T2–T7, chủ nhật nghỉ** (`1-6`).
    # Bước này chạy 08:00 + 14:00 giờ VN, trước lúc Worker doscom-cron dựng lại
    # dashboard (09:00 và 15:00) — ĐỪNG dời muộn hơn, dashboard sẽ đọc dữ liệu cũ.
    - cron: "0 1,7 * * 1-6"
  workflow_dispatch:            # cho phép chạy thủ công từ tab Actions

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run FB Ads fetch script
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: python scripts/fetch_fb_ads.py

      - name: Commit updated FB Ads snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/fb-ads-data.json)" ]; then
            git add data/fb-ads-data.json
            git commit -m "chore: auto-sync FB Ads insights snapshot (Meta API)"
            # Retry + rebase để tránh race condition với các workflow khác
            for i in 1 2 3 4 5; do
              git pull --rebase origin master && git push && exit 0
              echo "[retry $i] push bị reject, chờ $((i*5))s rồi rebase lại..."
              sleep $((i*5))
            done
            echo "Push vẫn fail sau 5 lần retry"
            exit 1
          else
            echo "No FB Ads changes to commit."
          fi
