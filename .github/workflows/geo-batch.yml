name: GEO Monitor — batch processor (CRM)

# Port từ facebookadsallinone. Endpoint /api/geo/* của CRM đang MỞ (không có
# _middleware) → không cần X-Test-Token. Cần các secret GEO trên Cloudflare Pages
# (OPENAI_API_KEY, GEMINI_API_KEY, ANTHROPIC_API_KEY…) thì run-batch mới query được.
#
# CHI PHÍ (đo thật trên geo_runs, 28/08/2026): gemini $0,00037/lượt — coi như miễn phí;
# chatgpt $0,025/lượt vì tool web_search tính tiền cố định theo LƯỢT. Từ 28/08 chatgpt
# chạy theo TẦNG (migration 0023 + _utils/query-tier.js) nên mỗi ngày chỉ còn ~11 job
# chatgpt thay vì 44 → ~$7,9/tháng thay vì ~$17,5.
on:
  schedule:
    # 2026-08-17 — GIẢM TỪ 48 → 6 lượt/ngày (xem ghi chú ở fetch-pancake.yml).
    # 2026-08-28 — TĂNG LẠI 6 → 12 lượt/ngày. Lý do: 6 tick × 6 job = 36 job/ngày mà
    # mỗi ngày tạo ra 44 gemini + ~11 chatgpt ≈ 55 job → hàng đợi phình (đã tồn 1.297
    # job, cái cũ nhất 3 tuần, tức số GEO trên giao diện đang đo thế giới của 3 tuần
    # trước). 12 tick × 6 = 72 job/ngày mới theo kịp và tiêu hết tồn.
    # KHÔNG tăng batch size thay cho tần suất: 6 job/lượt là mức vừa với timeout 30s
    # của Pages Functions khi cả 6 đều là chatgpt web_search.
    - cron: '0 */2 * * *'    # 2 giờ/tick, idempotent
  workflow_dispatch:

concurrency:
  group: geo-batch
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create daily jobs (idempotent)
        run: |
          echo "::group::Create daily jobs"
          HTTP_CODE=$(curl -s -o /tmp/jobs.json -w "%{http_code}" \
            -X POST 'https://crm-doscom.pages.dev/api/geo/jobs' \
            -H "Content-Type: application/json" \
            -d '{"runs_per_query": 1}')
          echo "HTTP $HTTP_CODE"; cat /tmp/jobs.json; echo ""
          if [ "$HTTP_CODE" -ge 400 ]; then echo "::error::jobs failed (HTTP $HTTP_CODE)"; exit 1; fi
          echo "::endgroup::"

      - name: Process batch (6 jobs)
        run: |
          echo "::group::Process batch"
          HTTP_CODE=$(curl -s -o /tmp/batch.json -w "%{http_code}" \
            -X POST 'https://crm-doscom.pages.dev/api/geo/run-batch' \
            -H "Content-Type: application/json" \
            -d '{"limit": 6}')
          echo "HTTP $HTTP_CODE"; cat /tmp/batch.json; echo ""
          if [ "$HTTP_CODE" -ge 400 ]; then echo "::error::batch failed (HTTP $HTTP_CODE)"; exit 1; fi
          echo "::endgroup::"

      - name: Summary
        if: always()
        run: |
          echo "## GEO Monitor batch summary" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat /tmp/jobs.json 2>/dev/null || echo "no jobs output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat /tmp/batch.json 2>/dev/null || echo "no batch output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
