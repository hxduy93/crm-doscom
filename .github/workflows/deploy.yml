name: Deploy lên Cloudflare Pages

# Tự động deploy MỖI KHI push code lên master (không cần cron, không cần bấm tay).
# Cũng chạy tay được qua tab Actions → Run workflow.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Cài Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Cổng chất lượng: test ĐỎ → job fail → KHÔNG deploy (theo AGENTS.md).
      - name: Chạy test (node --test)
        run: node --test tests/*.mjs

      # Danh sách file nằm ở scripts/build-dist.sh — dùng CHUNG với refresh-data.yml
      # để hai đường deploy không bao giờ lệch nhau.
      - name: Chuẩn bị thư mục deploy (index.html + data + demos + trang standalone)
        run: bash scripts/build-dist.sh

      # Áp migration D1 TRƯỚC khi deploy code (để schema sẵn sàng khi function mới chạy).
      # best-effort: continue-on-error để token thiếu quyền D1 không chặn deploy code.
      # Lệnh idempotent — đã áp rồi thì báo "no migrations to apply".
      - name: Áp migration D1 (best-effort)
        continue-on-error: true
        run: npx wrangler@4 d1 migrations apply crm-doscom-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cffb0c35f8c649872436b2087a64b7bc

      - name: Deploy lên Cloudflare Pages
        run: npx wrangler@4 pages deploy dist --project-name=crm-doscom --branch=master --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: cffb0c35f8c649872436b2087a64b7bc
