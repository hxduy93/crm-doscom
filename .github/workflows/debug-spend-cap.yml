name: Spend cap check (one-shot debug)

# Doc gioi han chi tieu / da chi tieu cua MOI tkqc de biet TK nao sap dung QC. Chi DOC.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Spend caps
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, urllib.parse, urllib.request, urllib.error
          TOKEN=os.environ["FB_ACCESS_TOKEN"]
          ACCS=["1655506672244826","1254151326914021","764394829882083","927390616363424",
                "1449385949897024","906015559004892","1416634670476226"]
          def get(path, **p):
              p["access_token"]=TOKEN
              try:
                  with urllib.request.urlopen(f"https://graph.facebook.com/v23.0{path}?{urllib.parse.urlencode(p)}", timeout=60) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try: return {"__err": json.loads(e.read().decode())["error"]["message"][:160]}
                  except Exception: return {"__err":"HTTP "+str(e.code)}
          def vnd(x):
              try: return f"{int(x):,}".replace(",", ".")+"d"
              except Exception: return str(x)
          for a in ACCS:
              d=get(f"/act_{a}", fields="name,account_status,spend_cap,amount_spent,balance,currency,opportunity_score")
              if "__err" in d: print(f"act_{a}: {d['__err']}"); continue
              cap=int(d.get("spend_cap") or 0); spent=int(d.get("amount_spent") or 0)
              con = cap-spent if cap else None
              # chi tieu 7 ngay gan nhat de uoc con may ngay
              ins=get(f"/act_{a}/insights", date_preset="last_7d", fields="spend")
              w=0.0
              try: w=float((ins.get("data") or [{}])[0].get("spend") or 0)
              except Exception: pass
              con_ngay = (con/(w/7)) if (con is not None and w>0) else None
              print(f"\n{d.get('name')} ({a}) — trang thai {d.get('account_status')} · diem {d.get('opportunity_score','?')}")
              print(f"   gioi han: {vnd(cap) if cap else '(khong dat)'} | da chi: {vnd(spent)} | con: {vnd(con) if con is not None else '-'}")
              print(f"   chi 7 ngay: {vnd(int(w))} (~{vnd(int(w/7))}/ngay)" + (f" -> con ~{con_ngay:.1f} ngay" if con_ngay is not None else ""))
          PY
