name: Page access recheck (one-shot debug)

# Kiem tra token da THAY trang 1101583133049069 chua sau khi cap quyen tren BM.
# Chi DOC.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Recheck page access
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, urllib.parse, urllib.request, urllib.error
          TOKEN=os.environ["FB_ACCESS_TOKEN"]
          PAGE="1101583133049069"; ACC="1254151326914021"
          def get(path, **p):
              p["access_token"]=TOKEN
              try:
                  with urllib.request.urlopen(f"https://graph.facebook.com/v23.0{path}?{urllib.parse.urlencode(p)}", timeout=60) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try: return {"__err": json.loads(e.read().decode())["error"]["message"][:220]}
                  except Exception: return {"__err":"HTTP "+str(e.code)}

          print("1) TOKEN DOC DUOC TRANG CHUA?")
          print("  ", json.dumps(get(f"/{PAGE}", fields="id,name,fan_count"), ensure_ascii=False)[:300])

          print("\n2) TRANG CO TRONG /me/accounts CHUA?")
          d=get("/me/accounts", fields="id,name,tasks", limit="200")
          if "__err" in d: print("  ", d["__err"])
          else:
              hit=[p for p in d.get("data",[]) if p["id"]==PAGE]
              print(f"   tong {len(d.get('data',[]))} trang · trang can tim: "
                    + (json.dumps(hit[0], ensure_ascii=False) if hit else "CHUA CO"))

          print("\n3) PROMOTE_PAGES CUA TKQC CP DOSCOM")
          print("  ", json.dumps(get(f"/act_{ACC}", fields="name,promote_pages{id,name}"), ensure_ascii=False)[:500])

          print("\n4) TKQC DA CHAY DUOC CHUA (trang + trang thai + tran chi tieu)")
          print("  ", json.dumps(get(f"/act_{ACC}", fields="account_status,spend_cap,amount_spent,adspixels.limit(20){id,name}"), ensure_ascii=False)[:600])
          PY
