name: Page access recheck (one-shot debug)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Recheck
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, urllib.parse, urllib.request, urllib.error
          TOKEN=os.environ["FB_ACCESS_TOKEN"]; PAGE="1101583133049069"; ACC="1254151326914021"
          def get(path, **p):
              p["access_token"]=TOKEN
              try:
                  with urllib.request.urlopen(f"https://graph.facebook.com/v23.0{path}?{urllib.parse.urlencode(p)}", timeout=60) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try: return {"__err": json.loads(e.read().decode())["error"]["message"][:160]}
                  except Exception: return {"__err":"HTTP "+str(e.code)}
          d=get("/me/accounts", fields="id,name", limit="200")
          n=len(d.get("data",[])) if "data" in d else -1
          hit=[p for p in d.get("data",[]) if p["id"]==PAGE] if "data" in d else []
          print(f"me/accounts: {n} trang · trang {PAGE}: " + ("CO" if hit else "CHUA CO"))
          print("doc thang trang:", json.dumps(get(f"/{PAGE}", fields="id,name"), ensure_ascii=False)[:180])
          print("promote_pages:", json.dumps(get(f"/act_{ACC}", fields="promote_pages{id,name}"), ensure_ascii=False)[:300])
          PY
