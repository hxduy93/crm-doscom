name = "crm-doscom"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# D1 riêng của CRM (đơn đăng ký Noma911). Binding tên DB để khớp functions/.
[[d1_databases]]
binding = "DB"
database_name = "crm-doscom-db"
database_id = "73cfb6ca-b9b4-4a9b-b74f-1a030f8db1d0"

# KV cho Agent FB Ads: cache kết quả audit + bộ nhớ lịch sử campaign + fb_config.
# Dùng LẠI namespace DOSCOM_INVENTORY của dashboard cũ (cùng tài khoản CF).
[[kv_namespaces]]
binding = "INVENTORY"
id = "3efb5b02ea844d67ade8d070547ae707"

# Workers AI — fallback Llama khi Claude lỗi (qua AI Gateway 'doscom-erp').
[ai]
binding = "AI"

# Vars (plaintext). Secret set riêng qua: npx wrangler pages secret put <NAME> --project-name crm-doscom
#   - ANTHROPIC_API_KEY  (Claude)
#   - FB_ACCESS_TOKEN    (Meta token có quyền trên TK 927390616363424 — cho /api/optimizer/* + tạo camp)
#   - OPTIMIZER_TOKEN    (mật khẩu để LƯU danh sách bảo vệ / shadow / killswitch từ UI)
#   - FB_EXPORT_TOKEN    (Bearer token cho /api/export/fb-ad-spend — đối tác facebook-data-sync kéo data)
#   - LARK_APP_ID        (App ID custom app Lark — cho /api/lark/*)
#   - LARK_APP_SECRET    (App Secret Lark)
[vars]
CF_ACCOUNT_ID = "cffb0c35f8c649872436b2087a64b7bc"
# Model OpenAI dùng khi Claude không gọi được (xem functions/api/geo/_utils/openai-chat.js).
# ĐO THẬT 19/08/2026, cùng prompt yêu cầu 2000 từ:
#   claude-haiku-4-5  ~1.872 từ/bài (158 bài)  ~$0,03
#   gpt-4o-mini         ~790 từ/bài            ~$0,002
#   gpt-4o              ~670 từ/bài            ~$0,032   ← đắt gấp 16 lần mà còn ngắn hơn
# Nhắc lại yêu cầu độ dài ở cuối prompt cũng không kéo dài thêm (642 từ). Nên chọn bản rẻ:
# đây là đường lui tạm trong lúc key Claude bị từ chối, bài vẫn phải người duyệt trước khi đăng.
OPENAI_CONTENT_MODEL = "gpt-4o-mini"
# URL Worker agent tối ưu (để UI xem agent vừa làm gì).
OPTIMIZER_WORKER_URL = "https://fb-ads-auto-agent.doscom-vietnam.workers.dev"
# Lark Base "Hiep_Tiktokshop_Auto" (dữ liệu TikTok Shop). Base nằm trong WIKI nên
# đây là NODE TOKEN, không phải app_token — lib/lark.js tự đổi qua app_token
# (Sdv5b0LfoaEiIZsS6yHlTX41gid) rồi cache KV 24h. Không phải secret (nằm sẵn trên URL).
LARK_WIKI_TOKEN = "JBVvwm5veis1lbkUpTZlMqhFg6e"
