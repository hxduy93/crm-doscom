// Giờ VN (UTC+7) theo định dạng input datetime-local: "YYYY-MM-DDTHH:MM".
// (Bị bỏ sót khi copy panel từ dashboard cũ → thiếu hàm này khiến trang trắng.)
function nowVnDatetime() {
  const d = new Date(Date.now() + 7 * 3600 * 1000); // dời sang giờ VN rồi đọc theo UTC
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}T${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`;
}

  const buildUtmString = (ad) => {

    return params.toString()

    setAiTargetAdId(targetAdId)

    setAiError("")
    setAiVariants([])
    setAiSelectedId(null)
    try {
      const notes = [
        aiKeyword ? `Từ khóa chính phải có: ${aiKeyword}` : "",
        aiDirection ? `Hướng content: ${aiDirection}` : "",
      ].filter(Boolean).join(" | ")

      // Chọn tay 1 dạng thì chỉ ra 1 bài đúng dạng đó. Để "Tự xoay" thì mỗi lần
      // bấm lấy bộ 3 dạng KHÁC lần trước (aiRound tăng dần) — server không tự
      // random, biến thiên do client đẩy sang, nên vẫn tái hiện được.
      const round = aiRound + 1
      setAiRound(round)
      const res = await fetch("/api/generate-ad-copy", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          product,
          format: objective,
          formatLabel: (OBJECTIVES[objective] || {}).label || objective,
          cta: (ads.find(a => a.id === targetAdId) || {}).cta || "LEARN_MORE",
          notes,
          promotion: aiPromotion.trim(),
          // Link đích của chính ad đang sinh content → bài trả về gắn link sẵn.
          link: (ads.find(a => a.id === targetAdId) || {}).link || "",
          ...(aiStyle ? { styles: [aiStyle], count: 1 } : { count: 3, seed: product, rotate: round }),
        }),
      })
      const data = await res.json()
      if (!res.ok || !data.variants) {
        throw new Error(data.error || "Lỗi không xác định")
      }
      setAiVariants(data.variants)
    } catch (err) {
      setAiError(err.message)
    } finally {
      setAiLoading(false)
    }
  }

  // Thay {{URL}} bằng link thật. Server đã thay 1 lần lúc sinh content, nhưng link
  // có thể bị sửa SAU đó nên phải thay lại ở mọi chặng — sót là quảng cáo chạy với
  // chữ "{{URL}}" nằm giữa bài. Bắt rộng cả {URL} và {{ URL }}.
  const fillUrl = (text, link) => {
    const l = String(link || "").trim()
    if (!l) return String(text || "")
    return String(text || "").replace(/\{\{?\s*URL\s*\}?\}/gi, l)
  }

  // ── Hotline trong bài quảng cáo ────────────────────────────────────────────
  // Meta chỉ cho MỘT nút CTA trên mỗi quảng cáo, nên "nút Mua ngay + nút gọi"
  // cùng lúc là không đặt được qua Marketing API. Cách chắc chắn: giữ nút mua
  // hàng và đưa số hotline vào NỘI DUNG bài (khách bấm số trên điện thoại là gọi).
  // Đã có số trong bài rồi thì không chèn thêm lần nữa.
  const digitsOf = (s) => String(s || "").replace(/[^\d+]/g, "")
  const telLink = (s) => "tel:" + digitsOf(s)
  const withHotline = (text, ph) => {
    const t = String(text || "")
    const d = digitsOf(ph)
    if (!d) return t
    // So theo chữ số để "1900 638 597" và "1900638597" tính là một.
    if (t.replace(/[^\d]/g, "").includes(d.replace(/[^\d]/g, ""))) return t
    return `${t.replace(/\s+$/, "")}\n📞 Hotline: ${String(ph).trim()}`
  }

  //
  // Có url thì chỉ gửi LINK cho /api/fb-upload-media và ĐỂ FACEBOOK TỰ TẢI. Nhờ
  // vậy byte không đi qua trình duyệt lẫn Cloudflare → mất hẳn trần ~30MB của lối
  // cũ (Meta cho video tới 4GB). Chỉ khi FB không tải được link mới quay về lối cũ.
  //
  // Video nặng/dài thì FB encode lâu: server cắt mỗi lượt đợi ở ~55s và trả
  // can_retry_poll + video_id, ở đây gọi lại tới khi xong — không còn "hết giờ".
  const POLL_MAX = 10   // 10 lượt × ~55s ≈ 9 phút, thừa cho video vài trăm MB

  const fbMediaRequest = async (payload) => {
    const init = payload instanceof FormData
      ? { method: "POST", body: payload }
      : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }
    const r = await fetch("/api/fb-upload-media", init)
    return (await r.json().catch(() => ({}))) || {}
  }

  const uploadMediaToFb = async (item, accountId, onLog = () => {}) => {
    const kind = item.kind || "video"
    let d = null

    // 1) Có link → để Facebook tự tải, không giới hạn dung lượng.
    if (item.url && kind === "video") {
      onLog("gửi link cho Facebook tự tải…")
      const res = await fbMediaRequest({
        file_url: item.url, account_id: accountId, kind: "video", name: item.name,
      })
      if (res.fallback_client_upload) {
        onLog(`Facebook không tải được link (${res.error}) → tải qua trình duyệt.`)
      } else {
        d = res
      }
    }

    // 2) Lối thường: đẩy file qua Cloudflare (link hỏng thì tải về trình duyệt trước).
    if (!d) {
      let file = item.file
      if (!file) {
        onLog("đang tải video về trình duyệt…")
        const blob = await (await fetch(item.url)).blob()
        if (blob.size < 10240) throw new Error("file tải về quá nhỏ, có thể hỏng")
        file = new File([blob], item.name || "video.mp4", { type: blob.type || "video/mp4" })
      }
      const fd = new FormData()
      fd.append("file", file, file.name)
      fd.append("account_id", accountId)
      fd.append("kind", kind)
      d = await fbMediaRequest(fd)
    }

    // 3) FB còn đang xử lý → gọi lại kèm video_id cho tới khi xong.
    let tries = 0
    while (!d.ok && d.can_retry_poll && d.video_id && tries < POLL_MAX) {
      tries++
      onLog(`Facebook đang xử lý video, đợi tiếp (lượt ${tries}/${POLL_MAX})…`)
      d = await fbMediaRequest({ video_id: d.video_id, kind: "video" })
    }
    if (!d.ok) throw new Error(`[${d.step || "?"}] ${d.error || "upload lỗi"}`)
    return d
  }

  const handleConfirm = async () => {
    setStatus("sending")
    const config = buildSummary()

    // Backup config to localStorage (safety net if endpoint fails)
    try {
      const pending = JSON.parse(localStorage.getItem("doscom_pending_ads") || "[]")
      pending.push(config)
      localStorage.setItem("doscom_pending_ads", JSON.stringify(pending))
    } catch(e) {}

    // ─── Step 1: Upload từng media qua /api/fb-upload-media ───
    // Tách step này ra để mỗi upload là 1 request riêng — không bị Cloudflare cắt
    // ở giữa lúc đợi FB xử lý video (helper tự gọi lại tới khi FB xong).
    try {
      for (let i = 0; i < ads.length; i++) {
        const a = ads[i]
        if (!a.videoFile && !a.imageFile) {
          throw new Error(`Ad #${i + 1} thiếu video hoặc ảnh`)
        }
        const file = a.videoFile || a.imageFile
        const kind = a.videoFile ? "video" : "image"
        setStatusMsg(`Đang upload ${kind} của Ad #${i + 1}/${ads.length}... ${kind === 'video' ? '(video cần ~10-25s để FB xử lý)' : ''}`)

        let data
        try {
          data = await uploadMediaToFb({ file, kind }, config.account_id,
            (m) => setStatusMsg(`Ad #${i + 1}/${ads.length} — ${m}`))
        } catch (upErr) {
          throw new Error(`[upload Ad #${i + 1}] ${upErr.message}`)
        }
        // Inject media IDs vào config.ads[i]
        if (data.kind === "video") {
          config.ads[i].video_id = data.video_id
          config.ads[i].thumbnail_url = data.thumbnail_url
        } else {
          config.ads[i].image_hash = data.image_hash
        }
      }
    } catch (e) {
      setStatus("error")
      setStatusMsg(`Lỗi upload media: ${e.message}\n\nConfig đã backup vào localStorage. Đợi 30-60s rồi thử lại — video đã upload sẽ ready ở lần sau.`)
      return
    }

    // ─── Step 2: Tạo campaign + adset + ads với media IDs đã sẵn ───
    setStatusMsg("Đã upload xong media. Đang tạo campaign + adset + ads trên Meta Ads...")
    try {
      const fd2 = new FormData()
      fd2.append("config", JSON.stringify(config))
      // KHÔNG kèm file nữa — endpoint sẽ dùng video_id/image_hash trong config

      const res = await fetch("/api/create-campaign", { method: "POST", body: fd2 })
      const data = await res.json()
      if (!res.ok || !data.success) {
        const step = data.step || "unknown"
        const partialMsg = data.partial ? ` (đã tạo: ${JSON.stringify(data.partial)})` : ""
        throw new Error(`[${step}] ${data.error || "Lỗi không xác định"}${partialMsg}`)
      }
      setStatus("done")
      setStatusMsg(JSON.stringify({
        ok: true,
        campaign_id: data.campaign_id,
        adset_id: data.adset_id,
        ads_created: (data.ads || []).length,
        open_in_ads_manager: data.ads_manager_url,
      }, null, 2))
    } catch (e) {
      setStatus("error")
      setStatusMsg(`Lỗi: ${e.message}\n\nConfig đã backup vào localStorage — có thể paste vào chat Claude để tạo bằng tay.`)
    }
  }

  // ══════════ HANDLERS CHẾ ĐỘ TỰ ĐỘNG ══════════
  // Quét folder: gom video theo folder cha trực tiếp = 1 sản phẩm = 1 campaign.
  const handleAutoFolderSelect = (e) => {
    const files = Array.from(e.target.files || [])
    const vids = files.filter(f =>
      /\.(mp4|mov|m4v|avi|mkv|webm)$/i.test(f.name) || (f.type || "").startsWith("video")
    )
    const byFolder = {}
    for (const f of vids) {
      const rel = f.webkitRelativePath || f.name
      const parts = rel.split("/")
      const folder = parts.length > 1 ? parts[parts.length - 2] : "(gốc)"
      ;(byFolder[folder] = byFolder[folder] || []).push(f)
    }
    setAutoGroups(Object.entries(byFolder).map(([product, fs]) => ({ product, files: fs })))
    setAutoResults([])
    setAutoLog([])
    setAutoExisting(null) // folder đổi → phải quét lại
    setAutoScanMsg("")
  }

  // ══════════ NHẬN VIDEO TỪ MENU TIKTOK SHOP ══════════
  // CRM (index.html) ghi danh sách vào sessionStorage rồi chuyển sang view này.
  // Ở đây CHỈ giải ra LINK bản KHÔNG watermark (trỏ thẳng CDN TikTok, công khai)
  // rồi nhét vào autoGroups y như khi người dùng chọn folder — mọi bước phía sau
  // (quét trùng, AI caption, upload FB, tạo campaign) chạy nguyên vẹn.
  //
  // KHÔNG tải video về trình duyệt nữa: lúc upload sẽ đưa link cho Facebook tự
  // tải, nên video nặng bao nhiêu cũng được (trước đây >30MB là hay hết giờ,
  // >45MB thì bị chặn thẳng). Đổi lại lấy được bản HD.
  //
  // Giải link ở TRÌNH DUYỆT vì đã đo: gọi dịch vụ giải link từ Cloudflare bị chặn
  // hạn ngạch (IP dùng chung), còn từ máy người dùng thì chạy tốt.
  const TT_RESOLVER = "https://tikwm.com/api/?url="
  const TT_ORIGIN = "https://tikwm.com"
  const TT_QUEUE_KEY = "tt_ads_queue"

  const slugFolder = (s) => String(s || "chua-phan-loai")
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/đ/g, "d").replace(/Đ/g, "D")
    .replace(/[<>:"/\\|?*]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 60) || "chua-phan-loai"
  const ttVideoId = (link) => {
    const m = String(link || "").match(/\/video\/(\d+)/)
    return m ? m[1] : String(Date.now())
  }
  // Tên KOC dùng để đặt tên campaign/ad = username TikTok, bỏ @ và khoảng trắng.
  // Không có username (video tải từ folder) → trả "" để chỗ gọi tự lùi phương án.
  const kocName = (u) => String(u || "").trim().replace(/^@+/, "").replace(/\s+/g, "").slice(0, 40)

  // Dịch vụ giải link chặn 1 request/giây và tính THEO IP — cả văn phòng chung 1 IP
  // nên Duy với Nam chạy cùng lúc là đụng nhau chắc chắn. Dính thì đợi rồi thử lại,
  // đừng bỏ video (giải link rẻ, bắt người dùng làm lại cả lô mới đắt).
  const RATE_LIMIT_RE = /limit|rate|too many|quá tải/i
  const jitter = (base, spread) => base + Math.floor(Math.random() * spread)

  const resolveTikTok = async (link, tries = 5) => {
    let lastMsg = "không giải được link", rateLimited = false
    for (let t = 0; t < tries; t++) {
      // Lùi dần + xóc ngẫu nhiên: 2 máy cùng dính rồi cùng đợi đúng 1500ms thì
      // lần thử lại lại va nhau tiếp. Xóc lệch ra mới tách được hai bên.
      if (t > 0) await new Promise(r => setTimeout(r, jitter(1100 * t, 900)))
      const rj = await (await fetch(TT_RESOLVER + encodeURIComponent(link))).json()
      if (rj.code === 0 && rj.data) return rj.data
      lastMsg = String(rj.msg || lastMsg)
      rateLimited = RATE_LIMIT_RE.test(lastMsg)
      if (!rateLimited) break   // lỗi thật (video riêng tư, bị xoá…) → thử lại vô ích
    }
    throw new Error(rateLimited
      ? "dịch vụ giải link đang quá tải (có thể người khác đang lấy video cùng lúc) — đợi một lát rồi bấm lại"
      : lastMsg)
  }

  // Chốt chặn chạy trùng: hàng đợi tới bằng CẢ HAI đường (sessionStorage lúc iframe
  // vừa nạp + postMessage 900ms sau). Không chặn thì cùng 1 lô chạy 2 lần cách nhau
  // ~900ms → dính đúng hạn ngạch 1 request/giây, và lượt sau ghi đè kết quả lượt trước.
  const ingestedAt = useRef(0)
  const ingesting = useRef(false)

  const ingestTikTokQueue = async (payload) => {
    const vids = (payload && payload.videos || []).filter(v => v && v.link)
    if (!vids.length) return
    if (ingesting.current) return
    const at = Number(payload && payload.at) || 0
    if (at && at === ingestedAt.current) return   // đúng lô này chạy rồi
    ingestedAt.current = at
    ingesting.current = true
    // finally: lỗi bất ngờ mà kẹt cờ thì cả phiên không nhận thêm được lô nào nữa.
    try { await runTikTokIngest(vids) } finally { ingesting.current = false }
  }

  const runTikTokIngest = async (vids) => {
    setTtFetch({ busy: true, done: 0, total: vids.length, msg: "Đang lấy link video từ TikTok…", err: [] })
    setAutoResults([]); setAutoLog([]); setAutoExisting(null); setAutoScanMsg("")

    const byProduct = {}
    const errs = []
    for (let i = 0; i < vids.length; i++) {
      const v = vids[i]
      setTtFetch(s => ({ ...s, done: i, msg: `Đang lấy link ${i + 1}/${vids.length}: ${String(v.title || "").slice(0, 42)}…` }))
      try {
        // Giãn giữa các video cho khớp hạn ngạch 1 request/giây. Xóc ngẫu nhiên để
        // 2 người chạy song song không trôi vào cùng một nhịp rồi va nhau mọi lượt.
        if (i > 0) await new Promise(r => setTimeout(r, jitter(1300, 600)))
        const data = await resolveTikTok(v.link)
        // Ưu tiên bản HD: byte không còn đi qua trình duyệt/Cloudflare nên nặng
        // cũng không sao. Cả hai bản đều KHÔNG watermark.
        const hd = !!data.hdplay
        const src = data.hdplay || data.play
        if (!src) throw new Error("không có bản không watermark")
        // Có API trả đường dẫn tương đối (tikwm proxy) → chuẩn hoá thành link tuyệt
        // đối, vì lát nữa chính Facebook mới là bên đi tải.
        const url = /^https?:\/\//i.test(src) ? src : new URL(src, TT_ORIGIN).href
        // Tên file = id video → trùng với sổ uploaded_videos, quét trùng vẫn đúng.
        const name = ttVideoId(v.link) + ".mp4"
        const size = Number((hd ? data.hd_size : data.size) || data.size) || 0
        const product = slugFolder(v.product)
        // Giữ username TikTok của người quay (KOC) — tên campaign/ad lấy từ đây,
        // thay cho tên video (nội dung video dài, đọc tên camp không ra gì).
        ;(byProduct[product] = byProduct[product] || []).push({ name, url, size, remote: true, koc: kocName(v.username) })
      } catch (e) {
        errs.push(`${String(v.title || v.link).slice(0, 40)}: ${e.message}`)
      }
    }

    const groups = Object.entries(byProduct).map(([product, files]) => ({ product, files }))
    setAutoGroups(groups)
    const okN = groups.reduce((n, g) => n + g.files.length, 0)
    setTtFetch({
      busy: false, done: okN, total: vids.length, err: errs,
      msg: okN
        ? `Đã lấy ${okN}/${vids.length} video từ TikTok Shop. Chọn tài khoản/Page/Pixel bên dưới rồi bấm "Quét" và chạy.`
        : "Không lấy được video nào.",
    })
  }

  // Đọc hàng đợi lúc mở view + nghe postMessage (iframe đã nạp sẵn thì không tự đọc lại).
  useEffect(() => {
    const take = () => {
      try {
        const raw = sessionStorage.getItem(TT_QUEUE_KEY)
        if (!raw) return
        sessionStorage.removeItem(TT_QUEUE_KEY)   // dùng 1 lần, tránh nạp lại khi F5
        ingestTikTokQueue(JSON.parse(raw))
      } catch (e) { /* hàng đợi hỏng → bỏ qua, vẫn dùng được chế độ chọn folder */ }
    }
    take()
    const onMsg = (ev) => {
      if (ev.origin !== window.location.origin) return
      if (ev.data && ev.data.type === "tt-ads-queue") {
        try { sessionStorage.removeItem(TT_QUEUE_KEY) } catch (e) {}
        ingestTikTokQueue(ev.data.payload)
      }
    }
    window.addEventListener("message", onMsg)
    return () => window.removeEventListener("message", onMsg)
  }, [])

  const autoTotalVideos = autoGroups.reduce((n, g) => n + g.files.length, 0)
  const pushLog = (line) => setAutoLog(curr => [...curr, line])

  // Một video là "mới" nếu chưa quét (autoExisting=null → coi tất cả là mới)
  // hoặc tên file KHÔNG có trong sổ đã upload.
  const isNewFile = (f) => !autoExisting || !autoExisting.has(f.name)
  const autoNewVideos = autoGroups.reduce((n, g) => n + g.files.filter(isNewFile).length, 0)
  const autoExistingCount = autoTotalVideos - autoNewVideos

  // 🔍 Quét: hỏi /api/uploaded-videos xem tài khoản này đã upload file nào → đánh dấu.
  const handleAutoScan = async () => {
    if (autoScanBusy || autoGroups.length === 0) return
    setAutoScanBusy(true); setAutoScanMsg("")
    try {
      const r = await fetch(`/api/uploaded-videos?account_id=${encodeURIComponent(autoAccount)}`)
      const d = await r.json()
      if (!r.ok || !d.ok) throw new Error(d.error || `HTTP ${r.status}`)
      const set = new Set((d.files || []).map(String))
      setAutoExisting(set)
      const existed = autoGroups.reduce((n, g) => n + g.files.filter(f => set.has(f.name)).length, 0)
      const fresh = autoTotalVideos - existed
      setAutoScanMsg(`✓ Quét xong: ${fresh} video MỚI, ${existed} đã có ad. (Tài khoản ${autoAccount})`)
    } catch (e) {
      setAutoExisting(null)
      setAutoScanMsg("✗ Lỗi quét: " + e.message)
    } finally {
      setAutoScanBusy(false)
    }
  }

  // Ngưỡng cảnh báo số creative trong 1 ad set. KHÔNG còn cắt thành nhiều campaign —
  // mọi video mới của 1 sản phẩm gộp vào 1 campaign → 1 ad set → N ad.
  // 4 là mức hợp lý với ngân sách ~400k/ngày: cả ad set cần ~50 conversion/tuần để thoát
  // learning phase, chia cho quá nhiều creative thì không cái nào đủ dữ liệu.
  const MAX_CREATIVES = 4

  const handleAutoRun = async () => {
    if (autoBusy || autoGroups.length === 0) return
    setAutoBusy(true); setAutoResults([]); setAutoLog([])
    const today = new Date().toISOString().slice(0, 10)
    // dd/m (không leading zero, không năm) — khớp cấu trúc UTM đang dùng, vd "6/7".
    const [, mmStr, ddStr] = today.split("-")
    const dm = `${parseInt(ddStr, 10)}/${parseInt(mmStr, 10)}`
    // slug gọn: bỏ dấu tiếng Việt + mọi ký tự không phải chữ/số → "NOMA 911" → "noma911".
    const slugCompact = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase().replace(/[^a-z0-9]+/g, "")
    const runner = (autoRunner || "").trim()
    const runnerSlug = slugCompact(runner)
    const results = []
    // Trạng thái hộp TEST/SCALE phải là bản MỚI NHẤT ngay lúc chạy (state React có
    // thể cũ), nên tải lại và dùng biến cục bộ cho cả vòng lặp.
    const gdNow = await loadGroups(true)
    if (!gdNow) pushLog("⚠ Không đọc được trạng thái nhóm TEST/SCALE — sẽ tạo hộp mới nếu chưa có.")
    try {
      for (const g of autoGroups) {
        // Chỉ chạy video MỚI (chưa có ad). Đã quét + cả nhóm đều cũ → bỏ qua.
        const newFiles = g.files.filter(isNewFile)
        if (newFiles.length === 0) {
          pushLog(`▶ "${g.product}" — bỏ qua (tất cả video đã có ad)`)
          continue
        }
        // 1 sản phẩm = 1 campaign, mọi video mới thành creative bên trong cùng 1 ad set.
        const files = newFiles
        pushLog(`▶ Sản phẩm "${g.product}" — ${files.length} video mới → 1 campaign, 1 ad set, ${files.length} creative`)
        if (files.length > MAX_CREATIVES) {
          pushLog(`  ⚠ ${files.length} creative chung 1 ad set (khuyến nghị ≤ ${MAX_CREATIVES}) — ngân sách chia mỏng, có creative sẽ không tiêu được tiền.`)
        }
        // UTM: cả 4 field (source/medium/campaign/id) BẰNG NHAU = "d/m-sảnphẩm-ngườichạy"
        // (đúng cấu trúc user đang dùng, vd "6/7-noma911-thangthattha").
        const utmVal = [dm, slugCompact(g.product), runnerSlug].filter(Boolean).join("-")
        const utmStr = ["utm_source", "utm_medium", "utm_campaign", "utm_id"].map(k => `${k}=${utmVal}`).join("&")
        // ── Tên theo công thức "ngày/tháng - sản phẩm - KOC" ──────────────────
        // KOC = username TikTok của người quay video. Cùng một KOC có nhiều video
        // thì đánh số: KOC1, KOC2, KOC3 — nhìn tên ad là biết video nào của ai.
        // Video tải từ folder không có KOC → lùi về tên người chạy.
        const kocOf = (f) => (f && f.koc) || runner || "NA"
        const kocSeq = {}
        const adNames = files.map(f => {
          const k = kocOf(f)
          kocSeq[k] = (kocSeq[k] || 0) + 1
          return `${dm} - ${g.product} - ${k}${kocSeq[k]}`
        })
        // Tên campaign: 1 KOC thì ghi thẳng tên, nhiều KOC thì ghi số lượng (tên
        // campaign không nhét được hết mà cũng không nên dài).
        const kocList = Object.keys(kocSeq)
        const campKoc = kocList.length === 1 ? kocList[0] : `${kocList.length} KOC`
        const adsArr = []
        const skipped = []
        try {
          for (let i = 0; i < files.length; i++) {
            const file = files[i]
            const baseName = file.name.replace(/\.[^.]+$/, "")
            // 1) AI viết caption.
            // rotate = số thứ tự video trong nhóm → mỗi video ăn MỘT DẠNG BÀI khác
            // nhau (kể chuyện / hỏi-đáp / trước-sau / hướng dẫn…). Trước đây mọi
            // video dùng chung 1 khung nên cả campaign nhìn như một bài nhân bản.
            // seed theo sản phẩm để 2 sản phẩm khác nhau không mở màn cùng dạng.
            pushLog(`  • [${file.name}] AI viết caption...`)
            let headline = g.product, adCopy = baseName
            try {
              const r = await fetch("/api/generate-ad-copy", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  product: autoCopyProduct,
                  format: "OUTCOME_SALES",
                  formatLabel: "Doanh số",
                  cta: autoCta,
                  // Đưa hotline vào ghi chú để AI dùng ĐÚNG số này, khỏi bịa số khác.
                  // (Chèn lại lần nữa ở withHotline — AI quên thì vẫn có số trong bài.)
                  notes: `Tên video: ${baseName} | Nhóm sản phẩm: ${g.product}`
                    + (phone ? ` | Hotline (dùng đúng số này, đặt cuối bài): ${phone}` : ""),
                  promotion: "",
                  count: 1,
                  seed: `${autoCopyProduct}:${g.product}`,
                  rotate: i,
                  // Gắn thẳng link đích vào bài — người chạy ads không phải tự
                  // tìm chỗ {{URL}} mà thay tay nữa.
                  link: autoLink,
                }),
              })
              const d = await r.json()
              if (r.ok && d.variants && d.variants[0]) {
                headline = d.variants[0].headline || g.product
                adCopy = d.variants[0].primary_text || baseName
                pushLog(`    ✓ caption dạng "${d.variants[0].style_label || d.variants[0].style}"`)
                // Còn {{URL}} nghĩa là chưa điền link đích ở trên → báo ngay,
                // đừng để phát hiện lúc quảng cáo đã chạy.
                if (/\{\{?\s*URL\s*\}?\}/i.test(adCopy)) {
                  pushLog(`    ⚠ bài còn chỗ trống {{URL}} — chưa điền "Link đích" ở phần cấu hình`)
                }
              } else {
                pushLog(`    ⚠ caption lỗi (${d.error || r.status}) → tạm dùng tên file`)
              }
            } catch (err) {
              pushLog(`    ⚠ caption lỗi: ${err.message} → tạm dùng tên file`)
            }
            // 2) Upload video lên FB — lỗi 1 video KHÔNG làm hỏng cả nhóm, chỉ bỏ qua video đó.
            pushLog(`  • [${file.name}] upload lên FB (đợi xử lý)...`)
            try {
              // Video từ TikTok mang sẵn link → gửi link, Facebook tự tải (không
              // giới hạn dung lượng). Video chọn từ folder thì đẩy file như cũ.
              const ud = await uploadMediaToFb(
                file.remote ? { url: file.url, name: file.name, kind: "video" }
                            : { file, kind: "video" },
                autoAccount,
                (m) => pushLog(`    · ${m}`)
              )
              adsArr.push({
                // Tên ad = tên creative: "d/m - sản phẩm - KOC + số thứ tự".
                ad_name: adNames[i],
                headline: fillUrl(headline, autoLink),
                ad_copy: withHotline(fillUrl(adCopy, autoLink), phone),
                cta: phoneAsCta && phone ? "CALL_NOW" : autoCta,
                link: phoneAsCta && phone ? telLink(phone) : autoLink,
                url_tags: utmStr, video_id: ud.video_id, thumbnail_url: ud.thumbnail_url,
                filename: file.name, // để ghi sổ uploaded_videos sau khi tạo ad
              })
              pushLog(`    ✓ video ${i + 1}/${files.length} xong`)
            } catch (upErr) {
              skipped.push(file.name)
              pushLog(`    ✗ bỏ qua "${file.name}": ${upErr.message}`)
            }
          }
          if (skipped.length) pushLog(`  ⚠ ${skipped.length} video lỗi — giữ trạng thái "mới" để thử lại sau: ${skipped.join(", ")}`)
          if (adsArr.length === 0) throw new Error(`cả ${files.length} video đều upload lỗi — không tạo campaign`)
          // 3) Đổ creative vào HỘP đang chạy của sản phẩm ("<SP> - TEST"), chưa có
          //    thì mới dựng hộp mới. Không đẻ campaign/ad set mới mỗi lần chạy nữa —
          //    đó là thứ đã sinh ra ~19 ad set cùng tệp ở tài khoản Noma Việt Nam.
          const hop = timHop(g.product, autoGroup, gdNow)
          const tenHop = `${g.product} - ${autoGroup}`
          if (hop) {
            // Giữ trần 4 creative sống cùng lúc: đủ chỗ thì thôi, thiếu thì tắt ad CŨ NHẤT.
            const dangChay = (hop.ads || []).filter(a => a.dang_chay)
            const canTat = Math.max(0, Math.min(dangChay.length, dangChay.length + adsArr.length - MAX_TEST_ADS))
            if (canTat > 0) {
              const cuNhat = dangChay.slice().sort((a, b) => Date.parse(a.created_time || 0) - Date.parse(b.created_time || 0)).slice(0, canTat)
              pushLog(`  • Hộp "${tenHop}" đang có ${dangChay.length} creative → tắt ${canTat} cái cũ nhất để giữ trần ${MAX_TEST_ADS}`)
              for (const a of cuNhat) {
                const r = await pauseAd(a.ad_id)
                pushLog(r.ok ? `    · đã tắt "${a.ad_name}"` : `    ⚠ không tắt được "${a.ad_name}": ${r.error}`)
              }
            }
            pushLog(`  • Thêm ${adsArr.length} creative vào hộp "${tenHop}" (giữ nguyên ngân sách ad set)...`)
          } else {
            pushLog(`  • Chưa có hộp "${tenHop}" → tạo mới: 1 campaign, 1 ad set, ${adsArr.length} creative...`)
          }
          const config = {
            // Tên hộp CỐ ĐỊNH (không kèm ngày) để lần chạy sau tìm lại đúng chỗ.
            // Ngày/tháng + KOC nằm ở TÊN AD (adNames) — xem ghi chú phía trên.
            campaign_name: tenHop,
            adset_name: tenHop,
            ...(hop ? { existing_adset_id: hop.adset_id, existing_campaign_id: hop.campaign_id } : {}),
            objective: "OUTCOME_SALES",
            buying_type: "AUCTION",
            account_id: autoAccount,
            page_id: autoPage,
            pixel_id: autoPixel,
            // Mục tiêu hiệu quả: số lượt chuyển đổi (mặc định) hay giá trị chuyển đổi.
            optimization_goal: autoPerfGoal === "value" ? "VALUE" : "OFFSITE_CONVERSIONS",
            // Sàn ROAS chỉ có nghĩa khi tối đa hoá GIÁ TRỊ; bỏ trống = để Meta tự chạy.
            ...(autoPerfGoal === "value" && Number(autoRoasFloor) > 0
              ? { bid_strategy: "LOWEST_COST_WITH_MIN_ROAS", roas_average_floor: Number(autoRoasFloor) }
              : {}),
            // Chiến lược vòng đời khách hàng — LUÔN khai, kể cả khi chọn "tất cả đối tượng":
            //   0   = không tiêu đồng nào cho khách cũ  → "Chinh phục khách hàng mới"
            //   100 = không giới hạn                     → "Thu hút chuyển đổi từ tất cả đối tượng"
            // ĐO ĐƯỢC 06/08/2026: Meta LƯU đúng giá trị này (đọc lại ad set ra ecb=100),
            // NHƯNG ô "Chiến lược vòng đời khách hàng" trong Ads Manager VẪN TRỐNG — control
            // đó chưa mở ra Marketing API. Đã dò v23.0 các tên customer_lifecycle_strategy,
            // lifecycle_strategy, customer_acquisition, is_new_customer_acquisition,
            // new_customer_acquisition, audience_lifecycle → KHÔNG field nào tồn tại.
            // Giữ lại vì vô hại (100 = không giới hạn, đúng mặc định) và nhiều khả năng đây
            // chính là field Meta dùng khi mở control đó ra API.
            existing_customer_budget_percentage: autoLifecycle === "new" ? 0 : 100,
            destination_type: "WEBSITE",
            billing_event: "IMPRESSIONS",
            promoted_event: "COMPLETE_REGISTRATION",
            pacing_type: "standard",
            launch_status: "PAUSED",
            budget_level: "adset",
            budget_type: "daily",
            // Ngân sách của CẢ ad set — mọi creative dùng chung, Meta tự chia.
            budget_amount: Number(autoBudget),
            adset_per_ad: false, // 1 ad set dùng chung, N creative bên trong
            targeting: {
              geo_locations: { countries: ["VN"] },
              age_min: Number(autoAgeMin) || 18,
              age_max: Number(autoAgeMax) || 65,
            },
            ads: adsArr,
          }
          const fd2 = new FormData()
          fd2.append("config", JSON.stringify(config))
          const cr = await fetch("/api/create-campaign", { method: "POST", body: fd2 })
          const cd = await cr.json()
          if (!cr.ok || !cd.success) throw new Error(`[${cd.step || "?"}] ${cd.error || "lỗi tạo camp"}`)
          pushLog(`  ✓ Xong "${tenHop}" — thêm ${adsArr.length} creative của ${campKoc} (ad tạo ở PAUSED)`
            + (cd.reused_adset ? " · dùng lại ad set đang chạy" : " · hộp mới"))
          // Meta bỏ bớt cài đặt nào (vd vòng đời khách hàng chưa mở cho TK này) thì nói ra,
          // đừng để người chạy tưởng đã set mà thực tế không có.
          ;(cd.warnings || []).forEach(w => pushLog(`    ⚠ ${w}`))
          // 4) Ghi sổ video đã upload (để lần quét sau bỏ qua). cd.ads cùng thứ tự adsArr.
          try {
            const records = adsArr.map((a, idx) => ({
              filename: a.filename,
              video_id: a.video_id,
              ad_id: (cd.ads && cd.ads[idx]) ? cd.ads[idx].ad_id : null,
              product: g.product,
              campaign_id: cd.campaign_id,
            }))
            await fetch("/api/uploaded-videos", {
              method: "POST",
              headers: { "Content-Type": "application/json", "X-Optimizer-Token": optToken },
              body: JSON.stringify({ account_id: autoAccount, videos: records }),
            })
            // Cập nhật sổ tại chỗ để UI phản ánh ngay (không cần quét lại).
            setAutoExisting(curr => {
              const next = new Set(curr || [])
              for (const a of adsArr) next.add(a.filename)
              return next
            })
          } catch (recErr) {
            pushLog(`    ⚠ tạo ad OK nhưng ghi sổ lỗi: ${recErr.message} (lần quét sau có thể trùng)`)
          }
          results.push({ product: g.product, ok: true, campaign_id: cd.campaign_id, ads_created: (cd.ads || []).length, skipped: skipped.length, ads_manager_url: cd.ads_manager_url })
        } catch (err) {
          pushLog(`  ✗ "${g.product}" lỗi: ${err.message}`)
          results.push({ product: g.product, ok: false, error: err.message })
        }
        setAutoResults([...results])
      }
      pushLog(`■ Hoàn tất: ${results.filter(r => r.ok).length}/${results.length} campaign tạo thành công.`)
    } finally {
      setAutoBusy(false)
    }
  }

  // ══════════ NHÓM CHẠY TEST / SCALE ══════════
  // Tên sản phẩm ở hai đầu (hàng đợi TikTok vs tên campaign trên Meta) phải so được
  // với nhau — gọn khoảng trắng, bỏ phân biệt hoa thường.
  const chuanSP = (s) => String(s || "").trim().replace(/\s+/g, " ").toLowerCase()

  // Hộp (campaign + ad set) của 1 sản phẩm trong 1 nhóm; chưa tải groups thì trả null
  // → chỗ gọi sẽ tạo hộp mới, đúng hành vi cũ.
  const timHop = (product, group, data) => {
    const src = data || groups
    const p = (src && src.products || []).find(x => chuanSP(x.product) === chuanSP(product))
    if (!p) return null
    const h = p[String(group).toLowerCase()]
    return (h && h.adset_id) ? h : null
  }

  const loadGroups = async (silent) => {
    if (!autoAccount) return null
    if (!silent) { setGroupsBusy(true); setGroupsErr(""); setGroupMsg("") }
    try {
      const r = await fetch(`/api/fb-groups?account_id=${encodeURIComponent(autoAccount)}&days=14`, { cache: "no-store" })
      const d = await r.json()
      if (!r.ok || !d.ok) throw new Error(d.error || `HTTP ${r.status}`)
      setGroups(d)
      return d
    } catch (e) {
      setGroups(null); setGroupsErr(e.message || String(e))
      return null
    } finally {
      if (!silent) setGroupsBusy(false)
    }
  }

  const goiAdAction = async (payload) => {
    try {
      const r = await fetch("/api/fb-ad-actions", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Optimizer-Token": optToken },
        body: JSON.stringify(payload),
      })
      const d = await r.json()
      if (!r.ok || !d.ok) return { ok: false, error: d.error || `HTTP ${r.status}` }
      return d
    } catch (e) { return { ok: false, error: e.message || String(e) } }
  }
  const pauseAd = (adId) => goiAdAction({ action: "pause_ad", ad_id: adId })

  // Bê creative thắng sang hộp SCALE — server dùng lại ĐÚNG bài viết cũ (post ID)
  // nên giữ nguyên like/comment/share; không upload lại video.
  const promoteAd = async (ad, product) => {
    if (actBusy) return
    setActBusy(ad.ad_id); setGroupMsg("")
    const d = await goiAdAction({ action: "promote", ad_id: ad.ad_id, product })
    setActBusy("")
    setGroupMsg(d.ok
      ? `✓ Đã bê "${ad.ad_name}" sang SCALE (ad mới đang TẠM DỪNG${d.created && d.created.adset ? ", ad set SCALE vừa được tạo — nhớ bật cả ad set" : ""}).`
      : `✗ Bê sang SCALE lỗi: ${d.error}`)
    if (d.ok) loadGroups(true)
  }

  // ── Đẩy hàng loạt creative đã tick sang SCALE ──────────────────────────────
  // CHẠY TUẦN TỰ, không song song: hai lần bê cùng lúc mà sản phẩm chưa có hộp
  // SCALE thì cả hai đều thấy "chưa có" rồi mỗi cái tạo một hộp → 2 ad set SCALE
  // trùng nhau, đúng bệnh phân mảnh đang chữa.
  const dsDaTick = () => {
    const out = []
    for (const p of (groups && groups.products || [])) {
      for (const a of ((p.test && p.test.ads) || [])) {
        if (picked[a.ad_id] && a.dang_chay) out.push({ ad: a, product: p.product })
      }
    }
    return out
  }

  const dayHangLoat = async () => {
    const ds = dsDaTick()
    if (!ds.length || pushBusy) return
    if (!confirm(`Đẩy ${ds.length} creative sang SCALE?\n\n`
      + ds.map(x => `· ${x.ad.ad_name}`).join("\n")
      + `\n\nAd mới tạo ở trạng thái TẠM DỪNG, giữ nguyên bài viết cũ (không mất tương tác).`
      + (tatSauKhiBe ? "\nBản ở TEST sẽ được tắt sau khi bê xong." : ""))) return
    setPushBusy(true); setPushLogs([]); setGroupMsg("")
    let ok = 0
    for (const { ad, product } of ds) {
      setActBusy(ad.ad_id)
      const d = await goiAdAction({ action: "promote", ad_id: ad.ad_id, product })
      if (d.ok) {
        ok++
        let dong = `✓ ${ad.ad_name} → SCALE${d.created && d.created.adset ? " (vừa tạo hộp SCALE mới)" : ""}`
        if (tatSauKhiBe) {
          const t = await pauseAd(ad.ad_id)
          dong += t.ok ? " · đã tắt bản TEST" : ` · ⚠ không tắt được bản TEST: ${t.error}`
        }
        setPushLogs(c => [...c, dong])
        setPicked(c => { const n = { ...c }; delete n[ad.ad_id]; return n })
      } else {
        setPushLogs(c => [...c, `✗ ${ad.ad_name}: ${d.error}`])
      }
    }
    setActBusy(""); setPushBusy(false)
    setGroupMsg(`Đã đẩy ${ok}/${ds.length} creative sang SCALE. Ad mới đang TẠM DỪNG — vào Ads Manager bật khi đã xem lại.`)
    loadGroups(true)
  }

  const tatAd = async (ad) => {
    if (actBusy) return
    if (!confirm(`Tắt quảng cáo "${ad.ad_name}"?`)) return
    setActBusy(ad.ad_id); setGroupMsg("")
    const d = await pauseAd(ad.ad_id)
    setActBusy("")
    setGroupMsg(d.ok ? `✓ Đã tắt "${ad.ad_name}".` : `✗ Tắt lỗi: ${d.error}`)
    if (d.ok) loadGroups(true)
  }

  // Kéo live danh sách TKQC + Page + Pixel mà token FB có quyền (chọn bất kỳ).
  const loadAutoResources = async () => {
    if (fbRes || fbResLoading) return
    setFbResLoading(true); setFbResErr("")
    try {
      const r = await fetch("/api/fb-accounts-pages", { credentials: "same-origin" })
      const d = await r.json()
      if (!d.ok || !Array.isArray(d.accounts)) throw new Error(d.error || "Không tải được danh sách tài khoản")
      setFbRes(d)
    } catch (e) { setFbResErr(e.message || String(e)) }
    finally { setFbResLoading(false) }
  }
  // Kiểm tra THẬT cặp (tkqc, trang): server tạo thử 1 adcreative rồi xoá ngay — cách duy
  // nhất biết chắc trang chạy được, vì promote_pages có thể rỗng mà trang vẫn dùng được.
  const kiemTraTrang = async () => {
    if (!autoAccount || !autoPage || testPageBusy) return
    setTestPageBusy(true); setTestPageMsg("")
    try {
      const acct = String(autoAccount).replace(/^act_/, "")
      const r = await fetch(`/api/fb-test-page?account=${acct}&page=${autoPage}`, { credentials: "same-origin" })
      const d = await r.json()
      if (!d.ok) throw new Error(d.error || "Không kiểm tra được")
      const kq = (d.results || [])[0]
      if (!kq) throw new Error(d.note || "Meta không trả kết quả nào")
      setTestPageMsg(kq.ok ? "✓ CHẠY ĐƯỢC — tạo thử creative thành công (đã xoá)" : `✗ ${kq.verdict}: ${kq.error || ""}`)
    } catch (e) { setTestPageMsg("✗ " + (e.message || String(e))) }
    finally { setTestPageBusy(false) }
  }
  // Xoá kết quả cũ khi đổi tkqc/trang — tránh đọc nhầm kết quả của cặp trước đó.
  React.useEffect(() => { setTestPageMsg("") }, [autoAccount, autoPage])

  // Đổi TKQC → set Page + Pixel của tài khoản đó.
  // Page: ƯU TIÊN trang mặc định trong ACCOUNT_PAGE (vd CP DOSCOM → trang tích xanh);
  // chỉ khi tkqc không còn quyền chạy trang đó mới rơi về trang đầu danh sách.
  const onAutoAccountChange = (val) => {
    setAutoAccount(val)
    const acc = (fbRes && fbRes.accounts || []).find(a => ("act_" + a.id) === val)
    if (acc) {
      const pages = acc.pages || []
      if (pages.length) {
        const uuTien = ACCOUNT_PAGE[val]
        const co = uuTien && pages.some(p => String(p.id) === uuTien)
        // Không có trang mặc định → ưu tiên trang Meta ĐÃ xác nhận chạy được (nguon
        // "promote") hơn là trang BM/token chưa xác minh nằm đầu danh sách.
        const dauTien = (pages.find(p => p.promote) || pages[0]).id
        setAutoPage(co ? uuTien : dauTien)
      } else if (ACCOUNT_PAGE[val]) {
        // Chưa tải được promote_pages → vẫn đặt đúng trang mặc định còn hơn giữ
        // trang của tài khoản trước đó.
        setAutoPage(ACCOUNT_PAGE[val])
      }
      if (acc.pixels && acc.pixels.length) setAutoPixel(acc.pixels[0].id)
    } else if (ACCOUNT_PAGE[val]) {
      setAutoPage(ACCOUNT_PAGE[val])
    }
  }

  // ── Handlers chế độ Tối ưu & Bảo vệ ──
  const loadOptAccounts = async () => {
    try {
      const r = await fetch("/api/optimizer/accounts"); const d = await r.json()
      if (!d.ok) throw new Error(d.error || "Lỗi tải tài khoản")
      setOptRole(d.role || "")
      setOptAccountList(d.accounts || [])
      setOptAccount(curr => curr || ((d.accounts || [])[0] || {}).id || "")
    } catch (e) { setOptMsg("✗ " + e.message) }
  }
  const loadOptimizer = async () => {
    if (!optAccount) return
    setOptLoading(true); setOptMsg("")
    try {
      const [cr, kr] = await Promise.all([
        fetch(`/api/optimizer/campaigns?account=${optAccount}`),
        fetch(`/api/optimizer/control?account=${optAccount}`),
      ])
      const cd = await cr.json(); const kd = await kr.json()
      if (!cr.ok || !cd.ok) throw new Error(cd.error || "Lỗi tải danh sách campaign")
      setOptCampaigns(cd.campaigns || [])
      setOptExcluded(Array.isArray(kd.excluded) ? kd.excluded.map(String) : [])
      setOptShadow(kd.shadow !== false)
      setOptKill(kd.killswitch === true)
    } catch (e) { setOptMsg("✗ " + e.message) }
    finally { setOptLoading(false) }
  }
  const toggleExcluded = (id) =>
    setOptExcluded(curr => curr.includes(id) ? curr.filter(x => x !== id) : [...curr, id])
  const saveOptimizer = async () => {
    setOptLoading(true); setOptMsg("")
    try {
      try { localStorage.setItem("doscom_opt_token", optToken) } catch (e) {}
      const r = await fetch(`/api/optimizer/control?account=${optAccount}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-Optimizer-Token": optToken },
        body: JSON.stringify({ excluded: optExcluded, shadow: optShadow, killswitch: optKill }),
      })
      const d = await r.json()
      if (!r.ok || !d.ok) throw new Error(d.error || "Lỗi lưu")
      setOptMsg("✓ Đã lưu lúc " + new Date().toLocaleTimeString("vi-VN"))
    } catch (e) { setOptMsg("✗ " + e.message) }
    finally { setOptLoading(false) }
  }
  const loadOptDecisions = async () => {
    if (!optAccount) return
    try {
      const r = await fetch(`/api/optimizer/decisions?account=${optAccount}`); const d = await r.json()
      setOptDecisions(Array.isArray(d.decisions) ? d.decisions.slice(0, 30) : [])
    } catch (e) {}
  }
  // Mở tab → nạp danh sách tài khoản được xem.
  React.useEffect(() => { if (mode === "optimize") loadOptAccounts() }, [mode])
  // Vào tab "Tự động từ folder" → kéo live danh sách TKQC/Page/Pixel.
  React.useEffect(() => { if (mode === "auto") loadAutoResources() }, [mode])
  // Đổi tài khoản (hoặc vào tab) → đọc lại trạng thái hai hộp TEST/SCALE.
  React.useEffect(() => { if (mode === "auto" && autoAccount) loadGroups(true) }, [mode, autoAccount])
  // Tải xong → tick sẵn những creative ĐÃ ĐỦ ĐIỀU KIỆN bê (verdict "promote").
  // Chỉ thêm vào, không xoá tick người dùng tự đặt.
  React.useEffect(() => {
    if (!groups) return
    const win = {}
    for (const p of (groups.products || [])) {
      for (const a of ((p.test && p.test.ads) || [])) {
        if (a.dang_chay && a.verdict === "promote") win[a.ad_id] = true
      }
    }
    if (Object.keys(win).length) setPicked(c => ({ ...win, ...c }))
  }, [groups])
  // Đổi tài khoản (hoặc nạp xong) → load camp + control + decisions.
  React.useEffect(() => { if (mode === "optimize" && optAccount) { loadOptimizer(); loadOptDecisions() } }, [optAccount, mode])

  // Initialize defaults
  React.useEffect(() => { handleProductChange("D1") }, [])

  // ── Validations ──
  const allAdsHaveContent = ads.every(a => a.headline && a.adCopy)
  const canPublish = allAdsHaveContent

  // ── Options dropdown auto-folder: ưu tiên LIVE từ FB, fallback danh sách cấu hình ──
  const liveAccs = (fbRes && fbRes.accounts) || []
  let accOptions = liveAccs.length
    ? liveAccs.map(a => ({ value: "act_" + a.id, label: a.name + (a.status !== "ACTIVE" ? ` ⚠${a.status}` : "") }))
    : Object.entries(ACCOUNTS).map(([id, name]) => ({ value: id, label: name }))
  const curAcc = liveAccs.find(a => ("act_" + a.id) === autoAccount)
  // Nhãn ghi rõ nguồn trang (xem /api/fb-accounts-pages): trang "promote" là Meta đã xác
  // nhận tkqc chạy được; trang BM / trang của token thì phải bấm "Kiểm tra" mới chắc.
  const NHAN_NGUON = { business: " · trang BM (chưa xác minh)", token: " · trang token quản lý (chưa xác minh)" }
  let pageOptions = curAcc
    ? curAcc.pages.map(p => ({ value: p.id, label: tenPage(p.id, p.name) + (p.promote ? "" : (NHAN_NGUON[p.nguon] || " · chưa xác minh")) }))
    : Object.entries(PAGES).map(([id, name]) => ({ value: id, label: tenPage(id, name) }))
  const trangDangChon = curAcc ? curAcc.pages.find(p => String(p.id) === autoPage) : null
  let pixelOptions = (curAcc && curAcc.pixels && curAcc.pixels.length)
    ? curAcc.pixels.map(p => ({ value: p.id, label: p.name }))
    : Object.entries(PIXELS).map(([id, name]) => ({ value: id, label: name }))
  // Luôn giữ giá trị đang chọn trong list (kể cả khác account / chưa load) để không bị mất.
  if (autoAccount && !accOptions.some(o => o.value === autoAccount))
    accOptions = [{ value: autoAccount, label: (ACCOUNTS[autoAccount] || autoAccount) }, ...accOptions]
  if (autoPage && !pageOptions.some(o => o.value === autoPage))
    pageOptions = [{ value: autoPage, label: (PAGES[autoPage] || autoPage) + (curAcc ? " (khác account)" : "") }, ...pageOptions]
  if (autoPixel && !pixelOptions.some(o => o.value === autoPixel))
    pixelOptions = [{ value: autoPixel, label: (PIXELS[autoPixel] || autoPixel) + (curAcc ? " (khác account)" : "") }, ...pixelOptions]

  const selectClass = "w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white"
  const inputClass = "w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
  const labelClass = "block text-xs font-semibold text-gray-600 uppercase tracking-wide mb-1.5"
  const sectionHeaderClass = "flex items-center gap-3 mb-5 pb-3 border-b-2"

  // ── Render ──
  return (
    <div className="space-y-6">
      {/* HEADER */}
      <div className="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-xl p-6 text-white">
        <h2 className="text-xl font-bold flex items-center gap-2"><Megaphone /> Tạo Quảng Cáo Facebook</h2>
        <p className="text-blue-100 text-sm mt-1">Cấu hình theo đúng cấu trúc: Chiến dịch → Nhóm quảng cáo → Quảng cáo</p>
      </div>

      {/* ═══════════════ CHỌN CHẾ ĐỘ ═══════════════ */}
      <div className="flex gap-2">
        <button onClick={() => setMode("auto")} className={"px-4 py-2.5 rounded-lg text-sm font-bold transition " + (mode === "auto" ? "bg-indigo-600 text-white shadow" : "bg-white text-gray-600 border border-gray-300 hover:bg-gray-50")}>⚡ Tự động từ folder</button>
        <button onClick={() => setMode("manual")} className={"px-4 py-2.5 rounded-lg text-sm font-bold transition " + (mode === "manual" ? "bg-indigo-600 text-white shadow" : "bg-white text-gray-600 border border-gray-300 hover:bg-gray-50")}>✍️ Thủ công (từng quảng cáo)</button>
        <button onClick={() => setMode("optimize")} className={"px-4 py-2.5 rounded-lg text-sm font-bold transition " + (mode === "optimize" ? "bg-indigo-600 text-white shadow" : "bg-white text-gray-600 border border-gray-300 hover:bg-gray-50")}>⚙️ Tối ưu & Bảo vệ</button>
      </div>

      {/* ═══════════════ CHẾ ĐỘ TỐI ƯU & BẢO VỆ ═══════════════ */}
      {mode === "optimize" && (
        <div className="space-y-5">
          <div className="bg-white rounded-xl border-2 border-amber-200 p-5 shadow-sm">
            <div className="flex items-center gap-3 mb-3 pb-3 border-b-2 border-amber-500">
              <div className="w-10 h-10 rounded-full bg-amber-500 text-white flex items-center justify-center font-bold text-lg">⚙️</div>
              <div>
                <h3 className="text-base font-bold text-amber-900">Tối ưu tự động & Bảo vệ campaign</h3>
                <p className="text-xs text-gray-500 mt-0.5">Agent tối ưu (4 lần/ngày): tắt camp kém, tăng/giảm ngân sách, nhân nhóm chạy tốt. Tick camp để CẤM agent đụng vào.</p>
              </div>
            </div>

            {/* Chọn tài khoản (phân quyền theo người đăng nhập) */}
            <div className="mb-4">
              <label className={labelClass}>Tài khoản quảng cáo {optRole && <span className="text-gray-400 normal-case">· quyền: {optRole}</span>}</label>
              {optAccountList.length === 0 ? (
                <p className="text-xs text-gray-400">Không có tài khoản nào (chưa đăng nhập đúng quyền, hoặc chưa khai trong cấu hình).</p>
              ) : (
                <select value={optAccount} onChange={e => setOptAccount(e.target.value)} className={selectClass}>
                  {optAccountList.map(a => (
                    <option key={a.id} value={a.id}>{a.name} ({a.id}){a.staff ? ` · ${a.staff}` : ""}</option>
                  ))}
                </select>
              )}
            </div>

            {/* Công tắc */}
            <div className="flex flex-wrap items-center gap-4 mb-4">
              <label className="flex items-center gap-2 text-sm font-semibold text-gray-700">
                <input type="checkbox" checked={optShadow} onChange={e => setOptShadow(e.target.checked)} className="w-4 h-4" />
                Shadow mode <span className="text-xs font-normal text-gray-400">(chỉ ghi log, KHÔNG thực thi)</span>
              </label>
              <label className="flex items-center gap-2 text-sm font-semibold text-red-700">
                <input type="checkbox" checked={optKill} onChange={e => setOptKill(e.target.checked)} className="w-4 h-4" />
                Killswitch <span className="text-xs font-normal text-gray-400">(dừng toàn bộ agent)</span>
              </label>
              <button onClick={loadOptimizer} disabled={optLoading} className="ml-auto text-xs font-semibold text-amber-700 underline">↻ Tải lại</button>
            </div>

            {/* Danh sách campaign + tick bảo vệ */}
            <label className={labelClass}>Danh sách campaign — tick để KHÔNG cho agent chỉnh sửa</label>
            <div className="border border-gray-200 rounded-lg max-h-72 overflow-auto divide-y">
              {optLoading && optCampaigns.length === 0 && <p className="text-xs text-gray-400 p-3">Đang tải...</p>}
              {!optLoading && optCampaigns.length === 0 && <p className="text-xs text-gray-400 p-3">Chưa có campaign (hoặc chưa cấu hình token FB trên CRM).</p>}
              {optCampaigns.map(c => (
                <label key={c.id} className="flex items-center gap-3 p-2.5 hover:bg-amber-50 cursor-pointer text-sm">
                  <input type="checkbox" checked={optExcluded.includes(String(c.id))} onChange={() => toggleExcluded(String(c.id))} className="w-4 h-4" />
                  <span className="flex-1 truncate">{c.name}</span>
                  <span className={"text-[10px] px-2 py-0.5 rounded-full " + (c.effective_status === "ACTIVE" ? "bg-green-100 text-green-700" : "bg-gray-100 text-gray-500")}>{c.effective_status || c.status}</span>
                  {optExcluded.includes(String(c.id)) && <span className="text-[10px] font-bold text-amber-700">🔒 BẢO VỆ</span>}
                </label>
              ))}
            </div>
            <p className="text-[11px] text-gray-400 mt-1">{optExcluded.length} campaign được bảo vệ. Camp do agent tạo có tên bắt đầu bằng "[AUTO]".</p>

            {/* Token + lưu */}
            <div className="mt-4 flex flex-wrap items-end gap-3">
              <div className="flex-1 min-w-[200px]">
                <label className={labelClass}>Mã lưu (OPTIMIZER_TOKEN)</label>
                <input type="password" value={optToken} onChange={e => setOptToken(e.target.value)} className={inputClass} placeholder="Nhập mã đã đặt trên CRM" />
              </div>
              <button onClick={saveOptimizer} disabled={optLoading || !optToken} className={"py-2.5 px-6 rounded-lg text-sm font-bold text-white " + (optLoading || !optToken ? "bg-gray-300 cursor-not-allowed" : "bg-amber-600 hover:bg-amber-700")}>Lưu cấu hình</button>
            </div>
            {optMsg && <p className={"text-xs mt-2 " + (optMsg.startsWith("✓") ? "text-green-600" : "text-red-600")}>{optMsg}</p>}
          </div>

          {/* Theo dõi quyết định gần nhất */}
          <div className="bg-white rounded-xl border border-gray-200 p-5 shadow-sm">
            <div className="flex items-center justify-between mb-2">
              <h4 className="text-sm font-bold text-gray-700">Agent vừa làm gì (quyết định gần nhất)</h4>
              <button onClick={loadOptDecisions} className="text-xs font-semibold text-blue-600 underline">↻ Tải lại</button>
            </div>
            {optDecisions.length === 0 && <p className="text-xs text-gray-400">Chưa có dữ liệu (cần cấu hình OPTIMIZER_WORKER_URL trên CRM + agent đã chạy).</p>}
            <div className="space-y-1.5 max-h-72 overflow-auto">
              {optDecisions.map((d, i) => (
                <div key={i} className="text-[11px] border-b border-gray-100 pb-1.5">
                  <span className={"font-bold " + (d.executed ? "text-green-700" : "text-gray-400")}>{d.action_type}</span>
                  <span className="text-gray-500"> · {d.campaign_name || d.campaign_id}</span>
                  {d.blocked_reason && <span className="text-amber-600"> · {d.blocked_reason}</span>}
                  {d.reasoning && <div className="text-gray-400 truncate">{d.reasoning}</div>}
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* ═══════════════ CHẾ ĐỘ TỰ ĐỘNG ═══════════════ */}
      {mode === "auto" && (
        <div className="space-y-5">
          {/* Template Noma */}
          <div className="bg-white rounded-xl border-2 border-indigo-200 p-5 shadow-sm">
            <div className="flex items-center gap-3 mb-4 pb-3 border-b-2 border-indigo-500">
              <div className="w-10 h-10 rounded-full bg-indigo-500 text-white flex items-center justify-center font-bold text-lg">⚡</div>
              <div>
                <h3 className="text-base font-bold text-indigo-900">Tự động từ folder video</h3>
                <p className="text-xs text-gray-500 mt-0.5">Chọn TKQC/Page/Pixel/Sản phẩm → chọn folder video → mỗi video thành 1 ad set riêng (1 creative/ad set, ngân sách riêng → FB phân phối đủ mọi creative), tối đa 3 ad set/chiến dịch (dư thì tách thêm campaign). AI tự viết caption.</p>
              </div>
            </div>
            <div className="flex flex-wrap gap-2 mb-4">
              <span className="text-[11px] font-semibold px-2.5 py-1 rounded-full bg-blue-50 text-blue-700 border border-blue-200">Mục tiêu: Doanh số (Sales)</span>
              <span className="text-[11px] font-semibold px-2.5 py-1 rounded-full bg-purple-50 text-purple-700 border border-purple-200">Sự kiện: Hoàn tất đăng ký</span>
              <span className="text-[11px] font-semibold px-2.5 py-1 rounded-full bg-amber-50 text-amber-700 border border-amber-200">Tạo ở PAUSED (duyệt rồi bật)</span>
              <span className="text-[11px] font-semibold px-2.5 py-1 rounded-full bg-gray-50 text-gray-600 border border-gray-200">VN · 1 creative/ad set · tối đa 3 ad set/campaign</span>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label className={labelClass}>Tài khoản QC {fbResLoading ? <span className="text-[11px] text-gray-400">(đang tải…)</span> : (fbRes ? <span className="text-[11px] text-green-600">({liveAccs.length} TK live)</span> : null)}</label>
                <select className={selectClass} value={autoAccount} onChange={e => onAutoAccountChange(e.target.value)}>
                  {accOptions.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                </select>
                {fbResErr ? <p className="text-[11px] text-amber-600 mt-1">⚠ Dùng danh sách cấu hình (lỗi tải live: {fbResErr})</p> : null}
              </div>
              <div>
                <label className={labelClass}>Page (Trang chạy QC)</label>
                <select className={selectClass} value={autoPage} onChange={e => setAutoPage(e.target.value)}>
                  {pageOptions.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                </select>
                {ACCOUNT_PAGE[autoAccount] && ACCOUNT_PAGE[autoAccount] !== autoPage
                  && (!curAcc || curAcc.pages.some(p => String(p.id) === ACCOUNT_PAGE[autoAccount])) && (
                  <button type="button" onClick={() => setAutoPage(ACCOUNT_PAGE[autoAccount])}
                    className="text-[11px] text-blue-600 hover:underline mt-1 text-left">
                    ⚠ Trang đang chọn khác trang mặc định của tkqc này — bấm để dùng {tenPage(ACCOUNT_PAGE[autoAccount], ACCOUNT_PAGE[autoAccount])}
                  </button>
                )}
                {curAcc && ACCOUNT_PAGE[autoAccount] && !curAcc.pages.some(p => String(p.id) === ACCOUNT_PAGE[autoAccount]) && (
                  <p className="text-[11px] text-red-600 mt-1">
                    ⛔ Không thấy {tenPage(ACCOUNT_PAGE[autoAccount], ACCOUNT_PAGE[autoAccount])} trong bất kỳ nguồn nào của tkqc này (promote_pages, trang BM, trang token quản lý) — vào Business Settings gán trang cho tài khoản.
                  </p>
                )}
                {/* Trang chưa được Meta xác nhận → cho bấm KIỂM TRA THẬT: tạo thử 1 creative
                    rồi xoá ngay (/api/fb-test-page), không tạo campaign, không tốn tiền. */}
                {trangDangChon && !trangDangChon.promote && (
                  <p className="text-[11px] text-amber-600 mt-1">
                    ⚠ Trang này chưa nằm trong promote_pages (nguồn: {trangDangChon.nguon === "business" ? "BM của tkqc" : "token quản lý"}) — bấm Kiểm tra trước khi chạy.
                  </p>
                )}
                <div className="flex items-center gap-2 mt-1.5">
                  <button type="button" onClick={kiemTraTrang} disabled={!autoAccount || !autoPage || testPageBusy}
                    className="text-[11px] font-semibold px-2.5 py-1 rounded-lg border border-gray-300 bg-white hover:bg-gray-50 disabled:opacity-50">
                    {testPageBusy ? "Đang kiểm tra…" : "🔍 Kiểm tra trang này chạy được không"}
                  </button>
                  {testPageMsg && <span className={"text-[11px] " + (testPageMsg.startsWith("✓") ? "text-green-600" : "text-red-600")}>{testPageMsg}</span>}
                </div>
              </div>
              <div>
                <label className={labelClass}>Pixel</label>
                <select className={selectClass} value={autoPixel} onChange={e => setAutoPixel(e.target.value)}>
                  {pixelOptions.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                </select>
              </div>
              <div className="md:col-span-2">
                <label className={labelClass}>Nhóm chạy</label>
                <div className="flex gap-2">
                  {["TEST", "SCALE"].map(gr => (
                    <button key={gr} type="button" onClick={() => setAutoGroup(gr)}
                      className={"px-4 py-2 rounded-lg text-sm font-bold border-2 transition " +
                        (autoGroup === gr ? "bg-indigo-600 text-white border-indigo-600" : "bg-white text-gray-600 border-gray-300 hover:bg-gray-50")}>
                      {gr === "TEST" ? "🧪 TEST (video mới)" : "🚀 SCALE (creative đã thắng)"}
                    </button>
                  ))}
                </div>
                <p className="text-[11px] text-gray-500 mt-1.5">
                  Mỗi sản phẩm có đúng 2 hộp sống lâu dài: <b>&lt;SP&gt; - TEST</b> và <b>&lt;SP&gt; - SCALE</b>.
                  Video mới luôn vào TEST (tối đa {MAX_TEST_ADS} creative — đủ rồi thì tự tắt cái cũ nhất).
                  Ad set đã có thì <b>thêm creative vào đó</b>, không tạo ad set mới và <b>không đụng ngân sách</b> (sửa ngân sách = reset máy học).
                  Creative thắng thì bê sang SCALE bằng nút ở bảng bên dưới.
                </p>
              </div>
              <div>
                <label className={labelClass}>Sản phẩm (danh mục — AI viết caption)</label>
                <select className={selectClass} value={autoCopyProduct} onChange={e => onAutoProductChange(e.target.value)}>
                  {Object.keys(PRODUCTS).map(p => <option key={p} value={p}>{p}</option>)}
                </select>
                {(PRODUCTS[autoCopyProduct] || {}).pixel && (PRODUCTS[autoCopyProduct] || {}).pixel !== autoPixel && (
                  <button type="button" onClick={() => setAutoPixel(PRODUCTS[autoCopyProduct].pixel)}
                    className="text-[11px] text-blue-600 hover:underline mt-1">
                    ⚠ Pixel đang chọn khác pixel của {autoCopyProduct} — bấm để dùng {(PRODUCTS[autoCopyProduct] || {}).pixelName}
                  </button>
                )}
              </div>
              <div className="md:col-span-2">
                <label className={labelClass}>Link đích</label>
                <input className={inputClass} value={autoLink} onChange={e => setAutoLink(e.target.value)} />
                {(PRODUCTS[autoCopyProduct] || {}).linkPn && (
                  <p className="text-[11px] text-gray-500 mt-1">
                    Landing của {autoCopyProduct}:{" "}
                    <button type="button" className="text-blue-600 hover:underline" onClick={() => setAutoLink(PRODUCTS[autoCopyProduct].link)}>Duy</button>
                    {" · "}
                    <button type="button" className="text-blue-600 hover:underline" onClick={() => setAutoLink(PRODUCTS[autoCopyProduct].linkPn)}>Phương Nam</button>
                    {" — chọn sản phẩm là tự điền link của Duy, bấm để đổi."}
                  </p>
                )}
              </div>
              <div>
                <label className={labelClass}>Ngân sách / campaign (VND/ngày)</label>
                <input className={inputClass} type="number" value={autoBudget} onChange={e => setAutoBudget(e.target.value)} />
              </div>
              <div>
                <label className={labelClass}>Người chạy (vào tên camp + UTM)</label>
                <input className={inputClass} value={autoRunner} onChange={e => setAutoRunner(e.target.value)} placeholder="vd: thangthattha" />
              </div>
              <div>
                <label className={labelClass}>Nút CTA</label>
                <select className={selectClass} value={autoCta} onChange={e => setAutoCta(e.target.value)}>

                  <option value="SHOP_NOW">Mua ngay</option>
                  <option value="LEARN_MORE">Tìm hiểu thêm</option>
                  <option value="SIGN_UP">Đăng ký</option>

              </div>
              <div>
                <label className={labelClass}>Tuổi từ</label>

              <div>
                <label className={labelClass}>Tuổi đến</label>
                <input className={inputClass} type="number" value={autoAgeMax} onChange={e => setAutoAgeMax(e.target.value)} />

              <div className="md:col-span-2">
                <label className={labelClass}>Số điện thoại (hotline trong bài)</label>
                <input className={inputClass} value={phone} placeholder="vd: 1900638597"
                  onChange={e => { setPhone(e.target.value); try { localStorage.setItem("doscom_ad_phone", e.target.value) } catch (err) {} }} />
                <label className="flex items-start gap-2 mt-2 text-[12px] text-gray-600">
                  <input type="checkbox" className="mt-0.5" checked={phoneAsCta} onChange={e => setPhoneAsCta(e.target.checked)} disabled={!phone} />
                  <span>Đổi nút CTA thành <b>Gọi ngay</b> (thay cho nút mua hàng).
                    Meta chỉ cho <b>một</b> nút trên mỗi quảng cáo — để trống ô này thì bài giữ nút mua hàng
                    và số hotline nằm cuối nội dung bài.</span>
                </label>
              </div>

              <div>
                <label className={labelClass}>Mục tiêu hiệu quả</label>
                <select className={selectClass} value={autoPerfGoal} onChange={e => setAutoPerfGoal(e.target.value)}>
                  <option value="conversions">Tối đa hoá số lượt chuyển đổi</option>

                </select>
                {autoPerfGoal === "value" && (
                  <p className="text-[11px] text-amber-600 mt-1">
                    ⚠ Cần pixel gửi kèm <b>value</b> cho sự kiện và đủ dữ liệu mua hàng (Meta khuyến nghị ~100 chuyển đổi có giá trị / tuần).
                    Chưa đủ thì phân phối sẽ chậm — mặc định nên để "số lượt chuyển đổi".
                  </p>
                )}
              </div>
              <div>
                <label className={labelClass}>Sàn ROAS (chỉ khi tối đa hoá giá trị)</label>
                <input className={inputClass} type="number" step="0.1" value={autoRoasFloor} placeholder="bỏ trống = không đặt sàn"
                  disabled={autoPerfGoal !== "value"}
                  onChange={e => setAutoRoasFloor(e.target.value)} />
