              <div className="md:col-span-2">
                <label className={labelClass}>Chiến lược vòng đời khách hàng</label>
                <select className={selectClass} value={autoLifecycle} onChange={e => setAutoLifecycle(e.target.value)}>
                  <option value="all">Thu hút lượt chuyển đổi từ tất cả đối tượng</option>
                  <option value="new">Chinh phục khách hàng mới</option>
                </select>
                <p className="text-[11px] text-amber-600 mt-1">
                  ⚠ Ghi được xuống ad set qua <code>existing_customer_budget_percentage</code> (tất cả đối tượng = 100, khách hàng mới = 0),
                  nhưng ô <b>"Chiến lược vòng đời khách hàng"</b> trong Trình quản lý QC vẫn hiện TRỐNG — Meta chưa mở control đó ra
                  Marketing API (đã dò v23.0 ngày 06/08, không có field nào khớp). Muốn ô đó có giá trị thì chọn tay trong Ads Manager,
                  <b>mỗi hộp TEST/SCALE chỉ phải làm một lần</b> vì ad set sống lâu dài. Để trống không chặn phân phối.
                </p>
                {autoLifecycle === "new" && (
                  <p className="text-[11px] text-amber-600 mt-1">
                    ⚠ Meta cần biết ai là khách CŨ để loại ra — phải có <b>danh sách khách hàng</b> (Custom Audience
                    kiểu Customer List) trong tài khoản. Chưa có thì Meta không loại được ai, chỉ thu hẹp phân phối.
                  </p>
                )}
              </div>
            </div>
          </div>

          {/* Chọn folder + chạy */}
          <div className="bg-white rounded-xl border-2 border-gray-200 p-5 shadow-sm">
            {ttFetch && (
              <div className={`mb-4 rounded-lg border-2 p-3 text-sm ${ttFetch.busy ? "bg-indigo-50 border-indigo-200" : (ttFetch.done ? "bg-green-50 border-green-200" : "bg-red-50 border-red-200")}`}>
                <p className="font-semibold text-gray-800">
                  {ttFetch.busy ? "🛍️ Đang lấy video từ TikTok Shop…" : (ttFetch.done ? "🛍️ Video từ TikTok Shop đã sẵn sàng" : "🛍️ Lấy video từ TikTok Shop thất bại")}
                </p>
                <p className="text-gray-600 mt-0.5">{ttFetch.msg}</p>
                {ttFetch.busy && (
                  <div className="h-1.5 bg-white rounded-full mt-2 overflow-hidden">
                    <div className="h-full bg-indigo-500 rounded-full transition-all"
                         style={{ width: `${Math.round((ttFetch.done / Math.max(1, ttFetch.total)) * 100)}%` }} />
                  </div>
                )}
                {!ttFetch.busy && (ttFetch.err || []).length > 0 && (
                  <details className="mt-2">
                    <summary className="text-xs text-red-700 cursor-pointer">{ttFetch.err.length} video lỗi — xem chi tiết</summary>
                    <ul className="text-xs text-red-700 mt-1 space-y-0.5">
                      {ttFetch.err.map((e, i) => <li key={i}>• {e}</li>)}
                    </ul>
                  </details>
                )}
              </div>
            )}
            <label className={labelClass}>Chọn folder sản phẩm (chứa video)</label>
            <input type="file" multiple webkitdirectory="" directory="" onChange={handleAutoFolderSelect}
              className="block w-full text-sm text-gray-600 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-indigo-50 file:text-indigo-700 file:font-semibold hover:file:bg-indigo-100" />
            <p className="text-xs text-gray-400 mt-1.5">Mẹo: chọn folder cha chứa nhiều folder con (mỗi con = 1 sản phẩm) để tạo nhiều campaign cùng lúc. Video chọn từ máy nên &lt; ~90MB (phải đi qua cloud); video lấy từ menu TikTok Shop thì không giới hạn — Facebook tự tải từ link.</p>

            {autoGroups.length > 0 && (
              <div className="mt-4 space-y-2">
                <p className="text-xs font-semibold text-gray-600">
                  Tìm thấy {autoTotalVideos} video trong {autoGroups.length} sản phẩm
                  {autoExisting && <span className="text-gray-500"> · <span className="text-green-700 font-bold">{autoNewVideos} mới</span>, {autoExistingCount} đã có ad</span>}:
                </p>
                {autoGroups.map(g => {
                  const newCnt = g.files.filter(isNewFile).length
                  return (
                  <div key={g.product} className="border border-gray-200 rounded-lg p-3">
                    <p className="text-sm font-bold text-gray-800">📁 {g.product}
                      <span className="font-normal text-gray-400"> — {g.files.length} video → 1 campaign</span>
                      {autoExisting && <span className={"ml-2 text-[11px] font-bold " + (newCnt > 0 ? "text-green-700" : "text-gray-400")}>({newCnt} mới)</span>}
                    </p>
                    <div className="mt-1.5 flex flex-wrap gap-1.5">
                      {g.files.map(f => {
                        const isNew = isNewFile(f)
                        return (
                          <span key={f.name}
                            className={"text-[11px] px-2 py-0.5 rounded-full border " +
                              (!autoExisting ? "bg-gray-50 text-gray-600 border-gray-200"
                                : isNew ? "bg-green-50 text-green-700 border-green-300"
                                : "bg-gray-100 text-gray-400 border-gray-200 line-through")}>
                            {autoExisting && (isNew ? "🆕 " : "✓ ")}{f.name}
                            {f.size > 0 && <span className="opacity-60"> · {(f.size / 1048576).toFixed(1)}MB</span>}
                          </span>
                        )
                      })}
                    </div>
                  </div>
                )})}
              </div>
            )}

            {autoScanMsg && (
              <p className={"mt-3 text-xs font-semibold " + (autoScanMsg.startsWith("✗") ? "text-red-600" : "text-green-700")}>{autoScanMsg}</p>
            )}

            <div className="mt-4 flex flex-col sm:flex-row gap-2">
              <button onClick={handleAutoScan} disabled={autoScanBusy || autoBusy || autoGroups.length === 0}
                className={"sm:w-auto px-4 py-3 rounded-lg text-sm font-bold border-2 " + (autoScanBusy || autoBusy || autoGroups.length === 0 ? "bg-gray-100 text-gray-400 border-gray-200 cursor-not-allowed" : "bg-white text-indigo-700 border-indigo-300 hover:bg-indigo-50")}>
                {autoScanBusy ? "Đang quét..." : "🔍 Quét video"}
              </button>
              <button onClick={handleAutoRun} disabled={autoBusy || autoScanBusy || autoNewVideos === 0}
                className={"flex-1 py-3 rounded-lg text-sm font-bold text-white " + (autoBusy || autoScanBusy || autoNewVideos === 0 ? "bg-gray-300 cursor-not-allowed" : "bg-indigo-600 hover:bg-indigo-700")}>
                {autoBusy ? "Đang chạy, đừng đóng tab..."
                  : autoNewVideos === 0 ? (autoExisting ? "✓ Không có video mới" : "Chọn folder trước")
                  : `⬆️ Upload ${autoNewVideos} video mới${autoExisting ? "" : " (bấm Quét để lọc trùng)"}`}
              </button>
            </div>
            <p className="text-[11px] text-gray-400 mt-2">Bấm <b>🔍 Quét video</b> để app đối chiếu sổ đã upload và bỏ qua video đã có ad. Bỏ qua bước quét thì sẽ upload tất cả video trong folder.</p>
          </div>

          {/* Tiến trình + kết quả */}
          {(autoLog.length > 0 || autoResults.length > 0) && (
            <div className="bg-gray-900 rounded-xl p-4 shadow-sm">
              <p className="text-xs font-bold text-gray-300 uppercase mb-2">Tiến trình</p>
              <pre className="text-[11px] whitespace-pre-wrap text-green-300 max-h-72 overflow-auto" style={{fontFamily:"ui-monospace,monospace"}}>{autoLog.join("\n")}</pre>
              {autoResults.length > 0 && (
                <div className="mt-3 space-y-2">
                  {autoResults.map((r, i) => (
                    <div key={i} className={"rounded-lg p-2.5 text-xs " + (r.ok ? "bg-green-50 border border-green-200" : "bg-red-50 border border-red-200")}>
                      {r.ok ? (
                        <div className="flex items-center justify-between gap-2">
                          <span className="text-green-800 font-semibold">✓ {r.product} — {r.ads_created} quảng cáo (PAUSED){r.skipped ? ` · ${r.skipped} video lỗi (giữ "mới")` : ""}</span>
                          {r.ads_manager_url && <a href={r.ads_manager_url} target="_blank" rel="noreferrer" className="text-blue-600 underline font-semibold whitespace-nowrap">Mở Ads Manager →</a>}
                        </div>
                      ) : (
                        <span className="text-red-700">✗ {r.product}: {r.error}</span>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* ══════════ BẢNG TEST vs SCALE ══════════
              Mỗi ad kèm số ngày chạy / chi tiêu / kết quả / CPL và lời khuyên đã chấm
              sẵn ở server (lib/fb-groups.js) theo đúng ngưỡng: chạy đủ 3 ngày + tiêu
              đủ 3× CPL mục tiêu mới được phán; CPL ≤ mục tiêu và ≥5 kết quả thì bê. */}
          <div className="bg-white rounded-xl border-2 border-gray-200 p-5 shadow-sm">
            <div className="flex items-center justify-between gap-3 mb-1">
              <h3 className="font-bold text-gray-800">🧪 TEST → 🚀 SCALE</h3>
              <button type="button" onClick={() => loadGroups()} disabled={groupsBusy}
                className="px-3 py-1.5 rounded-lg text-xs font-bold bg-gray-100 border border-gray-300 hover:bg-gray-200 disabled:opacity-50">
                {groupsBusy ? "Đang đọc…" : "↻ Tải lại"}
              </button>
            </div>
            <p className="text-[11px] text-gray-500 mb-3">
              CPL mục tiêu lấy từ chính nhóm SCALE của sản phẩm đó. Bê sang SCALE là <b>dùng lại đúng bài viết cũ</b> nên
              giữ nguyên like/comment/share; ad mới luôn ở trạng thái tạm dừng để bạn xem trước khi bật.
            </p>
            {groupsErr && <p className="text-xs text-red-600 mb-2">✗ {groupsErr}</p>}
            {groupMsg && <p className="text-xs font-semibold text-gray-700 mb-2">{groupMsg}</p>}

            {/* Thanh đẩy hàng loạt — chỉ hiện khi có creative đang được tick */}
            {dsDaTick().length > 0 && (
              <div className="mb-3 rounded-lg border-2 border-green-300 bg-green-50 p-3">
                <div className="flex flex-wrap items-center gap-2">
                  <span className="text-sm font-bold text-green-800">Đã chọn {dsDaTick().length} creative</span>
                  <button type="button" onClick={dayHangLoat} disabled={pushBusy}
                    className="px-3 py-1.5 rounded-lg text-xs font-bold bg-green-600 text-white hover:bg-green-700 disabled:opacity-50">
                    {pushBusy ? "Đang đẩy…" : `🚀 Đẩy ${dsDaTick().length} creative sang SCALE`}
                  </button>
                  <button type="button" onClick={() => setPicked({})} disabled={pushBusy}
                    className="px-3 py-1.5 rounded-lg text-xs font-bold bg-white border border-gray-300 text-gray-600 disabled:opacity-50">Bỏ chọn hết</button>
                  <label className="flex items-center gap-1.5 text-[11px] text-gray-600 ml-1">
                    <input type="checkbox" checked={tatSauKhiBe} onChange={e => setTatSauKhiBe(e.target.checked)} disabled={pushBusy} />
                    Tắt bản ở TEST sau khi bê
                  </label>
                </div>
                <p className="text-[11px] text-gray-600 mt-1.5">
                  Đẩy tuần tự từng cái để không lỡ tạo hai hộp SCALE trùng nhau. Máy đã tick sẵn creative đủ điều kiện — bạn bỏ tick hoặc tick thêm được.
                </p>
                {pushLogs.length > 0 && (
                  <pre className="mt-2 text-[11px] whitespace-pre-wrap text-gray-700 max-h-40 overflow-auto" style={{fontFamily:"ui-monospace,monospace"}}>{pushLogs.join("\n")}</pre>
                )}
              </div>
            )}
            {!groups && !groupsBusy && !groupsErr && <p className="text-xs text-gray-500">Bấm "Tải lại" để đọc trạng thái hai nhóm của tài khoản đang chọn.</p>}
            {groups && (groups.products || []).length === 0 && (
              <p className="text-xs text-gray-500">
                Tài khoản này chưa có hộp nào đặt tên theo chuẩn <b>&lt;sản phẩm&gt; - TEST/SCALE</b>.
                Campaign cũ (kiểu "5/8 - NOMA 680 - quangteo") không nằm trong bảng này — lần chạy tới sẽ dựng hộp mới.
              </p>
            )}
            {(groups && groups.products || []).map(p => (
              <div key={p.product} className="mb-5">
                <div className="flex items-baseline gap-2 mb-1.5">
                  <span className="font-bold text-sm text-gray-800">{p.product}</span>
                  <span className="text-[11px] text-gray-500">
                    {p.target_cpl ? `CPL mục tiêu ${Number(p.target_cpl).toLocaleString("vi-VN")}đ (từ nhóm SCALE)` : "chưa có CPL chuẩn — nhóm SCALE chưa ra kết quả"}
                  </span>
                </div>
                {["test", "scale"].map(k => {
                  const h = p[k]
                  if (!h) return <p key={k} className="text-[11px] text-gray-400 mb-1">— chưa có hộp {k.toUpperCase()}</p>
                  return (
                    <div key={k} className="mb-2 border border-gray-200 rounded-lg overflow-hidden">
                      <div className="flex items-center justify-between px-3 py-1.5 bg-gray-50 text-[11px] font-bold text-gray-700">
                        <span>{k === "test" ? "🧪" : "🚀"} {h.adset_name}
                          <span className="font-normal text-gray-500"> · {h.so_ad_dang_chay || 0}/{k === "test" ? MAX_TEST_ADS : 4} creative đang chạy
                            {h.daily_budget ? ` · ${Number(h.daily_budget).toLocaleString("vi-VN")}đ/ngày` : ""}</span>
                        </span>
                        <span className={h.adset_status === "ACTIVE" ? "text-green-600" : "text-amber-600"}>{h.adset_status}</span>
                      </div>
                      <table className="w-full text-[11.5px]">
                        <thead className="bg-white text-gray-500">
                          <tr>
                            {k === "test" && (
                              <th className="px-2 py-1 w-8" title="Tick creative muốn đẩy sang SCALE">
                                <input type="checkbox" disabled={pushBusy}
                                  checked={h.ads.some(a => a.dang_chay) && h.ads.filter(a => a.dang_chay).every(a => picked[a.ad_id])}
                                  onChange={e => setPicked(c => {
                                    const n = { ...c }
                                    for (const a of h.ads) {
                                      if (!a.dang_chay) continue
                                      if (e.target.checked) n[a.ad_id] = true; else delete n[a.ad_id]
                                    }
                                    return n
                                  })} />
                              </th>
                            )}
                            <th className="text-left px-3 py-1 font-semibold">Quảng cáo</th>
                            <th className="text-left px-2 font-semibold">UID video</th>
                            <th className="text-right px-2">Ngày</th><th className="text-right px-2">Chi</th><th className="text-right px-2">KQ</th><th className="text-right px-2">CPL</th><th className="text-left px-3">Chấm</th><th></th>
                          </tr>
                        </thead>
                        <tbody>
                          {h.ads.map(a => (
                            <tr key={a.ad_id} className={"border-t border-gray-100 " + (a.dang_chay ? "" : "opacity-50") + (picked[a.ad_id] ? " bg-green-50" : "")}>
                              {k === "test" && (
                                <td className="px-2 py-1.5 text-center">
                                  {a.dang_chay && (
                                    <input type="checkbox" disabled={pushBusy} checked={!!picked[a.ad_id]}
                                      onChange={e => setPicked(c => {
                                        const n = { ...c }
                                        if (e.target.checked) n[a.ad_id] = true; else delete n[a.ad_id]
                                        return n
                                      })} />
                                  )}
                                </td>
                              )}
                              <td className="px-3 py-1.5">{a.ad_name}</td>
                              <td className="px-2 py-1.5 text-gray-500" style={{fontFamily:"ui-monospace,monospace"}}>
                                {a.tiktok_id
                                  ? <a href={`https://www.tiktok.com/@_/video/${a.tiktok_id}`} target="_blank" rel="noreferrer"
                                       className="text-blue-600 hover:underline" title="Mở video gốc trên TikTok">{a.tiktok_id}</a>
                                  : (a.video_id ? <span title="ID video trên Facebook (chưa khớp được sổ TikTok)">fb:{a.video_id}</span> : "—")}
                              </td>
                              <td className="text-right px-2 tabular-nums">{a.days}</td>
                              <td className="text-right px-2 tabular-nums">{Math.round(a.spend).toLocaleString("vi-VN")}</td>
                              <td className="text-right px-2 tabular-nums font-semibold">{a.results}</td>
                              <td className="text-right px-2 tabular-nums">{a.cpl ? a.cpl.toLocaleString("vi-VN") : "—"}</td>
                              <td className="px-3 py-1.5">
                                {a.verdict === "promote" && <span className="text-green-700 font-bold">Bê sang SCALE</span>}
                                {a.verdict === "kill" && <span className="text-red-700 font-bold">Nên tắt</span>}
                                {a.verdict === "watch" && <span className="text-amber-600 font-semibold">Theo dõi thêm</span>}
                                {a.verdict === "wait" && <span className="text-gray-500">Chưa đủ dữ liệu</span>}
                                {a.verdict === "off" && <span className="text-gray-400">Đã tắt</span>}
                                <span className="text-gray-400"> · {a.ly_do}</span>
                              </td>
                              <td className="px-2 py-1 whitespace-nowrap text-right">
                                {k === "test" && a.dang_chay && (
                                  <>
                                    <button type="button" disabled={!!actBusy} onClick={() => promoteAd(a, p.product)}
                                      className={"px-2 py-1 rounded text-[11px] font-bold mr-1 disabled:opacity-40 " +
                                        (a.verdict === "promote" ? "bg-green-600 text-white" : "bg-white border border-gray-300 text-gray-600")}>
                                      {actBusy === a.ad_id ? "…" : "Bê sang SCALE"}
                                    </button>
                                    <button type="button" disabled={!!actBusy} onClick={() => tatAd(a)}
                                      className="px-2 py-1 rounded text-[11px] font-bold bg-white border border-gray-300 text-gray-600 disabled:opacity-40">Tắt</button>
                                  </>
                                )}
                                {k === "scale" && a.dang_chay && (
                                  <button type="button" disabled={!!actBusy} onClick={() => tatAd(a)}
                                    className="px-2 py-1 rounded text-[11px] font-bold bg-white border border-gray-300 text-gray-600 disabled:opacity-40">Tắt</button>
                                )}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )
                })}
              </div>
            ))}
          </div>
        </div>
      )}

      {mode === "manual" && (
      <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
        {/* LEFT 2 COLUMNS — Main form (stacked sections) */}
        <div className="lg:col-span-2 space-y-6">

          {/* ═══════════════ SECTION 1: CHIẾN DỊCH ═══════════════ */}
          <div className="bg-white rounded-xl border-2 border-blue-200 p-5 shadow-sm">
            <div className={sectionHeaderClass + " border-blue-500"}>
              <div className="w-10 h-10 rounded-full bg-blue-500 text-white flex items-center justify-center font-bold text-lg">1</div>
              <div>
                <h3 className="text-base font-bold text-blue-900">Chiến dịch (Campaign)</h3>
                <p className="text-xs text-gray-500 mt-0.5">Cấu hình cấp chiến dịch: mục tiêu, loại hình mua</p>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className="md:col-span-2">
                <label className={labelClass}>Sản phẩm</label>
                <select value={product} onChange={e => handleProductChange(e.target.value)} className={selectClass}>
                  {Object.keys(PRODUCTS).map(p => <option key={p} value={p}>{p}</option>)}
                </select>
              </div>

              <div className="md:col-span-2">
                <label className={labelClass}>Đặt tên chiến dịch</label>
                <input
                  type="text"
                  value={campaignName}
                  onChange={e => setCampaignName(e.target.value)}
                  className={inputClass}
                  placeholder={`VD: ${product} - ${(OBJECTIVES[objective] || {}).label || "Leads"} - ${new Date().toISOString().slice(0,10)}`}
                />
                <p className="text-xs text-gray-400 mt-1">Để trống sẽ tự đặt: {`${product} - ${(OBJECTIVES[objective] || {}).label || ""} - ${new Date().toISOString().slice(0,10)}`}</p>
              </div>

              <div className="md:col-span-2">
                <label className={labelClass}>Mục tiêu chiến dịch</label>
                <select value={objective} onChange={e => handleObjectiveChange(e.target.value)} className={selectClass}>
                  {Object.entries(OBJECTIVES).map(([key, cfg]) => (
                    <option key={key} value={key}>{cfg.label}</option>
                  ))}
                </select>
                <p className="text-xs text-gray-500 mt-1">{(OBJECTIVES[objective] || {}).desc} <span className="text-gray-400">· API: {objective}</span></p>

                    </div>
                    {ads.length > 1 && (
                      <button type="button" onClick={() => removeAd(ad.id)} className="text-xs text-red-600 hover:text-red-800 hover:underline font-semibold">
                        ✕ Xóa quảng cáo này
                      </button>
                    )}
                  </div>

                  <div className="space-y-4">
                    {/* Ad name */}
                    <div>
                      <label className={labelClass}>Đặt tên quảng cáo</label>
                      <input
                        type="text"
                        value={ad.adName}
                        onChange={e => updateAd(ad.id, { adName: e.target.value })}
                        className={inputClass}
                        placeholder={`VD: ${product} - Ad ${adIdx + 1} - Video Pain Point`}
                      />
                    </div>

                    {/* Media upload */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      <div>
                        <label className={labelClass}>Upload video</label>
                        <input
                          type="file"
                          accept="video/*"
                          onChange={e => handleVideoSelect(ad.id, e)}
                          className="w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
                        />
                      </div>
                      <div>
                        <label className={labelClass}>Hoặc upload ảnh</label>
                        <input
                          type="file"
                          accept="image/*"
                          onChange={e => handleImageSelect(ad.id, e)}
                          className="w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-gray-50 file:text-gray-700 hover:file:bg-gray-100"
                        />
                      </div>
                    </div>

                    {ad.mediaPreview && (
                      <div className="rounded-lg overflow-hidden border border-gray-200 bg-white">
                        {ad.videoFile ? (
                          <video src={ad.mediaPreview} controls className="w-full max-h-40 object-contain" />
                        ) : (
                          <img src={ad.mediaPreview} className="w-full max-h-40 object-contain" />
                        )}
                        <p className="text-xs text-gray-500 p-2 text-center">{ad.videoFile?.name || ad.imageFile?.name}</p>
                      </div>
                    )}

                    {/* Content */}
                    <div>
                      <label className={labelClass}>Tiêu đề (Headline)</label>
                      <input
                        type="text"
                        value={ad.headline}
                        onChange={e => updateAd(ad.id, { headline: e.target.value })}
                        className={inputClass}
                        placeholder="VD: Máy dò nghe lén D1 — Bảo vệ riêng tư"
                      />
                    </div>

                    <div>
                      <label className={labelClass}>Nội dung quảng cáo (Primary Text)</label>
                      <textarea
                        value={ad.adCopy}
                        onChange={e => updateAd(ad.id, { adCopy: e.target.value })}
                        className={inputClass + " h-28 resize-none"}
                        placeholder="Nhập nội dung quảng cáo hoặc dùng AI Content Generator bên dưới..."
                      />
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      <div>
                        <label className={labelClass}>Call to Action (CTA)</label>
                        <select value={ad.cta} onChange={e => updateAd(ad.id, { cta: e.target.value })} className={selectClass}>
                          {CTAS.map(c => <option key={c} value={c}>{c.replace(/_/g, " ")}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className={labelClass}>Link đích (Landing page)</label>
                        <input
                          type="url"
                          value={ad.link}
                          onChange={e => updateAd(ad.id, { link: e.target.value })}
                          className={inputClass}
                          placeholder="https://doscom.vn/san-pham/d1"
                        />
                      </div>
                    </div>

                    {/* UTM BOX */}
                    <div className="bg-amber-50 border-2 border-amber-200 rounded-lg p-3">
                      <h5 className="text-xs font-bold text-amber-900 mb-2 flex items-center gap-1.5">
                        🔗 UTM Tracking Parameters
                        <span className="text-[10px] font-normal text-amber-700">— để track traffic trên GA/Pancake</span>
                      </h5>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                        <div>
                          <label className="text-[10px] font-semibold text-amber-800 uppercase">utm_source</label>
                          <input type="text" value={ad.utmSource} onChange={e => updateAd(ad.id, { utmSource: e.target.value })} className="w-full border border-amber-300 rounded px-2 py-1.5 text-xs focus:ring-1 focus:ring-amber-500" placeholder="facebook" />
                        </div>
                        <div>
                          <label className="text-[10px] font-semibold text-amber-800 uppercase">utm_medium</label>
                          <input type="text" value={ad.utmMedium} onChange={e => updateAd(ad.id, { utmMedium: e.target.value })} className="w-full border border-amber-300 rounded px-2 py-1.5 text-xs focus:ring-1 focus:ring-amber-500" placeholder="paid / cpc" />
                        </div>
                        <div>
                          <label className="text-[10px] font-semibold text-amber-800 uppercase">utm_campaign</label>
                          <input type="text" value={ad.utmCampaign} onChange={e => updateAd(ad.id, { utmCampaign: e.target.value })} className="w-full border border-amber-300 rounded px-2 py-1.5 text-xs focus:ring-1 focus:ring-amber-500" placeholder={`${product}_${new Date().toISOString().slice(0,7)}`} />
                        </div>
                        <div>
                          <label className="text-[10px] font-semibold text-amber-800 uppercase">utm_content</label>
                          <input type="text" value={ad.utmContent} onChange={e => updateAd(ad.id, { utmContent: e.target.value })} className="w-full border border-amber-300 rounded px-2 py-1.5 text-xs focus:ring-1 focus:ring-amber-500" placeholder={`ad${adIdx + 1}_video`} />
                        </div>
                        <div className="md:col-span-2">
                          <label className="text-[10px] font-semibold text-amber-800 uppercase">utm_term (tùy chọn — keyword)</label>
                          <input type="text" value={ad.utmTerm} onChange={e => updateAd(ad.id, { utmTerm: e.target.value })} className="w-full border border-amber-300 rounded px-2 py-1.5 text-xs focus:ring-1 focus:ring-amber-500" placeholder="chong_nghe_len" />
                        </div>
                      </div>
                      {ad.link && (
                        <div className="mt-2 bg-white border border-amber-200 rounded p-2 space-y-1.5">
                          <div>
                            <p className="text-[10px] font-semibold text-amber-800 uppercase mb-0.5">Link đích (giữ nguyên)</p>
                            <p className="text-xs font-mono text-gray-700 break-all">{ad.link}</p>
                          </div>
                          {buildUtmString(ad) && (
                            <div className="pt-1 border-t border-amber-100">
                              <p className="text-[10px] font-semibold text-amber-800 uppercase mb-0.5">→ Thông số URL (điền vào ô "Thông số URL" của Meta)</p>
                              <p className="text-xs font-mono text-gray-700 break-all">{buildUtmString(ad)}</p>
                            </div>
                          )}
                        </div>
                      )}
                    </div>

                    {/* AI Content Generator button */}
                    <button
                      type="button"
                      onClick={() => handleGenerateContent(ad.id)}
                      disabled={aiLoading}
                      className={`w-full py-2.5 rounded-lg font-bold text-xs shadow-sm transition flex items-center justify-center gap-2 ${
                        aiLoading && aiTargetAdId === ad.id
                          ? "bg-amber-200 text-amber-700 cursor-wait"
                          : "bg-gradient-to-r from-amber-500 to-orange-500 text-white hover:from-amber-600 hover:to-orange-600"
                      }`}
                    >
                      {aiLoading && aiTargetAdId === ad.id ? (
                        <>
                          <div className="animate-spin w-4 h-4 border-2 border-amber-700 border-t-transparent rounded-full"></div>
                          Đang viết content cho Ad #{adIdx + 1}...
                        </>
                      ) : (
                        <><Wand /> Sinh content AI cho Ad #{adIdx + 1}</>
                      )}
                    </button>

                    {/* AI variants shown only for the target ad */}
                    {aiTargetAdId === ad.id && aiError && (
                      <div className="bg-red-50 border border-red-200 rounded-lg p-3">
                        <p className="text-xs font-semibold text-red-700 mb-1">Lỗi sinh content</p>
                        <p className="text-xs text-red-600">{aiError}</p>
                      </div>
                    )}
                    {aiTargetAdId === ad.id && aiVariants.length > 0 && (
                      <div className="space-y-2">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
                          {aiVariants.map((v) => {
                            // Nhãn lấy từ DẠNG BÀI server đã giao, không gán cứng theo
                            // vị trí A/B/C nữa — mỗi lần bấm là một bộ dạng khác.
                            const palette = ["pink", "blue", "amber", "teal", "purple"]
                            const cfg = {
                              color: palette[aiVariants.indexOf(v) % palette.length],
                              emoji: "📝",
                              label: v.style_label || v.style || "—",
                            }
                            const isSelected = aiSelectedId === v.id
                            return (
                              <div key={v.id} className={`bg-white rounded-lg border-2 p-2 ${isSelected ? `border-${cfg.color}-500` : "border-gray-200"}`}>
                                <div className={`text-[10px] font-bold mb-1.5 text-${cfg.color}-700 flex items-center gap-1`}>
                                  <span>{cfg.emoji}</span>
                                  <span>Bản {v.id} — {cfg.label}</span>
                                </div>
                                <div className="space-y-1 text-[11px]">
                                  <p className="font-semibold text-gray-800">{v.headline}</p>
                                  <p className="text-gray-600 whitespace-pre-wrap leading-tight max-h-24 overflow-y-auto">{v.primary_text}</p>
                                </div>
                                <button
                                  type="button"
                                  onClick={() => handleUseVariant(v)}
                                  className={`mt-2 w-full py-1.5 rounded text-[11px] font-bold text-white ${isSelected ? "bg-green-600" : `bg-${cfg.color}-500 hover:bg-${cfg.color}-600`}`}
                                >
                                  {isSelected ? "✓ Đã fill" : "Dùng bản này"}
                                </button>
                              </div>
                            )
                          })}
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              ))}

              {/* BUTTON: Tạo thêm quảng cáo */}
              <button
                type="button"
                onClick={addAd}
                className="w-full py-3 border-2 border-dashed border-green-400 text-green-700 rounded-xl font-semibold text-sm hover:bg-green-50 hover:border-green-500 transition flex items-center justify-center gap-2"
              >
                <span className="text-lg">+</span> Tạo thêm quảng cáo
              </button>
            </div>

            {/* AI Content input shared (applied when clicking generate on a specific ad) */}
            <div className="mt-5 bg-amber-50 border border-amber-200 rounded-lg p-3">
              <p className="text-xs font-semibold text-amber-900 mb-2">⚙️ Cấu hình AI Content (áp dụng cho ad bạn bấm sinh)</p>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                <input
                  type="text"
                  value={aiKeyword}
                  onChange={e => setAiKeyword(e.target.value)}
                  className="w-full border border-amber-300 rounded px-2 py-1.5 text-xs"
                  placeholder="Từ khóa chính (VD: chống nghe lén)"
                />
                <input
                  type="text"
                  value={aiDirection}
                  onChange={e => setAiDirection(e.target.value)}
                  className="w-full border border-amber-300 rounded px-2 py-1.5 text-xs"
                  placeholder="Hướng content (VD: nhấn mạnh đi công tác)"
                />
              </div>
              <div className="mt-2">
                <input
                  type="text"
                  value={aiPromotion}
                  onChange={e => setAiPromotion(e.target.value)}
                  className="w-full border border-amber-300 rounded px-2 py-1.5 text-xs"
                  placeholder="Khuyến mãi (tùy chọn — VD: Giảm 500K + tặng thẻ nhớ 32GB, hết 31/10). Để trống nếu không có KM — AI sẽ không tự bịa."
                />
                <p className="text-[10px] text-amber-700 mt-1 italic">💡 Nếu bạn KHÔNG điền, AI sẽ chỉ giữ dòng Bảo hành 12 tháng và không tự ý thêm giảm giá / quà tặng / "chỉ hôm nay".</p>
              </div>
              <div className="mt-2">
                <label className="block text-[11px] font-semibold text-amber-900 mb-1">Dạng bài</label>
                <select
                  value={aiStyle}
                  onChange={e => setAiStyle(e.target.value)}
                  className="w-full border border-amber-300 rounded px-2 py-1.5 text-xs bg-white"
                >
                  <option value="">🎲 Tự xoay — mỗi lần bấm đổi kiểu tiêu đề</option>
                  {aiFormats.map(f => (
                    <option key={f.key} value={f.key}>{f.label}</option>
                  ))}
                </select>
                <p className="text-[10px] text-amber-700 mt-1 italic">
                  {aiStyle
                    ? (aiFormats.find(f => f.key === aiStyle) || {}).bestFor || ""
                    : "Hiện chỉ chạy dạng đã được duyệt. Mỗi lần bấm, tiêu đề đổi sang một kiểu khác (vấn đề + chốt hạ, số người đã mua, câu hỏi, gọi thẳng nhóm khách…)."}
                </p>
              </div>
            </div>
          </div>

        </div>

        {/* RIGHT COLUMN — Preview & Publish */}
        <div className="space-y-5">
          <div className="bg-white rounded-xl border border-gray-200 p-5 shadow-sm sticky top-4">
            <h3 className="text-sm font-bold text-gray-800 mb-4 flex items-center gap-2"><Eye /> Xem trước cấu hình</h3>

            <div className="space-y-1 text-sm">
              {[
                ["Chiến dịch", campaignName || `${product} - ${(OBJECTIVES[objective] || {}).label} - ${new Date().toISOString().slice(0,10)}`],
                ["Mục tiêu", (OBJECTIVES[objective] || {}).label],
                ["Loại hình mua", (BUYING_TYPES.find(b => b.value === buyingType) || {}).label],
                ["Nhóm QC", adsetName || `${product} - AdSet - ${new Date().toISOString().slice(0,10)}`],
                ["Tối ưu hóa", GOAL_LABELS[optGoal] || optGoal],
                ["Điểm đến", DESTINATION_LABELS[destType] || destType],
                ["Tính phí", (BILLING_EVENTS.find(b => b.value === billingEvent) || {}).label],
                ["Tài khoản", ACCOUNTS[account]],
                ["Page", (PAGES[page] || "").split(" (")[0]],
                ["Pixel", `${PIXELS[pixel] || ""} · ${pixel}`],
                ["Ngân sách", `${Number(budget).toLocaleString("vi-VN")}đ ${budgetType === "daily" ? "/ngày" : "trọn đời"} (${budgetLevel === "campaign" ? "CBO" : "ABO"})`],
                ["Giới tính", gender === "all" ? "Tất cả" : gender === "male" ? "Nam" : "Nữ"],
                ["Độ tuổi", `${ageMin} – ${ageMax}${ageMax >= 65 ? "+" : ""}`],
                ["Vị trí", (countries.length ? countries : ["VN"]).join(", ")],
                ["Lịch", `${(startDate || "Ngay").replace("T", " ")} → ${(endDate || "∞").replace("T", " ")}`],
                ["Số quảng cáo", `${ads.length} ad(s)`],
              ].map(([label, val], i) => (
                <div key={i} className="flex justify-between py-1 border-b border-gray-50 gap-2">
                  <span className="text-gray-400 text-xs whitespace-nowrap">{label}</span>
                  <span className="font-semibold text-xs text-right truncate">{val}</span>
                </div>
              ))}
            </div>

            {/* LAUNCH STATUS TOGGLE */}
            <div className="mt-4 bg-gray-50 border border-gray-200 rounded-lg p-3">
              <label className="text-xs font-semibold text-gray-600 uppercase tracking-wide mb-2 block">Trạng thái sau khi tạo</label>
              <div className="flex gap-2">
                <button
                  type="button"
                  onClick={() => setLaunchStatus("ACTIVE")}
                  className={`flex-1 py-2 text-xs font-semibold rounded-lg border transition ${launchStatus === "ACTIVE" ? "bg-green-50 border-green-500 text-green-700" : "bg-white border-gray-300 text-gray-500"}`}
                >
                  🟢 Bật ngay (ACTIVE)
                </button>
                <button
                  type="button"
                  onClick={() => setLaunchStatus("PAUSED")}
                  className={`flex-1 py-2 text-xs font-semibold rounded-lg border transition ${launchStatus === "PAUSED" ? "bg-amber-50 border-amber-500 text-amber-700" : "bg-white border-gray-300 text-gray-500"}`}
                >
                  ⏸️ Tạm dừng để review
                </button>
              </div>
              <p className="text-[11px] text-gray-500 mt-1.5">
                {launchStatus === "ACTIVE"
                  ? "⚠️ Campaign + AdSet + Ad sẽ ACTIVE ngay — Meta bắt đầu review và tiêu tiền sau khi duyệt (~15-60 phút)"
                  : "An toàn: Tạo ở trạng thái PAUSED, bạn review trên Ads Manager rồi mới bật"}
              </p>
            </div>

            {/* PUBLISH BUTTON */}
            <button
              type="button"
              onClick={handlePublish}
              disabled={!canPublish}
              className={`w-full mt-3 py-4 rounded-xl text-white font-bold text-sm shadow-lg transition flex items-center justify-center gap-2 ${
                !canPublish
                  ? "bg-gray-300 cursor-not-allowed"
                  : launchStatus === "ACTIVE"
                    ? "bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-700 hover:to-emerald-700 active:scale-[0.98]"
                    : "bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 active:scale-[0.98]"
              }`}
            >
              <Megaphone /> Tạo chiến dịch ({ads.length} ads) {launchStatus === "ACTIVE" ? "— Bật ngay" : "— Tạm dừng"}
            </button>

            {!canPublish && (
              <p className="text-xs text-gray-400 text-center mt-2">Điền tiêu đề & nội dung cho tất cả các ad</p>
            )}

            {/* STATUS */}
            {status === "ready" && (
              <div className="mt-3 bg-amber-50 border border-amber-200 rounded-xl p-3">
                <p className="text-xs font-semibold text-amber-800 mb-2">Xác nhận tạo chiến dịch?</p>
                <pre className="text-[10px] bg-white p-2 rounded border border-amber-100 overflow-auto max-h-40 whitespace-pre-wrap">{statusMsg}</pre>
                <div className="flex gap-2 mt-2">
                  <button onClick={handleConfirm} className="flex-1 bg-blue-600 text-white py-2 rounded-lg text-xs font-semibold hover:bg-blue-700">Xác nhận & Gửi</button>
                  <button onClick={() => setStatus(null)} className="flex-1 bg-gray-100 text-gray-600 py-2 rounded-lg text-xs font-semibold hover:bg-gray-200">Hủy</button>
                </div>
              </div>
            )}
            {status === "sending" && (
              <div className="mt-3 bg-blue-50 border border-blue-200 rounded-xl p-3 text-center">
                <div className="animate-spin inline-block w-5 h-5 border-2 border-blue-600 border-t-transparent rounded-full mb-1"></div>
                <p className="text-xs text-blue-700">{statusMsg}</p>
              </div>
            )}
            {status === "done" && (() => {
              let parsed = null
              try { parsed = JSON.parse(statusMsg) } catch(e) {}
              return (
                <div className="mt-3 bg-green-50 border border-green-200 rounded-xl p-3">
                  <p className="text-xs font-semibold text-green-800 mb-2">✅ Đã tạo thành công trên Meta!</p>
                  {parsed ? (
                    <div className="space-y-1 text-[11px] text-green-700">
                      <p><span className="text-green-500">Campaign:</span> <span className="font-mono">{parsed.campaign_id}</span></p>
                      <p><span className="text-green-500">AdSet:</span> <span className="font-mono">{parsed.adset_id}</span></p>
                      <p><span className="text-green-500">Ads tạo:</span> {parsed.ads_created}</p>
                      {parsed.open_in_ads_manager && (
                        <a href={parsed.open_in_ads_manager} target="_blank" rel="noreferrer" className="block mt-2 text-center bg-blue-600 text-white py-2 rounded-lg text-xs font-semibold hover:bg-blue-700">
                          Mở trong Ads Manager →
                        </a>
                      )}
                    </div>
                  ) : (
                    <pre className="text-[10px] whitespace-pre-wrap text-green-600">{statusMsg}</pre>
                  )}
                  <button onClick={() => { setStatus(null); setAds([makeEmptyAd(0)]); setCampaignName(""); setAdsetName("") }} className="mt-2 w-full bg-green-600 text-white py-2 rounded-lg text-xs font-semibold hover:bg-green-700">
                    Tạo chiến dịch mới
                  </button>
                </div>
              )
            })()}
            {status === "error" && (
              <div className="mt-3 bg-red-50 border border-red-200 rounded-xl p-3">
                <p className="text-xs font-semibold text-red-800 mb-1">❌ Tạo chiến dịch thất bại</p>
                <pre className="text-[10px] whitespace-pre-wrap text-red-700 max-h-60 overflow-auto">{statusMsg}</pre>
                <button onClick={() => setStatus(null)} className="mt-2 w-full bg-gray-200 text-gray-700 py-2 rounded-lg text-xs font-semibold hover:bg-gray-300">
                  Thử lại
                </button>
              </div>
            )}
          </div>

          {/* INSTRUCTIONS */}
          <div className="bg-gray-50 rounded-xl p-4 border border-gray-200">
            <h4 className="text-xs font-bold text-gray-600 uppercase mb-2">Quy trình</h4>
            <div className="space-y-1.5 text-xs text-gray-500">
              <p><span className="font-bold text-gray-700">1.</span> Điền 3 mục: Chiến dịch → Nhóm QC → Quảng cáo</p>
              <p><span className="font-bold text-gray-700">2.</span> "Tạo thêm quảng cáo" để thêm ad vào cùng 1 nhóm</p>
              <p><span className="font-bold text-gray-700">3.</span> Ấn "Tạo chiến dịch" → Xác nhận & Gửi</p>
              <p><span className="font-bold text-gray-700">4.</span> Hệ thống tự upload media + tạo Campaign/AdSet/Ad (PAUSED) qua Meta API</p>
              <p><span className="font-bold text-gray-700">5.</span> Review trên Ads Manager → Bật ACTIVE</p>
            </div>
          </div>
        </div>

      </div>
      )}
    </div>
  )
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(AdsCreatorPanel));
</script>
</body>
</html>
