<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sửa brandcore — NOMA</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --ink:#1f2430; --mut:#6b7280; --line:#e6e8ef;
          --blue:#2563eb; --red:#dc2626; --green:#16a34a; --amber:#d97706; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Nunito',system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); font-size:14px; }
  .wrap { max-width:1100px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1; }
  select, input[type=text] { padding:8px 10px; border:1px solid var(--line); border-radius:9px; font:inherit; background:#fff; }
  button { padding:8px 14px; border:0; border-radius:9px; font:inherit; font-weight:700; cursor:pointer; background:var(--blue); color:#fff; }
  button.sec { background:#eef1f8; color:var(--ink); }
  button.warn { background:var(--amber); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px; font-weight:700; }
  .pill.red { background:#fde8e8; color:var(--red); }
  .pill.green { background:#e7f6ec; color:var(--green); }
  .pill.grey { background:#eef1f8; color:var(--mut); }
  .pill.amber { background:#fef3c7; color:var(--amber); }
  .muted { color:var(--mut); font-size:13px; }
  .err { color:var(--red); font-weight:700; }
  .hide { display:none; }
  a { color:var(--blue); }

  /* Thanh trên cùng: chọn web MỘT LẦN, dính lại khi cuộn để luôn biết đang làm ở web nào. */
  .bar { position:sticky; top:0; z-index:20; background:var(--card); border:1px solid var(--line);
         border-radius:12px; padding:12px 14px; margin-bottom:12px; }

  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .tab { padding:8px 12px; border-radius:9px; background:#eef1f8; color:var(--ink); font-weight:700;
         cursor:pointer; font-size:13px; }
  .tab.on { background:var(--blue); color:#fff; }
  .tab .n { display:inline-block; margin-left:6px; padding:0 7px; border-radius:999px; background:rgba(0,0,0,.12); font-size:11px; }
  .tab.on .n { background:rgba(255,255,255,.25); }
  .tab.hetviec { opacity:.6; }
  .tab .n.xong { background:#e7f6ec; color:#16a34a; }
  .tab.on .n.xong { background:rgba(255,255,255,.3); color:#fff; }
  .chan { background:#fffbeb; border:1px solid #fde68a; border-radius:10px; padding:10px 12px;
          font-size:13px; color:#92400e; margin-bottom:10px; }
  details.xongCard > summary { cursor:pointer; padding:6px 0; border-top:1px solid var(--line); }

  /* Thanh hành động — LUÔN nằm trên danh sách, dính lại khi cuộn. */
  .act { position:sticky; top:68px; z-index:10; background:#fbfbfe; border:1px solid var(--line);
         border-radius:10px; padding:9px 12px; margin-bottom:10px; }

  /* Dòng kết quả: gọn, chi tiết mở bằng ▸ */
  .it { border-bottom:1px solid var(--line); padding:7px 4px; }
  .it:last-child { border-bottom:0; }
  .it .hd { display:flex; gap:8px; align-items:flex-start; }
  .it .tt { font-weight:700; font-size:13.5px; word-break:break-word; }
  .it .meta { font-size:12px; color:var(--mut); margin-top:2px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .it details { margin-top:5px; }
  .it summary { cursor:pointer; font-size:12px; color:var(--blue); }
  .flag { background:#fde8e8; color:var(--red); border-radius:7px; padding:1px 7px; font-size:11px; font-weight:700; }
  .cmp { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px; }
  .cmp .box { border:1px solid var(--line); border-radius:8px; padding:7px; max-height:200px; overflow:auto;
              font-size:12px; white-space:pre-wrap; word-break:break-word; background:#fbfbfd; }
  .cmp .lab { font-weight:700; font-size:11px; margin-bottom:3px; color:var(--mut); }
  .box.old { background:#fff7f7; }
  .box.new { background:#f4fbf6; }
  input.tnew { width:100%; padding:6px 9px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:7px 9px; border-bottom:1px solid var(--line); font-size:13px; vertical-align:top; }
  th { color:var(--mut); font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
  .stat { display:flex; gap:10px; flex-wrap:wrap; margin:4px 0 10px; }
  .stat .b { background:#f4f6fb; border-radius:10px; padding:10px 14px; min-width:110px; }
  .stat .n { font-size:22px; font-weight:800; }
  .stat .l { color:var(--mut); font-size:11px; }
  details.nguon > summary { cursor:pointer; font-weight:700; }

  /* Cửa sổ nổi duyệt nội dung bổ sung. */
  .modal-bg { position:fixed; inset:0; background:rgba(15,23,42,.55); display:flex;
              align-items:center; justify-content:center; z-index:999; padding:20px; }
  /* PHẢI có luật này: `.hide{display:none}` khai ở TRÊN, hai luật cùng độ ưu tiên thì
     luật đứng SAU thắng — thiếu dòng này là cửa sổ luôn hiện và bấm × không tắt. */
  .modal-bg.hide { display:none; }
  .modal { background:#fff; border-radius:14px; width:min(1100px,96vw); max-height:92vh;
           display:flex; flex-direction:column; box-shadow:0 24px 70px rgba(0,0,0,.35); }
  .modal-head, .modal-foot { padding:12px 16px; display:flex; align-items:center;
                             justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .modal-head { border-bottom:1px solid var(--line); }
  .modal-foot { border-top:1px solid var(--line); background:#fafbfe; border-radius:0 0 14px 14px; }
  .modal-body { padding:12px 16px; overflow:auto; }
  .modal .cmp .box { max-height:46vh; }
  .modal h2 { margin:0; font-size:16px; }
  .xbtn { background:transparent; color:var(--mut); font-size:22px; padding:0 8px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- Chọn web một lần rồi quét hết -->
  <div class="bar">
    <div class="row">
      <h1>Sửa brandcore</h1>
      <select id="site">
        <option value="doscom">doscom.vn</option>
        <option value="noma">noma.vn</option>
        <option value="nomaauto">nomaauto.us (EN)</option>
      </select>
      <button id="btnScanAll">Quét toàn bộ</button>
      <span id="tienDo" class="muted"></span>
      <span class="grow"></span>
      <input id="token" type="text" placeholder="Token (nếu Access tắt)" style="width:180px" />
    </div>
  </div>

  <!-- Nguồn tên chuẩn: hồ sơ SP + bảng tên EN -->
  <details id="nguonCard" class="card nguon">
    <summary>Nguồn tên chuẩn <span id="dossierNow" class="muted"></span></summary>

    <div class="row" style="margin-top:10px">
      <input id="dossierFile" type="file" style="flex:1;min-width:200px" />
      <button id="btnDossierPreview" class="sec">Xem trước</button>
      <button id="btnDossierApply">Nhập hồ sơ</button>
      <button id="btnDossierUndo" class="warn hide">Hoàn tác</button>
    </div>
    <div id="dossierMsg" class="muted" style="margin-top:6px"></div>

    <div id="enCard" class="hide" style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
      <div class="row"><b>Tên tiếng Anh (nomaauto.us)</b> <span id="enNow" class="muted"></span></div>
      <div class="row" style="margin-top:8px">
        <button id="btnEnDraft" class="sec">Soạn tên</button>
        <button id="btnEnRedo" class="sec">Dịch lại toàn bộ (AI)</button>
        <button id="btnEnSave" class="hide">Lưu bảng tên</button>
        <button id="btnEnUndo" class="warn hide">Hoàn tác</button>
      </div>
      <div id="enMsg" class="muted" style="margin-top:6px"></div>
      <div id="enBody"></div>
    </div>
  </details>

  <!-- Việc cần làm -->
  <div id="tabs" class="tabs hide"></div>

  <div id="panel" class="card hide">
    <!-- Thanh hành động nằm TRÊN danh sách; chỉ hiện nút của việc đang chọn. -->
    <div class="act row">
      <label class="row" style="gap:6px"><input type="checkbox" id="pickAll" /> Chọn tất cả</label>
      <span id="pickCount" class="muted"></span>
      <span class="grow"></span>
      <button id="btnRename" class="warn hide">Đổi tên đã chọn</button>
      <button id="btnTitleApply" class="warn hide">Vá tiêu đề đã chọn</button>
      <button id="btnTitleDraft" class="sec hide">Đặt tiêu đề bằng AI</button>
      <button id="btnAudit" class="sec hide">Rà brandcore bằng AI</button>
      <button id="btnGapDraft" class="hide">Soạn bổ sung (AI)</button>
      <button id="btnGap" class="sec hide">Quét lại</button>
    </div>
    <div id="panelInfo" class="muted" style="margin-bottom:6px"></div>
    <div id="panelBody"></div>
  </div>

  <!-- Bản sửa AI đề xuất -->
  <div id="applyCard" class="card hide">
    <div class="act row">
      <b>Bản sửa AI đề xuất</b>
      <span id="applyInfo" class="muted"></span>
      <span class="grow"></span>
      <button id="btnApply" class="warn">Áp bản sửa đã chọn</button>
    </div>
    <div id="proposals"></div>
  </div>

  <!-- Duyệt nội dung bổ sung, lần lượt từng mục -->
  <div id="duyetModal" class="modal-bg hide">
    <div class="modal">
      <div class="modal-head">
        <h2 id="duyetTen"></h2>
        <div class="row">
          <span id="duyetDem" class="muted"></span>
          <button class="xbtn" id="duyetDong" title="Đóng (Esc)">×</button>
        </div>
      </div>
      <div class="modal-body">
        <div id="duyetThieu" class="muted" style="margin-bottom:8px"></div>
        <div class="cmp">
          <div><div class="lab">Hiện tại (phần cuối)</div><div id="duyetCu" class="box old"></div></div>
          <div><div class="lab">Sẽ thêm vào cuối</div><div id="duyetMoi" class="box new"></div></div>
        </div>
        <div id="duyetKq" style="margin-top:10px"></div>
      </div>
      <div class="modal-foot">
        <span class="muted">Ghép vào cuối nội dung · có sao lưu trước khi ghi</span>
        <div class="row">
          <a id="duyetXemBai" class="hide" target="_blank" rel="noopener" style="font-weight:700">Xem trên web ↗</a>
          <button id="duyetBoQua" class="sec">Bỏ qua</button>
          <button id="duyetAp" class="warn">Áp lên web</button>
          <button id="duyetTiep" class="hide">Tiếp theo →</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
const stripHtml = (h) => String(h).replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();

window.addEventListener("error", (e) => {
  try { $("#tienDo").innerHTML = '<span class="err">Lỗi JS: ' + esc(e.message || e) + "</span>"; } catch (_) {}
});

const TK = "products_token";
$("#token").value = localStorage.getItem(TK) || "";
$("#token").addEventListener("change", () => localStorage.setItem(TK, $("#token").value.trim()));

function headers(write) {
  const h = { "content-type": "application/json" };
  if (write) { const t = $("#token").value.trim(); if (t) h["X-Products-Token"] = t; }
  return h;
}
const site = () => $("#site").value;

async function goiScan(body) {
  const r = await fetch("/api/products/brandcore-scan", {
    method: "POST", headers: headers(true), credentials: "same-origin", body: JSON.stringify(body),
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "lỗi quét");
  return j;
}
async function goiApply(body) {
  const r = await fetch("/api/products/brandcore-apply", {
    method: "POST", headers: headers(true), credentials: "same-origin", body: JSON.stringify(body),
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || "lỗi ghi");
  return j;
}

/* Năm việc của trang, mỗi việc bám một `target` cố định. Trước đây phải tự chọn loại
   nội dung trong ô thả xuống rồi quét lại từng loại; giờ "Quét toàn bộ" chạy hết một
   lượt, tab nào có việc thì hiện số ở đó. */
const VIEC = {
  ten:    { nhan: "Tên sản phẩm",     target: "product-name", dv: "sản phẩm" },
  bai:    { nhan: "Bài hướng dẫn",    target: "guide",        dv: "bài" },
  tieude: { nhan: "Tiêu đề bài viết", target: "guide",        dv: "bài" },
  mota:   { nhan: "Mô tả sản phẩm",   target: "product",      dv: "sản phẩm" },
  thieu:  { nhan: "Nội dung thiếu",   target: null,           dv: "mục" },
};
/* Mỗi việc giữ danh sách CHỜ LÀM (`rows`) và danh sách ĐÃ XONG (`xong`) của RIÊNG nó.
   Dùng chung một khối "đã sửa" cho cả trang thì xem lại không biết dòng nào thuộc việc
   nào, và bấm Hoàn tác dễ nhầm sang việc khác. */
const ST = {};
for (const k of Object.keys(VIEC)) ST[k] = { rows: [], info: "", loi: null, xong: [], hien: [] };
let viec = "ten";
/* SỔ ĐÃ XỬ LÝ trong phiên — khoá theo `target:id` nên một bài vá ở tab "Bài hướng dẫn"
   là biến mất luôn ở tab "Tiêu đề bài viết" (hai tab cùng đọc bài viết WordPress), và
   quét lại cũng không hiện ra nữa.
   Có lưu GIÁ TRỊ đã ghi: quét sau mà trên web vẫn đúng cái mình ghi thì ẩn; ai đó sửa
   ngược lại trên WordPress thì giá trị lệch → hiện lại để còn biết mà xử. */
const daXuLy = new Map();
const khoaXuLy = (target, id) => `${target}:${id}`;
let hienDaXuLy = false;      // bật để soi lại phần đang bị ẩn

function danhDauDaXuLy(target, id, giaTri, viecLam) {
  daXuLy.set(khoaXuLy(target, id), { gia_tri: giaTri == null ? null : String(giaTri), viec_lam: viecLam });
}
function daXuLyRoi(k, row) {
  const d = daXuLy.get(khoaXuLy(row.target || VIEC[k].target, row.id));
  if (!d) return false;
  if (d.gia_tri == null) return true;          // ghi nội dung, không có chuỗi để đối chiếu
  return [row.tieu_de, row.name].some((x) => x != null && String(x) === d.gia_tri);
}

let proposals = [];
let proposalTarget = "guide";
let proposalViec = "bai";     // proposals đang thuộc tab nào (để ghi "đã xong" đúng chỗ)
let chiPhiRa = 0;             // tiền AI của lượt rà gần nhất, giữ lại khi vẽ lại danh sách

/* Đổi website là mọi kết quả cũ vô nghĩa: bấm áp trên danh sách của web trước = ghi
   nhầm web. Dọn sạch, không giữ lại gì. */
$("#site").onchange = () => {
  for (const k of Object.keys(ST)) ST[k] = { rows: [], info: "", loi: null, xong: [], hien: [] };
  daXuLy.clear(); hienDaXuLy = false;
  proposals = [];
  $("#tabs").classList.add("hide"); $("#panel").classList.add("hide");
  $("#applyCard").classList.add("hide");
  $("#tienDo").textContent = "";
  capNhatNguon();
};

// Quét toàn bộ: chạy tuần tự, bước nào hỏng chỉ hỏng bước đó.
$("#btnScanAll").onclick = async () => {
  const btn = $("#btnScanAll");
  btn.disabled = true;
  for (const k of Object.keys(ST)) Object.assign(ST[k], { rows: [], info: "", loi: null });
  proposals = [];
  $("#applyCard").classList.add("hide");

  const buoc = [
    ["ten",    "tên sản phẩm",     () => goiScan({ site: site(), target: "product-name", mode: "list" })],
    ["bai",    "bài hướng dẫn",    () => goiScan({ site: site(), target: "guide", mode: "list" })],
    ["tieude", "tiêu đề bài viết", () => goiScan({ site: site(), target: "guide", mode: "title" })],
    ["mota",   "mô tả sản phẩm",   () => goiScan({ site: site(), target: "product", mode: "list" })],
    ["thieu",  "nội dung thiếu",   napThieu],
  ];
  for (let i = 0; i < buoc.length; i++) {
    const [k, ten, chay] = buoc[i];
    $("#tienDo").textContent = `Đang quét ${i + 1}/${buoc.length}: ${ten}…`;
    try { nhanKetQua(k, await chay()); }
    catch (e) { ST[k].loi = e.message; }
    veTabs();
  }
  $("#tienDo").innerHTML = Object.values(ST).some((v) => v.loi)
    ? '<span class="err">Xong — có bước lỗi, xem trong tab</span>' : "Quét xong";
  $("#tabs").classList.remove("hide");
  $("#panel").classList.remove("hide");
  moViec(viec);
  btn.disabled = false;
};

// Nội dung thiếu gộp CẢ HAI nguồn — người dùng không phải chọn lại loại nội dung.
async function napThieu() {
  const rows = [], canhBao = [];
  for (const target of ["guide", "product"]) {
    try {
      const j = await goiScan({ site: site(), target, mode: "gap" });
      for (const r of j.results || []) {
        if (!r.co_ho_so || r.bo_qua || !(r.thieu || []).length) continue;
        rows.push({ ...r, target });
      }
    } catch (e) { canhBao.push(`${target}: ${e.message}`); }
  }
  return { __thieu: true, rows, canh_bao: canhBao };
}

function nhanKetQua(k, j) {
  if (k === "thieu") {
    ST.thieu.rows = j.rows;
    ST.thieu.info = `${j.rows.length} mục còn thiếu nội dung so với hồ sơ`;
    if (j.canh_bao.length) ST.thieu.loi = j.canh_bao.join(" · ");
    return;
  }
  if (k === "tieude") {
    ST.tieude.rows = j.results || [];
    const d = j.dem_theo_loai || {};
    ST.tieude.info = `soát ${j.scanned} bài · ${j.tong_van_de} bài có vấn đề · ` + [
      d.rong ? `${d.rong} mất tiêu đề` : "",
      d.ten_sp ? `${d.ten_sp} sai tên sản phẩm` : "",
      d.sai_sku ? `${d.sai_sku} gắn nhầm mã` : "",
      d.trung_sku ? `${d.trung_sku} trùng mã` : "",
      d.brandcore ? `${d.brandcore} trái brand core` : "",
      d.trung ? `${d.trung} trùng tên` : "",
      d.dai ? `${d.dai} quá dài` : "",
    ].filter(Boolean).join(" · ");
    return;
  }
  const items = j.items || j.products || [];
  const canhBao = [];
  if (j.chua_co_ten_en_count) canhBao.push(`${j.chua_co_ten_en_count} chưa có tên tiếng Anh — soạn bảng tên ở "Nguồn tên chuẩn"`);
  if (j.trung_ma_count) canhBao.push(`${j.trung_ma_count} trùng mã — không tự đổi tên`);
  if (j.sai_sp_count) canhBao.push(`${j.sai_sp_count} nghi viết sai sản phẩm`);
  if (j.con_bai_chua_quet) canhBao.push("còn bài chưa quét tới");
  if (j.raw_ok === false) canhBao.push("có bài không đọc được bản gốc — sẽ không ghi được");

  if (k === "ten") {
    ST.ten.rows = items.filter((x) => x.can_doi_ten || x.trung_ma || x.chua_co_ten_en);
    ST.ten.info = `${j.scanned} sản phẩm NOMA · ${j.doi_ten_count} cần đổi tên`;
  } else if (k === "bai") {
    ST.bai.rows = items.filter((x) => x.can_doi_ten || x.sai_ten_sp || x.sai_sp_noi_dung || (x.flags || []).length);
    ST.bai.info = `${j.scanned} bài hướng dẫn · ${j.doi_ten_count} cần đổi tiêu đề · ${j.flagged_count} có cờ vi phạm`;
  } else {
    ST.mota.rows = items.filter((x) => (x.flags || []).length);
    ST.mota.info = `${j.scanned} sản phẩm · ${j.flagged_count} có cờ vi phạm`;
  }
  if (canhBao.length) ST[k].info += " · " + canhBao.join(" · ");
}

function veTabs() {
  $("#tabs").innerHTML = Object.entries(VIEC).map(([k, v]) => {
    const n = conViec(k).length, x = ST[k].xong.length;
    return `<div class="tab ${k === viec ? "on" : ""} ${n ? "" : "hetviec"}" data-k="${k}">${v.nhan}` +
      `<span class="n">${n}${ST[k].loi ? " ⚠" : ""}</span>${x ? `<span class="n xong">✓${x}</span>` : ""}</div>`;
  }).join("");
  $$("#tabs .tab").forEach((t) => { t.onclick = () => moViec(t.dataset.k); });
}

function moViec(k) {
  viec = k;
  veTabs();
  // Chỉ bật nút của việc đang mở — không bày hết ra rồi để người dùng đoán.
  const hien = {
    btnRename:     k === "ten" || k === "bai",
    btnTitleApply: k === "tieude",
    btnTitleDraft: k === "tieude",
    btnAudit:      k === "bai" || k === "mota",
    btnGapDraft:   k === "thieu",
    btnGap:        k === "thieu",
  };
  for (const [id, on] of Object.entries(hien)) $("#" + id).classList.toggle("hide", !on);
  $("#btnRename").textContent = k === "ten" ? "Đổi tên đã chọn" : "Đổi tiêu đề đã chọn";
  $("#applyCard").classList.toggle("hide", !(proposals.length && (k === "bai" || k === "mota")));
  veBang();
}

function conViec(k) {
  return ST[k].rows.filter((r) => !daXuLyRoi(k, r));
}

function veBang() {
  const s = ST[viec];
  const an = s.rows.length - conViec(viec).length;
  // `hien` là danh sách ĐANG VẼ; mọi chỗ đọc lựa chọn phải bám theo nó, không bám `rows`.
  s.hien = hienDaXuLy ? s.rows : conViec(viec);
  $("#panelInfo").innerHTML = (s.loi ? `<span class="err">${esc(s.loi)}</span> · ` : "") + esc(s.info || "");
  if (!s.hien.length) {
    $("#panelBody").innerHTML = veAnBot(an) +
      `<p class="muted">${s.loi ? "Không quét được." : an ? "Đã xử lý hết trong phiên này." : "Không có việc cần làm."}</p>` + veXong();
    $("#pickAll").checked = false;
    buocNut();
    return demChon();
  }
  const ve = { ten: veTen, bai: veBai, tieude: veTieuDe, mota: veMota, thieu: veThieu }[viec];
  $("#panelBody").innerHTML = veChanTruoc() + veAnBot(an) + s.hien.map(ve).join("") + veXong();
  $$(".pick").forEach((cb) => { cb.onchange = demChon; });
  const hl = $("#btnHienLai");
  if (hl) hl.onclick = (e) => { e.preventDefault(); hienDaXuLy = !hienDaXuLy; veBang(); };
  const mo = $("#btnMoNguon");
  if (mo) mo.onclick = () => {
    $("#nguonCard").open = true;
    $("#nguonCard").scrollIntoView({ behavior: "smooth" });
    enDraft(false);
  };
  $("#pickAll").checked = $$(".pick").length > 0 && $$(".pick:not(:checked)").length === 0;
  buocNut();
  demChon();
}

/* Dòng cho biết đang giấu bao nhiêu — giấu mà không nói thì lần sau người dùng tưởng
   quét sót. Bấm là soi lại được. */
function veAnBot(n) {
  if (!n) return "";
  return `<div class="muted" style="margin:0 0 8px">Đang ẩn <b>${n}</b> mục đã xử lý trong phiên này ·
    <a href="#" id="btnHienLai">${hienDaXuLy ? "ẩn đi" : "hiện lại"}</a></div>`;
}

/* Khối XEM LẠI của riêng việc đang mở: đã ghi gì lên web trong phiên này, kèm nút hoàn
   tác từng dòng. Ghi hỏng cũng nằm ở đây — giấu đi là người dùng tưởng đã sửa xong. */
function veXong() {
  const ds = ST[viec].xong;
  if (!ds.length) return "";
  const ok = ds.filter((x) => x.applied).length;
  const rows = ds.map((x, i) => {
    const st = x.applied ? `<span class="pill green">đã ghi</span>`
      : x.bo_qua ? `<span class="pill grey">bỏ qua</span>`
      : `<span class="pill red">lỗi</span>`;
    const undo = x.applied && x.backup_key
      ? `<button class="sec" onclick="revert(${x.id},'${esc(x.backup_key)}','${esc(x.target)}',this)">Hoàn tác</button>` : "";
    const ten = x.permalink
      ? `<a href="${esc(x.permalink)}" target="_blank" rel="noopener">${esc(x.name)}</a>`
      : esc(x.name);
    return `<tr><td>${ten} <span class="muted">#${x.id}</span>${x.error ? `<div class="err" style="font-size:12px">${esc(x.error)}</div>` : ""}</td>
      <td>${esc(x.viec_lam)}${x.chi_tiet || x.bo_qua ? `<div class="muted" style="font-size:12px">${esc(x.chi_tiet || x.bo_qua)}</div>` : ""}</td>
      <td>${st}</td><td>${undo}</td></tr>`;
  }).join("");
  return `<details class="xongCard" open style="margin-top:14px">
    <summary><b>Đã xong trong phiên này — ${ok}/${ds.length} ${VIEC[viec].dv}</b></summary>
    <table><tbody>${rows}</tbody></table></details>`;
}

/* Ghi kết quả một lượt áp vào ĐÚNG việc vừa làm. Nhận nguyên phản hồi của
   brandcore-apply: `ok` của phản hồi không đủ — từng dòng vẫn có thể hỏng riêng. */
function ghiNhanXong(k, j, viecLam, giaTriTheoId) {
  const target = j.target || VIEC[k].target || "guide";
  for (const it of j.items || []) {
    /* Ghi được, hoặc web vốn đã mang đúng nội dung định ghi → coi như xong, ẩn khỏi
       danh sách chờ ở MỌI tab cùng nguồn và ở cả lần quét sau. */
    if (it.applied || it.skipped === "không có gì thay đổi") {
      danhDauDaXuLy(target, it.id, giaTriTheoId ? giaTriTheoId.get(it.id) : null, viecLam);
    }
    ST[k].xong.unshift({
      id: it.id, name: it.name || `#${it.id}`, permalink: it.permalink,
      applied: Boolean(it.applied), error: it.error || null, bo_qua: it.skipped || null,
      backup_key: it.backup_key || null, target,
      viec_lam: viecLam,
      chi_tiet: (it.violations_fixed || []).join(", ") || (it.ten_cu ? `trước: ${it.ten_cu}` : ""),
    });
  }
  /* Tóm tắt lên thanh trên cùng — chỗ luôn nhìn thấy. Trước 27/08/2026 lượt ghi mà máy
     chủ trả về TOÀN "không có gì thay đổi" thì giao diện im hoàn toàn: không dòng nào
     biến mất, khối "đã xong" cũng trống, nhìn hệt như nút hỏng. */
  const ghi = (j.items || []).filter((x) => x.applied).length;
  const boQua = (j.items || []).filter((x) => !x.applied && x.skipped).length;
  const loi = (j.items || []).filter((x) => x.error).length;
  $("#tienDo").innerHTML = `${viecLam}: <b>${ghi}</b> đã ghi` +
    (boQua ? ` · ${boQua} bỏ qua (nội dung trên web đã trùng với bản định ghi)` : "") +
    (loi ? ` · <span class="err">${loi} lỗi</span>` : "");
}


/* Việc đang bị CHẶN vì thiếu thứ phải làm trước. Trước 27/08/2026 chỉ có con số nhỏ
   trong dòng thống kê, nên bấm "Đổi tiêu đề" ra thông báo "trùng mã" — sai lý do và
   không nói phải làm gì tiếp. */
function veChanTruoc() {
  const n = ST[viec].rows.filter((x) => x.chua_co_ten_en).length;
  if (!n) return "";
  return `<div class="chan">
    <b>${n} mục chưa có tên tiếng Anh nên chưa đổi được.</b>
    Bảng tên tiếng Anh là nguồn tên chuẩn của nomaauto.us — không có nó thì công cụ sẽ
    đem tên tiếng Việt đi đổi tên trên trang bán cho khách Mỹ, nên nó dừng lại.
    <div style="margin-top:8px"><button id="btnMoNguon" class="sec">Soạn bảng tên tiếng Anh ngay</button></div>
  </div>`;
}

/* Không còn việc thì tắt nút hành động — để sáng đèn là mời bấm vào chỗ rỗng. */
function buocNut() {
  const rong = !(ST[viec].hien || []).length;
  for (const id of ["btnRename", "btnTitleApply", "btnTitleDraft", "btnAudit", "btnGapDraft"]) {
    $("#" + id).disabled = rong;
  }
}

const oTick = (i, tick) => `<input type="checkbox" class="pick" data-i="${i}" ${tick ? "checked" : ""} />`;
const link = (p) => (p.permalink ? `<a href="${esc(p.permalink)}" target="_blank" rel="noopener">↗</a>` : "");

function khoiSaiSp(p) {
  if (!p.sai_ten_sp && !p.sai_sp_noi_dung) return "";
  const a = p.sai_ten_sp ? `tiêu đề mang tên của <b>NOMA ${esc(p.sai_ten_sp.ma)}</b>` : "";
  const b = p.sai_sp_noi_dung
    ? `nội dung khớp ${p.sai_sp_noi_dung.phu}% tên sản phẩm của bài, khớp ${p.sai_sp_noi_dung.phu_khop}% với <b>NOMA ${esc(p.sai_sp_noi_dung.ma_khop)}</b>`
    : "";
  return `<div class="meta"><span class="pill red">sai sản phẩm?</span> ${[a, b].filter(Boolean).join(" · ")}</div>`;
}

function veTen(p, i) {
  const nhan = [
    p.sku ? `<span class="pill grey">SKU ${esc(p.sku)}</span>` : "",
    p.trung_ma ? `<span class="pill red">trùng mã — sửa tay</span>` : "",
    p.chua_co_ten_en ? `<span class="pill red">chưa có tên tiếng Anh</span>` : "",
  ].filter(Boolean).join(" ");
  const doi = p.can_doi_ten ? `<div class="meta">→ <b>${esc(p.ten_chuan)}</b></div>` : "";
  return `<div class="it"><div class="hd">${oTick(i, p.can_doi_ten)}
    <div style="flex:1"><div class="tt">${esc(p.name)} <span class="muted">#${p.id}</span> ${link(p)}</div>
      <div class="meta">${nhan}</div>${doi}</div></div></div>`;
}

function veBai(p, i) {
  const nhan = [
    p.la_noma ? `<span class="pill green">NOMA</span>` : `<span class="pill grey">Doscom</span>`,
    p.sku ? `<span class="pill grey">SKU ${esc(p.sku)}</span>` : "",
    p.trung_ma ? `<span class="pill red">trùng mã</span>` : "",
    p.raw === false ? `<span class="pill red">không ghi được</span>` : "",
    ...(p.flags || []).map((f) => `<span class="flag">${esc(f.type)}</span>`),
  ].filter(Boolean).join(" ");
  const doi = p.can_doi_ten ? `<div class="meta">→ <b>${esc(p.ten_chuan)}</b></div>` : "";
  return `<div class="it"><div class="hd">${oTick(i, p.can_doi_ten || (p.flags || []).length > 0)}
    <div style="flex:1"><div class="tt">${esc(p.name)} <span class="muted">#${p.id}</span> ${link(p)}</div>
      <div class="meta">${nhan}</div>${doi}${khoiSaiSp(p)}</div></div></div>`;
}

function veMota(p, i) {
  const nhan = (p.flags || []).map((f) => `<span class="flag">${esc(f.type)}</span>`).join(" ");
  return `<div class="it"><div class="hd">${oTick(i, true)}
    <div style="flex:1"><div class="tt">${esc(p.name)} <span class="muted">#${p.id}</span> ${link(p)}</div>
      <div class="meta">${nhan}</div></div></div></div>`;
}

function veTieuDe(r, i) {
  const vd = (r.van_de || []).map((v) => `<span class="flag" title="${esc(v.chi_tiet || "")}">${esc(v.nhan)}</span>`).join(" ");
  const d = r.draft || {};
  const chan = (d.vi_pham && d.vi_pham.length)
    ? `trái brand core (${d.vi_pham.map((x) => esc(x.type)).join(", ")}) — sửa tay trước khi vá`
    : d.trung_voi ? `trùng tiêu đề bài #${d.trung_voi}`
    : d.trung_khuon ? `cướp khuôn bài hướng dẫn #${d.trung_khuon.id}` : "";
  const goiY = d.tieu_de_moi || r.de_xuat || "";
  // Đề xuất trùng khít tiêu đề đang có → không có gì để vá, đừng tick sẵn.
  const daDung = goiY && goiY === (r.tieu_de || "");
  const o = d.loi
    ? `<div class="err" style="font-size:12px">${esc(d.loi)}</div>`
    : goiY
      ? `<input type="text" class="tnew" data-id="${r.id}" value="${esc(goiY)}" />
         ${chan ? `<div class="err" style="font-size:12px">⛔ ${chan}</div>` : ""}`
      : `<span class="muted">cần AI đề xuất</span>`;
  const hienTai = r.tieu_de_rong ? `<span class="pill red">mất tiêu đề</span>` : esc(r.tieu_de);
  return `<div class="it"><div class="hd">${oTick(i, Boolean(!daDung && (r.tieu_de_rong || r.de_xuat)))}
    <div style="flex:1"><div class="tt">${hienTai} <span class="muted">#${r.id}</span> ${link(r)}
      ${daDung ? '<span class="pill green">đã đúng</span>' : ""}</div>
      <div class="meta">${vd}</div><div style="margin-top:4px">${o}</div></div></div></div>`;
}

function veThieu(r, i) {
  const muc = (r.thieu || []).map((x) => `<span class="flag">${esc(x.nhan)}</span>`).join(" ");
  const chiTiet = (r.thieu || []).map((x) =>
    `<div style="margin:5px 0"><b>${esc(x.nhan)}</b><div class="box old">${esc(x.trich_ho_so)}</div></div>`).join("");
  return `<div class="it"><div class="hd">${oTick(i, true)}
    <div style="flex:1"><div class="tt">${esc(r.name)} <span class="muted">#${r.id}</span> ${link(r)}</div>
      <div class="meta"><span class="pill grey">${r.target === "guide" ? "bài" : "sản phẩm"}</span>
        <span class="pill amber">độ phủ ${r.diem ?? "—"}%</span> ${muc}</div>
      <details><summary>xem trích hồ sơ</summary>${chiTiet}</details></div></div></div>`;
}

$("#pickAll").onchange = () => {
  $$(".pick").forEach((cb) => { cb.checked = $("#pickAll").checked; });
  demChon();
};
function demChon() {
  const n = $$(".pick:checked").length;
  $("#pickCount").textContent = n ? `đã chọn ${n}/${$$(".pick").length}` : "";
}
const dangChon = () => $$(".pick:checked").map((cb) => (ST[viec].hien || [])[+cb.dataset.i]).filter(Boolean);

// Đổi tên sản phẩm / tiêu đề bài theo hồ sơ — không AI.
$("#btnRename").onclick = async () => {
  const laTen = viec === "ten";
  const chon = dangChon();
  const picks = chon.filter((p) => p.can_doi_ten && p.ten_chuan);
  if (!picks.length) {
    /* Nói ĐÚNG lý do của nhóm đang chọn. Trước đây câu nào cũng đổ cho "trùng mã" nên
       người dùng đi gộp bài trong khi thật ra chỉ thiếu bảng tên tiếng Anh. */
    const ly = [];
    const enThieu = chon.filter((p) => p.chua_co_ten_en).length;
    const trungMa = chon.filter((p) => p.trung_ma).length;
    const khongMa = chon.filter((p) => !p.sku).length;
    const dungRoi = chon.filter((p) => p.sku && !p.trung_ma && !p.chua_co_ten_en && !p.can_doi_ten).length;
    if (enThieu) ly.push(`• ${enThieu} mục CHƯA CÓ TÊN TIẾNG ANH → mở "Nguồn tên chuẩn" ở trên, bấm "Soạn tên" rồi "Lưu bảng tên"`);
    if (trungMa) ly.push(`• ${trungMa} mục TRÙNG MÃ sản phẩm → gộp/xoá bớt trên web trước, đổi cả hai về một tên chỉ làm trùng khít hơn`);
    if (khongMa) ly.push(`• ${khongMa} mục KHÔNG DÒ RA MÃ NOMA (combo, bài thiết bị Doscom) → không có hồ sơ để đối chiếu`);
    if (dungRoi) ly.push(`• ${dungRoi} mục ĐÃ ĐÚNG TÊN rồi`);
    return alert(`Không có mục nào đổi được trong ${chon.length} mục đang chọn.\n\n` +
      (ly.length ? ly.join("\n") : "Không mục nào có tên chuẩn để thay."));
  }
  // Hai dòng cùng nhận một tên trong một lượt = tự tạo trùng lặp mới.
  const dem = {};
  for (const p of picks) dem[p.ten_chuan] = (dem[p.ten_chuan] || 0) + 1;
  const trung = Object.keys(dem).filter((t) => dem[t] > 1);
  if (trung.length) return alert("Nhiều dòng đang nhận CÙNG một tên:\n\n" + trung.join("\n"));
  if (!confirm(`Đổi tên ${picks.length} ${VIEC[viec].dv} trên ${site()}? (có sao lưu, hoàn tác được)`)) return;

  const btn = $("#btnRename");
  btn.disabled = true; btn.textContent = "Đang đổi…";
  try {
    const j = await goiApply({
      site: site(), target: VIEC[viec].target,
      // Bài viết đổi `title`, sản phẩm WooCommerce đổi `name` — hai nguồn, hai trường.
      fixes: picks.map((p) => (laTen ? { id: p.id, name: p.ten_chuan } : { id: p.id, title: p.ten_chuan })),
    });
    ghiNhanXong(viec, j, laTen ? "Đổi tên sản phẩm" : "Đổi tiêu đề bài",
                new Map(picks.map((p) => [p.id, p.ten_chuan])));
    veTabs(); veBang();
  } catch (e) { alert(e.message); }
  btn.disabled = false; btn.textContent = laTen ? "Đổi tên đã chọn" : "Đổi tiêu đề đã chọn";
};

/* Rà brandcore bằng AI: TỪNG mục một (mỗi request ~10-15s) thay vì gộp — gộp nhiều mục
   vào một request là chạm trần thời gian của Cloudflare. Kết quả đổ dần. */
$("#btnAudit").onclick = async () => {
  const picks = dangChon();
  if (!picks.length) return alert("Chọn ít nhất 1 dòng để rà.");
  proposalTarget = VIEC[viec].target;
  proposalViec = viec;
  const btn = $("#btnAudit");
  btn.disabled = true;
  $("#applyCard").classList.remove("hide");
  const tatCa = [];
  let cost = 0;
  for (let i = 0; i < picks.length; i++) {
    btn.textContent = `Đang rà ${i + 1}/${picks.length}…`;
    try {
      const j = await goiScan({ site: site(), target: proposalTarget, mode: "audit", ids: [picks[i].id] });
      tatCa.push(...(j.results || [])); cost += j.cost_usd || 0; chiPhiRa = cost;
    } catch (e) { tatCa.push({ id: picks[i].id, name: picks[i].name, error: e.message }); }
    proposals = tatCa.filter((x) => x.has_violations && !x.error && !x.skipped);
    veProposals(tatCa, cost);
  }
  btn.disabled = false; btn.textContent = "Rà brandcore bằng AI";
};

function veProposals(results, cost) {
  const sach = results.filter((x) => !x.has_violations && !x.error && !x.skipped).length;
  const loi = results.filter((x) => x.error).length;
  $("#applyInfo").textContent = `${proposals.length} có vi phạm · ${sach} sạch · ${loi} lỗi · ~$${(cost || 0).toFixed(4)}`;
  $("#proposals").innerHTML = proposals.map((p, i) => {
    const vio = (p.violations || []).map((v) =>
      `<tr><td><span class="flag">${esc(v.type)}</span></td><td>${esc(v.original)}</td><td>${esc(v.fixed)}</td></tr>`).join("");
    const canhBao = [
      (p.not_applied || []).length ? `⚠ ${p.not_applied.length} cặp không khớp chữ gốc → không áp: ${p.not_applied.map(esc).join(", ")}` : "",
      (p.name_flags || []).length ? `⚠ Lỗi nằm ở tiêu đề/tên (tool không sửa): ${p.name_flags.map(esc).join(", ")}` : "",
      p.khong_ghi_duoc ? `⛔ ${esc(p.khong_ghi_duoc)} — sẽ KHÔNG ghi` : "",
    ].filter(Boolean).map((t) => `<div class="err" style="font-size:12px">${t}</div>`).join("");
    return `<div class="it"><div class="hd">
      <input type="checkbox" class="applypick" data-i="${i}" ${p.khong_ghi_duoc ? "" : "checked"} />
      <div style="flex:1"><div class="tt">${esc(p.name)} <span class="muted">#${p.id}</span> ${link(p)}</div>
        <table><thead><tr><th>Loại</th><th>Gốc</th><th>Sửa thành</th></tr></thead><tbody>${vio}</tbody></table>${canhBao}
        <details><summary>xem nội dung trước/sau</summary><div class="cmp">
          <div><div class="lab">GỐC</div><div class="box old">${esc(stripHtml(p.original_description ?? p.original_content ?? ""))}</div></div>
          <div><div class="lab">ĐÃ SỬA</div><div class="box new">${esc(stripHtml(p.fixed_description ?? p.fixed_content ?? ""))}</div></div>
        </div></details></div></div></div>`;
  }).join("") || `<p class="muted">Không có dòng nào cần sửa.</p>`;
}

$("#btnTitleDraft").onclick = async () => {
  /* AI chỉ dùng cho bài không suy ra được tiêu đề (mất tiêu đề hẳn). Bài sai tên sản
     phẩm đã có tên chuẩn dựng sẵn từ hồ sơ — không nhờ AI nghĩ hộ. */
  const chon = $$(".pick:checked").map((cb) => +cb.dataset.i).filter((i) => (ST.tieude.hien || [])[i] && ST.tieude.hien[i].tieu_de_rong);
  if (!chon.length) return alert("Chưa chọn bài MẤT TIÊU ĐỀ nào.\nBài sai tên sản phẩm đã có sẵn tiêu đề chuẩn — bấm “Vá tiêu đề đã chọn” là xong.");
  const btn = $("#btnTitleDraft");
  btn.disabled = true;
  let cost = 0;
  // Máy chủ nhận tối đa 10 bài/lượt → chia lô, chạy tuần tự cho khỏi quá hạn.
  for (let i = 0; i < chon.length; i += 5) {
    const lo = chon.slice(i, i + 5);
    btn.textContent = `Đang soạn ${Math.min(i + 5, chon.length)}/${chon.length}…`;
    try {
      const j = await goiScan({ site: site(), target: "guide", mode: "title-draft", ids: lo.map((k) => ST.tieude.hien[k].id) });
      cost += j.cost_usd || 0;
      for (const kq of j.results || []) {
        const row = ST.tieude.rows.find((x) => x.id === kq.id);
        if (row) row.draft = kq.error ? { loi: kq.error } : kq;
      }
      veBang();
      // Giữ nguyên lựa chọn sau khi vẽ lại để lô sau vẫn đúng bài.
      for (const k of chon) { const cb = document.querySelector(`.pick[data-i="${k}"]`); if (cb) cb.checked = true; }
      demChon();
    } catch (e) { alert("Lỗi khi soạn tiêu đề: " + e.message); break; }
  }
  $("#panelInfo").innerHTML += ` · chi phí AI ~$${cost.toFixed(4)}`;
  btn.disabled = false; btn.textContent = "Đặt tiêu đề bằng AI";
};

$("#btnTitleApply").onclick = async () => {
  /* Chỉ vá dòng ĐANG TICK và có tiêu đề hợp lệ. Dòng nào AI trả về tiêu đề trái brand
     core / trùng bài khác thì bỏ, TRỪ KHI người dùng đã gõ lại tay. */
  const fixes = [];
  for (const cb of $$(".pick:checked")) {
    const row = (ST.tieude.hien || [])[+cb.dataset.i];
    if (!row) continue;
    const o = document.querySelector(`.tnew[data-id="${row.id}"]`);
    if (!o) continue;
    const moi = o.value.trim();
    if (!moi) continue;
    const d = row.draft || {};
    const chuaSuaTay = moi === d.tieu_de_moi;
    if (chuaSuaTay && ((d.vi_pham && d.vi_pham.length) || d.trung_voi || d.trung_khuon)) continue;
    fixes.push({ id: row.id, title: moi });
  }
  if (!fixes.length) return alert("Không có tiêu đề nào hợp lệ để vá.\nDòng bị chặn là dòng AI đề xuất trái brand core hoặc trùng tên — sửa tay rồi thử lại.");
  const dem = {};
  for (const f of fixes) dem[f.title] = (dem[f.title] || 0) + 1;
  const trungLo = Object.keys(dem).filter((t) => dem[t] > 1);
  if (trungLo.length) return alert("Đang định đặt CÙNG MỘT tiêu đề cho nhiều bài:\n\n" + trungLo.join("\n"));
  if (!confirm(`Vá tiêu đề cho ${fixes.length} bài trên ${site()}? (có sao lưu, hoàn tác được)`)) return;

  const btn = $("#btnTitleApply");
  btn.disabled = true; btn.textContent = "Đang vá…";
  try {
    const j = await goiApply({ site: site(), target: "guide", fixes });
    ghiNhanXong("tieude", j, "Vá tiêu đề", new Map(fixes.map((f) => [f.id, f.title])));
    veTabs(); veBang();
  } catch (e) { alert(e.message); }
  btn.disabled = false; btn.textContent = "Vá tiêu đề đã chọn";
};

$("#btnGap").onclick = async () => {
  const btn = $("#btnGap");
  btn.disabled = true; btn.textContent = "Đang quét…";
  ST.thieu.loi = null;
  try { nhanKetQua("thieu", await napThieu()); }
  catch (e) { ST.thieu.loi = e.message; }
  veTabs(); veBang();
  btn.disabled = false; btn.textContent = "Quét lại";
};

/* Ba nấc, cố ý tách rời: dò (miễn phí) → soạn (tốn AI, chỉ xem trước) → áp (ghi thật,
   có sao lưu). Gộp lại một nút thì người bấm không kịp đọc nội dung AI viết. */
$("#btnGapDraft").onclick = async () => {
  const picks = dangChon();
  if (!picks.length) return alert("Chưa chọn mục nào.");
  if (picks.length > 10) return alert("Mỗi lượt tối đa 10 mục.");
  const btn = $("#btnGapDraft");
  btn.disabled = true; btn.textContent = "Đang soạn…";
  const canDuyet = [], boQua = [];
  let cost = 0;
  try {
    // Gộp theo target: bài viết và sản phẩm đi hai đường ghi khác nhau.
    for (const target of ["guide", "product"]) {
      const ids = picks.filter((p) => p.target === target).map((p) => p.id);
      if (!ids.length) continue;
      const j = await goiScan({ site: site(), target, mode: "gap-draft", ids });
      cost += j.cost_usd || 0;
      for (const x of j.results || []) {
        if (x.new_description || x.new_content) canDuyet.push({ ...x, target });
        else boQua.push(`${x.name}: ${x.error || x.bo_qua}`);
      }
    }
    if (!canDuyet.length) alert("Không soạn được nội dung nào.\n" + boQua.join("\n"));
    else moDuyet(canDuyet, cost);
  } catch (e) { alert("Lỗi khi soạn: " + e.message); }
  btn.disabled = false; btn.textContent = "Soạn bổ sung (AI)";
};

/* Duyệt lần lượt trong cửa sổ nổi: mỗi lần một mục. Đổ hết ra trang thì phải cuộn xa
   mới tới nút áp, và duyệt hàng loạt rất dễ bấm áp mà chưa đọc. */
let duyetDS = [], duyetI = 0, duyetKetQua = [];
const $d = (id) => document.getElementById(id);

function moDuyet(ds, cost) {
  duyetDS = ds; duyetI = 0; duyetKetQua = [];
  $d("duyetModal").classList.remove("hide");
  veDuyet(cost);
}
function veDuyet(cost) {
  if (duyetI >= duyetDS.length) return dongDuyet();
  const r = duyetDS[duyetI];
  if (!r || !r.added_html) return dongDuyet();
  $d("duyetTen").textContent = r.name;
  $d("duyetDem").textContent = `${duyetI + 1}/${duyetDS.length}` + (cost != null ? ` · AI $${Number(cost).toFixed(4)}` : "");
  $d("duyetThieu").innerHTML = "Bổ sung: " + (r.thieu || []).map((t) => `<span class="flag">${esc(t)}</span>`).join(" ");
  $d("duyetCu").textContent = (r.description_cu || r.noi_dung_cu || "(trống)").slice(-1500);
  $d("duyetMoi").textContent = r.added_html || "";
  $d("duyetKq").innerHTML = "";
  $d("duyetAp").disabled = false; $d("duyetAp").classList.remove("hide");
  $d("duyetBoQua").disabled = false; $d("duyetBoQua").classList.remove("hide");
  $d("duyetTiep").classList.add("hide");
  $d("duyetXemBai").classList.add("hide");
}
function dongDuyet() {
  $d("duyetModal").classList.add("hide");
  // Từng mục đã được ghi vào "đã xong" của tab Nội dung thiếu ngay lúc áp.
  veTabs(); veBang();
}
$d("duyetDong").onclick = dongDuyet;
$d("duyetBoQua").onclick = () => { duyetI++; veDuyet(); };
$d("duyetTiep").onclick = () => { duyetI++; veDuyet(); };
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$d("duyetModal").classList.contains("hide")) dongDuyet();
});

$d("duyetAp").onclick = async () => {
  const r = duyetDS[duyetI];
  $d("duyetAp").disabled = true; $d("duyetBoQua").disabled = true;
  $d("duyetKq").innerHTML = '<span class="muted">Đang ghi lên web…</span>';
  try {
    // Ghi TỪNG MỤC một: mỗi cái một bản sao lưu riêng, hỏng cái nào chỉ hỏng cái đó.
    const j = await goiApply({
      site: site(), target: r.target,
      // Bài hướng dẫn ghi vào `content`; sản phẩm ghi vào `description`.
      fixes: [{ id: r.id, ...(r.target === "guide" ? { content: r.new_content } : { description: r.new_description }) }],
    });
    /* Không tin mỗi `ok`: brandcore-apply trả ok=true cả khi từng mục ghi hỏng (lỗi nằm
       trong items[].error). Phải soi đúng dòng của mục này. */
    const it = (j.items || []).find((x) => String(x.id) === String(r.id)) || {};
    if (!it.applied) throw new Error(it.error || "web không xác nhận đã ghi");
    duyetKetQua.push(j);
    chuyenSangDaSua(r, j);
    $d("duyetKq").innerHTML = '<span class="pill green">✓ Đã ghi lên web</span> <span class="muted">— đã bỏ khỏi danh sách chờ.</span>';
    const l = it.permalink || r.permalink;
    if (l) { const a = $d("duyetXemBai"); a.href = l; a.classList.remove("hide"); }
    $d("duyetAp").classList.add("hide"); $d("duyetBoQua").classList.add("hide");
    $d("duyetTiep").classList.remove("hide");
    $d("duyetTiep").textContent = duyetI + 1 < duyetDS.length ? "Tiếp theo →" : "Xong — đóng lại";
  } catch (e) {
    $d("duyetKq").innerHTML = '<span class="err">✕ Ghi KHÔNG thành công: ' + esc(e.message) + "</span>";
    $d("duyetAp").disabled = false; $d("duyetBoQua").disabled = false;
  }
};

/* Mục vừa ghi xong thì bỏ khỏi danh sách chờ ngay — không phải tải lại trang, và không
   sửa lại lần hai cùng một mục. */
function chuyenSangDaSua(r, j) {
  ST.thieu.rows = ST.thieu.rows.filter((x) => !(x.id === r.id && x.target === r.target));
  ghiNhanXong("thieu", { ...j, target: r.target }, "Bổ sung nội dung thiếu");
  // Mục bổ sung nội dung không có chuỗi để đối chiếu → ẩn thẳng ở lần quét sau.
  danhDauDaXuLy(r.target, r.id, null, "Bổ sung nội dung thiếu");
  veTabs(); veBang();
}

async function revert(id, key, target, btn) {
  if (!confirm("Khôi phục nội dung gốc cho mục này?")) return;
  btn.disabled = true; btn.textContent = "Đang hoàn tác…";
  try {
    await goiApply({ mode: "revert", site: site(), target, id, backup_key: key });
    btn.textContent = "Đã hoàn tác ✓";
  } catch (e) { alert(e.message); btn.disabled = false; btn.textContent = "Hoàn tác"; }
}
window.revert = revert;

/* Hồ sơ sản phẩm: xem trước (dryrun) trước khi ghi đè — hồ sơ là nguồn thông số cho MỌI
   bài AI viết, nhập nhầm file là bài mới sai hướng dẫn hàng loạt mà không ai để ý ngay. */
const dFile = $("#dossierFile"), dMsg = $("#dossierMsg"), dNow = $("#dossierNow"), dUndo = $("#btnDossierUndo");
const tokenHeader = () => { const t = $("#token").value.trim(); return t ? { "X-Products-Token": t } : {}; };

async function dossierStatus() {
  try {
    const j = await (await fetch("/api/products/brandcore-import", { credentials: "same-origin" })).json();
    if (!j.ok) throw new Error(j.error || "lỗi");
    const d = j.data;
    dNow.textContent = d.nguon === "kv"
      ? `· ${d.so_san_pham} sản phẩm · ${new Date(d.cap_nhat).toLocaleDateString("vi-VN")}`
      : `· đang dùng bản dự phòng trong code (${d.so_san_pham} SP) — nên tải hồ sơ mới`;
    dUndo.classList.toggle("hide", !d.co_ban_hoan_tac);
  } catch (e) { dNow.textContent = "· không đọc được trạng thái: " + e.message; }
}

async function dossierSend(dryrun, undo) {
  if (!undo && !dFile.files[0]) { dMsg.innerHTML = '<span class="err">Chưa chọn file.</span>'; return; }
  const fd = new FormData();
  if (undo) fd.append("undo", "1");
  else { fd.append("file", dFile.files[0]); if (dryrun) fd.append("dryrun", "1"); }
  dMsg.textContent = undo ? "Đang hoàn tác…" : (dryrun ? "Đang đọc file…" : "Đang nhập…");
  try {
    const j = await (await fetch("/api/products/brandcore-import", {
      method: "POST", body: fd, headers: tokenHeader(), credentials: "same-origin",
    })).json();
    if (!j.ok) { dMsg.innerHTML = '<span class="err">' + esc(j.error || "lỗi") + "</span>"; return; }
    const d = j.data;
    if (d.hoan_tac) dMsg.innerHTML = `<span class="pill green">đã hoàn tác</span> ${d.so_san_pham} sản phẩm`;
    else {
      const t = d.thay_doi || {};
      const p = [`<span class="pill ${d.dryrun ? "grey" : "green"}">${d.dryrun ? "xem trước — CHƯA ghi" : "đã nhập"}</span>`,
                 `${d.so_san_pham} sản phẩm · ${d.so_cot} cột`];
      if (t.them && t.them.length) p.push(`thêm: ${t.them.join(", ")}`);
      // "Mất" = có trong bản đang dùng nhưng thiếu trong file mới → sẽ mất thông số.
      if (t.mat && t.mat.length) p.push(`<span class="err">file thiếu: ${t.mat.join(", ")}</span>`);
      dMsg.innerHTML = p.join(" · ");
    }
    dossierStatus();
  } catch (e) { dMsg.innerHTML = '<span class="err">' + esc(e.message) + "</span>"; }
}
$("#btnDossierPreview").onclick = () => dossierSend(true, false);
$("#btnDossierApply").onclick = () => {
  if (!confirm("Nhập hồ sơ này? Bản đang dùng sẽ bị thay hoàn toàn (có nút Hoàn tác).")) return;
  dossierSend(false, false);
};
dUndo.onclick = () => dossierSend(false, true);

/* Bảng tên tiếng Anh (nomaauto.us) — ba nấc: soạn (chưa ghi) → lưu → hoàn tác. Tên ở
   đây đi thẳng lên tên sản phẩm và tiêu đề bài trên trang bán hàng Mỹ. */
const enBody = $("#enBody"), enMsg = $("#enMsg"), enNow = $("#enNow"), enSave = $("#btnEnSave"), enUndo = $("#btnEnUndo");
const NGUON_EN = { bang: "bảng đang dùng", web_us: "tên sẵn trên web US", dich: "AI dịch", chua_co: "chưa có" };

async function enStatus() {
  try {
    const j = await (await fetch("/api/products/names-en", { credentials: "same-origin" })).json();
    if (!j.ok) throw new Error(j.error || "lỗi");
    const d = j.data;
    enNow.innerHTML = d.nguon === "kv"
      ? `· đã lưu ${d.so_ten} tên · ${new Date(d.cap_nhat).toLocaleDateString("vi-VN")}` +
        (d.thieu.length ? ` · <span class="err">thiếu mã: ${d.thieu.join(", ")}</span>` : "")
      : '· <span class="err">CHƯA có bảng tên — soạn rồi lưu trước khi đổi tên bên nomaauto.us</span>';
    enUndo.classList.toggle("hide", !d.co_ban_hoan_tac);
    /* Bản soạn lần trước còn treo → dựng lại ngay, khỏi bấm dịch lần nữa (mỗi lần soạn
       là một lần tốn tiền AI). */
    if (d.ban_nhap && (d.ban_nhap.items || []).length) veBangTenEn(d.ban_nhap.items,
      `<span class="pill amber">bản soạn ${new Date(d.ban_nhap.cap_nhat).toLocaleString("vi-VN")} — CHƯA lưu</span>`);
  } catch (e) { enNow.textContent = "· không đọc được trạng thái: " + e.message; }
}

function veBangTenEn(items, nhan) {
  enBody.innerHTML = `<table><thead><tr><th>Mã</th><th>Tên hồ sơ (VI)</th><th>Tên tiếng Anh</th><th>Nguồn</th></tr></thead><tbody>` +
    items.map((x) => `<tr><td><b>${esc(x.ma)}</b></td><td class="muted">${esc(x.ten_vn || "")}</td>
      <td><input class="enTen" data-ma="${esc(x.ma)}" value="${esc(x.de_xuat || "")}" style="width:100%;min-width:240px" /></td>
      <td class="muted">${esc(NGUON_EN[x.nguon] || x.nguon)}</td></tr>`).join("") + `</tbody></table>`;
  enSave.classList.toggle("hide", !items.length);
  if (nhan) enMsg.innerHTML = nhan;
}

async function enDraft(dichLai) {
  enMsg.textContent = dichLai ? "Đang dịch lại toàn bộ…" : "Đang soạn…";
  enSave.classList.add("hide");
  try {
    const j = await (await fetch("/api/products/names-en", {
      method: "POST", headers: headers(true), credentials: "same-origin",
      body: JSON.stringify({ mode: "draft", dich_lai: dichLai === true }),
    })).json();
    if (!j.ok) { enMsg.innerHTML = '<span class="err">' + esc(j.error || "lỗi") + "</span>"; return; }
    const d = j.data;
    veBangTenEn(d.items || []);
    // Thiếu nguồn (credential web Mỹ, lỗi dịch) phải nói thẳng — im lặng là lưu đè mất tên.
    enMsg.innerHTML = [`<span class="pill grey">xem trước — CHƯA ghi</span>`,
      `${(d.items || []).length} mã · AI dịch ${d.so_dich} · $${d.cost_usd}`,
      ...(d.canh_bao || []).map((c) => `<span class="err">${esc(c)}</span>`)].join(" · ");
  } catch (e) { enMsg.innerHTML = '<span class="err">' + esc(e.message) + "</span>"; }
}
$("#btnEnDraft").onclick = () => enDraft(false);
$("#btnEnRedo").onclick = () => {
  if (!confirm("Dịch lại TOÀN BỘ bằng AI? Tên đang có trong bảng và tên sẵn trên nomaauto.us sẽ bị đề xuất thay.")) return;
  enDraft(true);
};

    enStatus();
  } catch (e) { enMsg.innerHTML = '<span class="err">' + esc(e.message) + "</span>"; }
};
enUndo.onclick = async () => {
  if (!confirm("Hoàn tác về bảng tên trước đó?")) return;
  const j = await (await fetch("/api/products/names-en", {
    method: "POST", headers: headers(true), credentials: "same-origin", body: JSON.stringify({ mode: "revert" }),
  })).json();
  enMsg.innerHTML = j.ok ? `<span class="pill green">đã hoàn tác</span> ${j.data.so_ten} tên`
                         : '<span class="err">' + esc(j.error || "lỗi") + "</span>";
  enStatus();
};

// Bảng tên EN chỉ có nghĩa với nomaauto.us.
function capNhatNguon() {
  const laUS = site() === "nomaauto";
  $("#enCard").classList.toggle("hide", !laUS);
  if (laUS) enStatus();
}
dossierStatus();
capNhatNguon();
</script>
